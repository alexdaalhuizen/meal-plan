<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meal Plan</title>
<meta name="theme-color" content="#faf7f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meal Plan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#faf7f3; --card:#ffffff; --ink:#26201b; --muted:#7c6f64; --line:#e7ded2;
  --accent:#b4532a; --accent-soft:#fbeee6; --green:#2f6f4e; --green-soft:#e8f2ec;
  --amber:#a16207; --red:#b3261e;
  --shadow:0 1px 2px rgba(38,32,27,.06), 0 4px 14px rgba(38,32,27,.05);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#17140f; --card:#221d17; --ink:#f0e9e0; --muted:#a2958a; --line:#352d25;
    --accent:#e8834f; --accent-soft:#3a251a; --green:#6fbf92; --green-soft:#1e3229;
    --amber:#d9a441; --red:#e97066;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
a{color:var(--accent)}
code{font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--bg);padding:1px 5px;border-radius:5px;border:1px solid var(--line)}

header.app{
  position:sticky; top:0; z-index:40; background:var(--bg);
  border-bottom:1px solid var(--line); padding:14px 16px 0;
  padding-top:calc(14px + env(safe-area-inset-top));
}
.brandrow{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.brand{font-size:19px;font-weight:700;letter-spacing:-.02em}
.brand .dot{color:var(--accent)}
.sp{flex:1}
.tabs{display:flex;gap:4px}
.tab{
  appearance:none;border:0;background:none;padding:9px 14px 12px;
  color:var(--muted);font-weight:600;font-size:15px;
  border-bottom:2.5px solid transparent;margin-bottom:-1px;border-radius:8px 8px 0 0;
}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:1180px;margin:0 auto;padding:16px 16px 90px;padding-bottom:calc(90px + env(safe-area-inset-bottom))}

.syncpill{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);
  border-radius:99px;padding:4px 10px 4px 8px;font-size:12.5px;font-weight:600;color:var(--muted);
}
.syncpill .led{width:7px;height:7px;border-radius:99px;background:var(--muted)}
.syncpill[data-s="ok"] .led{background:var(--green)}
.syncpill[data-s="busy"] .led{background:var(--amber);animation:pulse 1s infinite}
.syncpill[data-s="err"] .led{background:var(--red)}
.syncpill[data-s="offline"] .led{background:var(--amber)}
.syncpill[data-s="off"] .led{background:var(--muted)}
@keyframes pulse{50%{opacity:.25}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 13px;border-radius:10px;font-size:14px;font-weight:600}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{opacity:.9;color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--accent)}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:8px}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.pill.green{background:var(--green-soft);color:var(--green)}
.empty{text-align:center;color:var(--muted);padding:34px 18px;font-size:14.5px}
input[type=text],input[type=number],input[type=search],input[type=url],select,textarea{
  background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 4px;text-transform:uppercase;letter-spacing:.04em}

.weeknav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.weeknav .wlabel{font-weight:700;font-size:16px;flex:1;text-align:center}
.weeknav .wlabel .sub{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.arrow{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:17px;line-height:1;display:grid;place-items:center}
.arrow:hover{border-color:var(--accent);color:var(--accent)}

.days{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(228px,1fr))}
.day{padding:12px 13px 13px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent), var(--shadow)}
.dayhead{display:flex;align-items:baseline;gap:6px;margin-bottom:9px}
.dayname{font-weight:700;font-size:14.5px}
.daydate{font-size:12.5px;color:var(--muted)}
.slot{margin-top:8px}
.slotlabel{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.meal{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:6px 7px 6px 9px;margin-bottom:5px}
.meal .nm{flex:1;font-size:13.5px;font-weight:600;line-height:1.3;text-align:left;background:none;border:0;padding:0}
.meal .nm:hover{color:var(--accent)}
.meal .sv{font-size:11.5px;color:var(--muted);font-weight:700;white-space:nowrap}
.meal .x{border:0;background:none;color:var(--muted);font-size:15px;line-height:1;padding:2px 3px;border-radius:6px}
.meal .x:hover{color:var(--red)}
.addslot{width:100%;border:1px dashed var(--line);background:none;color:var(--muted);border-radius:9px;padding:6px;font-size:13px;font-weight:600}
.addslot:hover{border-color:var(--accent);color:var(--accent);border-style:solid}
.addslot.ghostadd{border:0;color:var(--muted);opacity:.6;font-size:12px;margin-top:7px;padding:3px}
.addslot.ghostadd:hover{opacity:1;color:var(--green)}
.batchslot .slotlabel{color:var(--green)}
.batchslot .meal{background:var(--green-soft);border-color:transparent}
.meal.frozen{background:transparent;border-style:dashed}
.meal .snow{color:#4a90c2;margin-right:4px}
@media (prefers-color-scheme:dark){.meal .snow{color:#7cc0e8}}

.rgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.rcard{padding:14px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);width:100%}
.rcard:hover{border-color:var(--accent)}
.rcard h3{font-size:15.5px;margin-bottom:5px}
.tagrow{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.tag{font-size:11.5px;color:var(--muted);background:var(--bg);border:1px solid var(--line);padding:2px 7px;border-radius:99px}

.aisle h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:14px 4px 6px}
.item{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .cb{width:22px;height:22px;flex:none;margin-top:1px;border-radius:6px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;color:#fff;font-size:13px;padding:0}
.item.done .cb{background:var(--green);border-color:var(--green)}
.item .txt{flex:1;line-height:1.35;font-size:14.5px}
.item .txt .src{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.item.done .txt{text-decoration:line-through;color:var(--muted)}
.qtybtn{
  border:0;background:none;padding:0 1px;font:inherit;font-weight:700;color:var(--ink);
  border-bottom:1.5px dotted var(--muted);line-height:1.2;
}
.qtybtn:hover{color:var(--accent);border-bottom-color:var(--accent)}
.qtybtn.tweaked{color:var(--accent);border-bottom-style:solid;border-bottom-color:var(--accent)}
.item.done .qtybtn{border-bottom:0;color:inherit}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px 0 6px}
.stepper button{width:52px;height:52px;border-radius:14px;border:1px solid var(--line);
  background:var(--card);font-size:24px;line-height:1;font-weight:600}
.stepper button:hover{border-color:var(--accent);color:var(--accent)}
.stepper input{width:110px;text-align:center;font-size:22px;font-weight:700;padding:10px 6px}
.item .del{border:0;background:none;color:var(--muted);font-size:15px;padding:0 4px;opacity:.55}
.item .del:hover{opacity:1;color:var(--red)}

.overlay{position:fixed;inset:0;z-index:100;background:rgba(20,15,10,.5);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.overlay{align-items:center;padding:24px}}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:640px){.sheet{border-radius:16px}}
.sheethead{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:10px;z-index:2}
.sheethead h2{font-size:17px;flex:1}
.sheetbody{padding:16px}
.fieldrow{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}

/* Editor rows give the name a full line of its own — on a phone a flat row
   squeezes it down to a couple of characters. */
.ingedit{
  display:grid; grid-template-columns:78px 92px 1fr 32px; gap:8px; align-items:center;
  padding:10px; margin-bottom:8px; border:1px solid var(--line);
  border-radius:11px; background:var(--bg);
}
.ingedit .iname { grid-column:1 / span 3; grid-row:1; font-weight:600 }
.ingedit .rmi   { grid-column:4; grid-row:1 }
.ingedit .iqty  { grid-column:1; grid-row:2 }
.ingedit .iunit { grid-column:2; grid-row:2 }
.ingedit .iaisle{ grid-column:3 / span 2; grid-row:2; font-size:13px; color:var(--muted) }
.stepedit{
  display:grid; grid-template-columns:26px 1fr 32px; gap:8px; align-items:start;
  padding:10px; margin-bottom:8px; border:1px solid var(--line);
  border-radius:11px; background:var(--bg);
}
.stepedit .snum { grid-column:1; grid-row:1; margin-top:6px }
.stepedit .stext{ grid-column:2; grid-row:1 }
.stepedit .rms  { grid-column:3; grid-row:1 }
.stepedit .smins{ grid-column:2; grid-row:2; width:130px; font-size:13px }
.ingedit input, .ingedit select, .stepedit input, .stepedit textarea{ background:var(--card) }
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepnum{width:24px;height:24px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:800;display:grid;place-items:center;flex:none;margin-top:8px}
.ingline{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.ingline:last-child{border-bottom:0}
.method li{margin-bottom:10px;line-height:1.5}
.method li .t{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:99px;margin-left:6px;white-space:nowrap}
.menu{position:absolute;right:16px;top:52px;z-index:60;padding:6px;min-width:210px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 11px;border-radius:8px;font-size:14px}
.menu button:hover{background:var(--bg);color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:200;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:88vw;text-align:center}
pre.sql{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;margin:0}
.step{display:flex;gap:11px;margin-bottom:16px}
.step .n{width:23px;height:23px;border-radius:99px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:800;display:grid;place-items:center;flex:none;margin-top:2px}
.step .b{flex:1}
.note{background:var(--accent-soft);border-radius:10px;padding:11px 13px;font-size:13.5px;line-height:1.5}

/* ---------- welcome cards ---------- */
.wcwrap{position:fixed;inset:0;z-index:150;background:rgba(20,15,10,.55);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.wcwrap{align-items:center;padding:24px}}
.wc{background:var(--card);width:100%;max-width:460px;border-radius:20px 20px 0 0;
    box-shadow:0 -8px 40px rgba(0,0,0,.3);padding:26px 22px 18px;
    padding-bottom:calc(18px + env(safe-area-inset-bottom));touch-action:pan-y}
@media(min-width:640px){.wc{border-radius:18px}}
.wc .art{width:60px;height:60px;border-radius:17px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-size:29px;margin-bottom:16px}
.wc h2{font-size:21px;margin-bottom:8px;letter-spacing:-.02em}
.wc p{margin:0 0 10px;font-size:15.5px;line-height:1.55;color:var(--ink)}
.wc p.sub{color:var(--muted);font-size:14.5px}
.wc .card-body{min-height:196px}
.wcfoot{display:flex;align-items:center;gap:10px;margin-top:14px}
.dots{display:flex;gap:6px;flex:1;justify-content:center}
.dots i{width:7px;height:7px;border-radius:99px;background:var(--line);display:block}
.dots i.on{background:var(--accent);width:20px}
.helpsec{margin:0 0 22px}
.helpsec h3{font-size:15.5px;margin-bottom:6px}
.helpsec p{margin:0 0 9px;font-size:14.8px;line-height:1.6;color:var(--ink)}
.helpsec p.q{color:var(--muted);font-size:14px}
.dotkey{display:flex;align-items:flex-start;gap:9px;margin-bottom:8px;font-size:14.5px;line-height:1.5}
.dotkey b{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;min-width:104px}
.dotkey .led{width:8px;height:8px;border-radius:99px;display:inline-block}
</style>
</head>
<body>

<header class="app">
  <div class="brandrow">
    <div class="brand">Meal Plan<span class="dot">.</span></div>
    <div class="sp"></div>
    <button class="syncpill" id="syncPill" data-s="off"><span class="led"></span><span id="syncTxt">Local</span></button>
    <button class="btn sm ghost" id="menuBtn" aria-label="Menu">&#9881;</button>
  </div>
  <nav class="tabs">
    <button class="tab on" data-tab="plan">Plan</button>
    <button class="tab" data-tab="recipes">Recipes</button>
    <button class="tab" data-tab="shopping">Shopping</button>
  </nav>
</header>

<main id="view"></main>
<div id="modal"></div>

<script>
"use strict";

/* =========================================================
   0. Keys, constants
   ========================================================= */
const APP_VERSION = "2026.08.17.3";
const CFG_KEY  = "mealplan.cfg";
const DATA_KEY = "mealplan.v2";
const AISLES = ["Produce","Meat & Fish","Dairy & Eggs","Bakery","Tins & Jars","Dry Goods","Herbs & Spices","Frozen","Household","Other"];
const UNITS  = ["","g","kg","ml","l","tsp","tbsp","clove","can","pack","bunch","handful","slice"];
const DAYNAMES = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const SLOTS = ["lunch","dinner","batch"];
const SLOT_LABEL = { lunch:"Lunch", dinner:"Dinner", batch:"Batch cook" };
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const uid = p => (p||"") + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);

/* =========================================================
   1. Local persistence  (never throws — degrades to memory)
   ========================================================= */
let storageOK = true;
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ storageOK=false; return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){ storageOK=false; } }

let cfg = { url:"", key:"", hh:"" };
try{ Object.assign(cfg, JSON.parse(lsGet(CFG_KEY)||"{}")); }catch(e){}
function saveCfg(){ lsSet(CFG_KEY, JSON.stringify(cfg)); }

/* The store is a flat bag of items so two people can edit different
   things at once without overwriting each other's work.            */
let S = { items:{}, pending:{}, watermark:null, seeded:false };
try{
  const raw = lsGet(DATA_KEY);
  if(raw){ const p = JSON.parse(raw); if(p && p.items) S = Object.assign(S, p); }
}catch(e){}
let saveTimer=null;
function saveLocal(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>lsSet(DATA_KEY, JSON.stringify(S)), 120);
}

/* =========================================================
   2. Item helpers
   ========================================================= */
function put(kind, id, doc){
  S.items[id] = { id, kind, doc, deleted:false, updated_at:new Date().toISOString() };
  S.pending[id] = 1; saveLocal(); kick();
  return id;
}
function drop(id){
  const it = S.items[id]; if(!it) return;
  it.deleted = true; it.updated_at = new Date().toISOString();
  S.pending[id] = 1; saveLocal(); kick();
}
function get(id){ const i=S.items[id]; return (i && !i.deleted) ? i : null; }
function all(kind){
  const out=[];
  for(const k in S.items){ const i=S.items[k]; if(i.kind===kind && !i.deleted) out.push(i); }
  return out;
}

/* =========================================================
   3. Sync engine — plain fetch against Supabase PostgREST
   ========================================================= */
let syncState = "off";        // off | ok | busy | err
let syncMsg = "";
let syncTimer=null, kickTimer=null;

const connected = () => !!(cfg.url && cfg.key && cfg.hh);
function base(){ return cfg.url.replace(/\/+$/,""); }
function api(path, opts){
  opts = opts || {};
  return fetch(base()+"/rest/v1/"+path, Object.assign({}, opts, {
    headers: Object.assign({
      apikey: cfg.key,
      Authorization: "Bearer "+cfg.key,
      "Content-Type": "application/json"
    }, opts.headers||{})
  }));
}
function setSync(state, msg){
  syncState=state; syncMsg=msg||"";
  const pill=document.getElementById("syncPill"), txt=document.getElementById("syncTxt");
  pill.dataset.s = state;
  const waiting = Object.keys(S.pending).length;
  txt.textContent =
      state==="ok"      ? "Synced"
    : state==="busy"    ? "Syncing"
    : state==="offline" ? (waiting ? "Offline · "+waiting : "Offline")
    : state==="err"     ? "Sync issue"
    :                     "Local only";
}

async function pull(){
  let q = "items?household=eq."+encodeURIComponent(cfg.hh)+"&select=id,kind,doc,deleted,updated_at";
  if(S.watermark) q += "&updated_at=gte."+encodeURIComponent(S.watermark);
  const r = await api(q);
  if(!r.ok) throw new Error("Couldn't read ("+r.status+")");
  const rows = await r.json();
  let changed=false, maxT = S.watermark ? new Date(S.watermark) : null;
  rows.forEach(row=>{
    const t = new Date(row.updated_at);
    if(!maxT || t>maxT) maxT = t;
    if(S.pending[row.id]) return;                       // our unpushed edit wins for now
    const cur = S.items[row.id];
    // Rows we already have, unchanged — usually our own writes coming back.
    // Treating these as "changed" would redraw the screen every few seconds
    // and wipe out anything being typed.
    if(cur && cur.updated_at === row.updated_at && cur.deleted === !!row.deleted) return;
    if(!cur || t >= new Date(cur.updated_at||0)){
      S.items[row.id] = { id:row.id, kind:row.kind, doc:row.doc, deleted:!!row.deleted, updated_at:row.updated_at };
      changed = true;
    }
  });
  if(maxT) S.watermark = maxT.toISOString();
  if(changed){ saveLocal(); render(); }
  return rows.length;
}

async function push(){
  const ids = Object.keys(S.pending);
  if(!ids.length) return 0;
  const payload = ids.map(id=>{
    const i = S.items[id];
    return { id:i.id, household:cfg.hh, kind:i.kind, doc:i.doc, deleted:!!i.deleted };
  });
  const r = await api("items?on_conflict=id", {
    method:"POST",
    headers:{ Prefer:"resolution=merge-duplicates,return=representation" },
    body: JSON.stringify(payload)
  });
  if(!r.ok){
    const body = await r.text();
    throw new Error("Couldn't save ("+r.status+") "+body.slice(0,120));
  }
  const rows = await r.json();
  rows.forEach(row=>{
    if(S.items[row.id]) S.items[row.id].updated_at = row.updated_at;
    delete S.pending[row.id];
  });
  saveLocal();
  return rows.length;
}

let syncing=false;
async function sync(quiet){
  if(!connected()){ setSync("off"); return; }
  if(syncing) return;
  syncing=true;
  if(!quiet) setSync("busy");
  try{
    await push();
    await pull();
    setSync("ok");
    // First run for a household writes the recipes and the rotation — redraw so they show.
    const wroteA = ensureRecipes(), wroteB = ensureRotation();
    if(wroteA || wroteB) render();
  }catch(e){
    // A flat "no internet" isn't a fault worth alarming anyone about.
    setSync(navigator.onLine ? "err" : "offline", e.message);
    console.warn("sync", e);
  }finally{ syncing=false; }
}
function kick(){ clearTimeout(kickTimer); kickTimer = setTimeout(()=>sync(true), 500); }
/* Poll faster on the shopping list — that's the screen two people use at
   the same time, one in the shop and one at home. */
const pollEvery = () => tab === "shopping" ? 4000 : 12000;
let pollRate = 0;
function startSync(quiet){
  clearInterval(syncTimer);
  if(!connected()){ setSync("off"); return; }
  if(!quiet) sync();
  pollRate = pollEvery();
  syncTimer = setInterval(()=>{ if(document.visibilityState==="visible") sync(true); }, pollRate);
}
/* Called whenever the tab changes, so the rate follows the screen. */
function retimeSync(){
  if(!connected()) return;
  if(pollEvery() !== pollRate) startSync(true);
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") sync(true); });
window.addEventListener("online", ()=>sync());
window.addEventListener("offline", ()=>{ if(connected()) setSync("offline"); });

/* base64url for the invite link */
function b64e(str){
  const bytes = new TextEncoder().encode(str);
  let s=""; bytes.forEach(b=>s+=String.fromCharCode(b));
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64d(b64){
  const s = atob(b64.replace(/-/g,"+").replace(/_/g,"/"));
  const bytes = new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) bytes[i]=s.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function inviteLink(){
  const payload = b64e(JSON.stringify({u:cfg.url,k:cfg.key,h:cfg.hh}));
  return location.origin + location.pathname + "#s=" + payload;
}
/* Accepts a whole invite link or just the code after #s=.
   The paste route matters on iPhone: a home-screen app gets its own
   storage, so she may need to paste the link once more inside it. */
function applyInvite(str){
  if(!str) return false;
  const m = String(str).match(/#s=([A-Za-z0-9\-_]+)/) || String(str).trim().match(/^([A-Za-z0-9\-_]{20,})$/);
  if(!m) return false;
  try{
    const o = JSON.parse(b64d(m[1]));
    if(!o.u||!o.k||!o.h) return false;
    cfg.url=o.u; cfg.key=o.k; cfg.hh=o.h; saveCfg();
    S.watermark = null;                                  // fresh device: pull everything
    return true;
  }catch(e){ return false; }
}
function readInvite(){
  if(!location.hash.startsWith("#s=")) return false;
  const ok = applyInvite(location.hash);
  history.replaceState(null,"",location.pathname);
  return ok;
}

/* =========================================================
   4. Dates
   ========================================================= */
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseISO(s){ const p=s.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
function addDays(d,n){ const x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function mondayOf(d){ const x=new Date(d.getTime()); const wd=(x.getDay()+6)%7; x.setDate(x.getDate()-wd); x.setHours(0,0,0,0); return x; }
function fmtShort(d){ return d.getDate()+" "+MONTHS[d.getMonth()]; }
function weekDates(w){ const m=parseISO(w); return Array.from({length:7},(_,i)=>addDays(m,i)); }

let tab="plan";
let week = iso(mondayOf(new Date()));
let recipeSearch="";

/* =========================================================
   5. Units
   ========================================================= */
const WHOLE   = ["","can","pack","bunch","slice","clove"];
const COUNTED = ["clove","can","pack","bunch","handful","slice"];
function canon(unit){
  const u=(unit||"").toLowerCase().trim();
  if(u==="kg") return {u:"g", f:1000};
  if(u==="l"||u==="litre") return {u:"ml", f:1000};
  if(u==="tbsp") return {u:"tsp", f:3};
  return {u:u, f:1};
}
function prettyQty(n,u,shopping){
  if(n==null||n==="") return "";
  let unit=u, val=Number(n);
  if(shopping && WHOLE.includes(unit)) val = Math.ceil(val-1e-9);
  if(unit==="g" && val>=1000){ unit="kg"; val=val/1000; }
  else if(unit==="ml" && val>=1000){ unit="l"; val=val/1000; }
  else if((unit==="g"||unit==="ml") && val>=25) val = Math.round(val/5)*5;
  else if(unit==="tsp"){
    val = Math.max(0.25, Math.round(val*4)/4);
    if(val>=3 && Math.abs(val/3 - Math.round(val*10/3)/10) < 1e-9){ unit="tbsp"; val=val/3; }
  }
  const s = String(Math.round(val*100)/100);
  if(!unit) return s;
  if(COUNTED.includes(unit)) return s+" "+unit+(val===1?"":"s");
  return s+unit;
}
const plural = (n,w) => n===1 ? w : w+"s";

/* "onion" and "onions" are the same thing on a shopping list; "red onion"
   is not. So we fold plurals for matching, but keep every other word. */
function singular(w){
  if(w.length < 4) return w;
  if(/ies$/.test(w)) return w.slice(0,-3)+"y";
  if(/(ses|xes|zes|ches|shes)$/.test(w)) return w.slice(0,-2);
  if(/oes$/.test(w)) return w.slice(0,-2);
  if(/(ss|us|is)$/.test(w)) return w;
  if(/s$/.test(w)) return w.slice(0,-1);
  return w;
}
function normItem(s){
  return String(s).toLowerCase().trim().replace(/[.,]+$/,"").replace(/\s+/g," ")
         .split(" ").map(singular).join(" ");
}
function pluralise(s){
  const parts = s.split(" ");
  let w = parts[parts.length-1];
  if(/s$/i.test(w)) return s;                       // already plural
  if(/(tomato|potato)$/i.test(w)) w += "es";
  else if(/[^aeiou]y$/i.test(w)) w = w.slice(0,-1)+"ies";
  else if(/(ch|sh|x|z|ss)$/i.test(w)) w += "es";
  else w += "s";
  parts[parts.length-1] = w;
  return parts.join(" ");
}
/* Only pluralise things we're counting — "3 onions" but never "200g flours". */
function itemLabel(item, qty, unit){
  if(unit || qty==null || qty==="") return item;
  return Math.ceil(Number(qty)-1e-9) > 1 ? pluralise(item) : item;
}

/* =========================================================
   6. Domain accessors
   ========================================================= */
const household = () => { const s=get("setting:household"); return (s && s.doc.value) || 2; };
function recipes(){ return all("recipe").sort((a,b)=>a.doc.name.localeCompare(b.doc.name)); }
function recipeById(id){ const i=get(id); return (i && i.kind==="recipe") ? i : null; }
function mealsOn(dateISO, slot){
  return all("meal").filter(m=>m.doc.date===dateISO && m.doc.slot===slot)
                    .sort((a,b)=>(a.doc.order||0)-(b.doc.order||0));
}
function weekMeals(w){
  const days = weekDates(w).map(iso);
  return all("meal").filter(m=>days.includes(m.doc.date))
                    .sort((a,b)=>(a.doc.date+a.doc.slot).localeCompare(b.doc.date+b.doc.slot));
}
const tickId = (w,k) => "k:"+w+":"+k;
const hideId = (w,k) => "h:"+w+":"+k;
const adjId  = (w,k) => "a:"+w+":"+k;
const isOn = id => { const i=get(id); return !!(i && i.doc.on); };
/* How much you've added on top of what the recipes ask for, this week. */
const adjOf = (w,k) => { const i=get(adjId(w,k)); return i ? (Number(i.doc.extra)||0) : 0; };
/* Sensible nudge per tap: 50g at a time, but one carrot at a time. */
const stepFor = u => (u==="g"||u==="ml") ? 50 : 1;

function buildList(w){
  const map = new Map();
  weekMeals(w).forEach(m=>{
    if(m.doc.frozen) return;              // already in the freezer — nothing to buy
    const r = recipeById(m.doc.recipeId); if(!r) return;
    const factor = (m.doc.servings || r.doc.servings) / (r.doc.servings || 1);
    r.doc.ingredients.forEach(ing=>{
      if(!ing.item) return;
      const c = canon(ing.unit);
      const key = normItem(ing.item)+"|"+c.u;
      const qty = (ing.qty==null||ing.qty==="") ? null : Number(ing.qty)*c.f*factor;
      if(!map.has(key)) map.set(key,{key,item:ing.item.trim(),unit:c.u,qty:qty,aisle:ing.aisle||"Other",sources:new Set([r.doc.name])});
      else { const e=map.get(key); if(qty!=null) e.qty=(e.qty||0)+qty; e.sources.add(r.doc.name); }
    });
  });
  const items = [...map.values()]
    .filter(e=>!isOn(hideId(w,e.key)))
    .map(e=>{
      const extra = adjOf(w, e.key);
      const base = e.qty;
      // An adjustment can also give a quantity to something that had none.
      const qty = extra ? Math.max(0, (base==null?0:base) + extra) : base;
      return {...e, base, extra, qty, sources:[...e.sources], done:isOn(tickId(w,e.key))};
    });
  items.sort((a,b)=>{
    const ai=AISLES.indexOf(a.aisle), bi=AISLES.indexOf(b.aisle);
    if(ai!==bi) return (ai<0?99:ai)-(bi<0?99:bi);
    return a.item.localeCompare(b.item);
  });
  return items;
}
function extrasFor(w){ return all("extra").filter(x=>x.doc.week===w).sort((a,b)=>(a.doc.order||0)-(b.doc.order||0)); }

/* =========================================================
   7. Rendering
   ========================================================= */
const view = document.getElementById("view");
const modal = document.getElementById("modal");
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function render(){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on", b.dataset.tab===tab));
  if(tab==="plan") renderPlan();
  else if(tab==="recipes") renderRecipes();
  else renderShopping();
}
function weekNav(){
  const d=weekDates(week), thisWeek=iso(mondayOf(new Date()));
  const rel=Math.round((parseISO(week)-parseISO(thisWeek))/(7*864e5));
  const relTxt = rel===0?"This week":rel===1?"Next week":rel===-1?"Last week":(rel>0?"In "+rel+" weeks":Math.abs(rel)+" weeks ago");
  return '<div class="weeknav">'
    + '<button class="arrow" data-week="-1" aria-label="Previous week">‹</button>'
    + '<div class="wlabel">'+fmtShort(d[0])+' – '+fmtShort(d[6])+' '+d[6].getFullYear()+'<span class="sub">'+relTxt+'</span></div>'
    + '<button class="arrow" data-week="1" aria-label="Next week">›</button>'
    + (rel!==0?'<button class="btn sm" data-week="0">Today</button>':'')
    + '</div>';
}

function renderPlan(){
  const today=iso(new Date());
  let html = weekNav() + '<div class="days">';
  weekDates(week).forEach((d,i)=>{
    const ds=iso(d);
    html += '<div class="card day'+(ds===today?" today":"")+'">'
      + '<div class="dayhead"><span class="dayname">'+DAYNAMES[i]+'</span><span class="daydate">'+fmtShort(d)+'</span></div>';
    SLOTS.forEach(slot=>{
      const entries = mealsOn(ds,slot);
      // The batch row only takes up space on days you're actually batch cooking.
      if(slot==="batch" && !entries.length) return;
      html += '<div class="slot'+(slot==="batch"?" batchslot":"")+'"><div class="slotlabel">'+SLOT_LABEL[slot]+'</div>';
      entries.forEach(m=>{
        const r = recipeById(m.doc.recipeId);
        if(!r) return;
        html += '<div class="meal'+(m.doc.frozen?" frozen":"")+'">'
          + '<button class="nm" data-openrecipe="'+r.id+'">'+(m.doc.frozen?'<span class="snow">❄</span>':"")+esc(r.doc.name)+'</button>'
          + '<span class="sv">'+m.doc.servings+'</span>'
          + '<button class="x" data-delmeal="'+m.id+'" aria-label="Remove">×</button></div>';
      });
      html += '<button class="addslot" data-add="'+ds+"|"+slot+'">+ Add</button></div>';
    });
    if(!mealsOn(ds,"batch").length)
      html += '<button class="addslot ghostadd" data-add="'+ds+'|batch">+ Batch cook</button>';
    html += '</div>';
  });
  html += '</div>';
  const n = weekMeals(week).length;
  html += '<div class="row wrap" style="margin-top:16px;gap:8px">'
    + '<button class="btn sm" data-act="copylast">Copy last week</button>'
    + '<button class="btn sm danger" data-act="clearweek">Clear week</button>'
    + '<div class="sp"></div><span class="small muted">'+n+" "+plural(n,"meal")+' planned</span></div>';
  view.innerHTML = html;
}

function renderRecipes(){
  const q=recipeSearch.toLowerCase();
  const list = recipes().filter(r=>!q || r.doc.name.toLowerCase().includes(q) || (r.doc.tags||[]).join(" ").toLowerCase().includes(q));
  let html = '<div class="row" style="margin-bottom:14px;gap:8px">'
    + '<input type="search" id="rsearch" placeholder="Search recipes…" value="'+esc(recipeSearch)+'">'
    + '<button class="btn primary" data-act="newrecipe" style="white-space:nowrap">+ New</button></div>';
  if(!list.length){
    html += '<div class="card empty">No recipes'+(q?" match “"+esc(recipeSearch)+"”":" yet")+'.</div>';
  }else{
    html += '<div class="rgrid">' + list.map(r=>
      '<button class="rcard" data-openrecipe="'+r.id+'"><h3>'+esc(r.doc.name)+'</h3>'
      + '<div class="small muted">Serves '+r.doc.servings+' · '+r.doc.time+' min · '+r.doc.steps.length+' steps</div>'
      + '<div class="tagrow">'+(r.doc.batch?'<span class="pill green">Batch</span>':"")
      + (r.doc.tags||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join("")+'</div></button>').join("") + '</div>';
  }
  view.innerHTML = html;
  const s=document.getElementById("rsearch");
  s.addEventListener("input", e=>{
    recipeSearch=e.target.value; const p=e.target.selectionStart;
    renderRecipes();
    const n2=document.getElementById("rsearch"); n2.focus(); n2.setSelectionRange(p,p);
  });
}

/* Everything on the list — worked out from the meals, plus anything typed
   in by hand — as one sorted set of rows. */
function shoppingRows(w){
  const rows = buildList(w).map(it=>({
      kind:"calc", key:it.key, item:itemLabel(it.item,it.qty,it.unit), raw:it.item,
      qty:it.qty, base:it.base, extra:it.extra, unit:it.unit,
      aisle:it.aisle, sources:it.sources, done:it.done }))
    .concat(extrasFor(w).map(x=>({
      kind:"extra", id:x.id, item:x.doc.text, qty:null, unit:"",
      aisle:x.doc.aisle||"Other", sources:[], done:!!x.doc.checked })));
  rows.sort((a,b)=>{
    const ai=AISLES.indexOf(a.aisle), bi=AISLES.indexOf(b.aisle);
    if(ai!==bi) return (ai<0?99:ai)-(bi<0?99:bi);
    return a.item.localeCompare(b.item);
  });
  return rows;
}

function renderShopping(){
  const rows = shoppingRows(week), meals = weekMeals(week);
  const addBtn = '<button class="btn primary" data-act="additems" style="width:100%;margin-top:18px;padding:11px">+ Add items to the list</button>';
  let html = weekNav();

  if(!rows.length){
    view.innerHTML = html
      + '<div class="card empty">Nothing on the list yet.<br><span class="small">Plan some meals for this week, or add anything you need below.</span></div>'
      + addBtn;
    return;
  }

  const doneN = rows.filter(r=>r.done).length;
  html += '<div class="row wrap small muted" style="margin:-4px 4px 10px">'
    + '<span>'+doneN+" of "+rows.length+' picked up · '+meals.length+" "+plural(meals.length,"meal")+'</span>'
    + '<div class="sp"></div>'
    + '<span class="row" style="gap:2px">'
    + '<button class="btn sm ghost" data-act="copylist">Copy as text</button>'
    + '<button class="btn sm ghost" data-act="resetlist">Reset ticks</button></span></div>';

  let cur=null, body="";
  rows.forEach(r=>{
    if(r.aisle!==cur){ if(cur!==null) body+='</div>'; cur=r.aisle; body+='<h3>'+esc(cur)+'</h3><div class="card">'; }
    const tick = r.kind==="calc" ? 'data-tick="'+esc(r.key)+'"' : 'data-tickx="'+r.id+'"';
    const del  = r.kind==="calc" ? 'data-hide="'+esc(r.key)+'" title="Already have it"' : 'data-delx="'+r.id+'"';
    // On calculated rows the quantity is tappable, so you can buy more than
    // the recipes strictly need.
    const qtyHTML = r.kind==="calc"
      ? '<button class="qtybtn'+(r.extra?" tweaked":"")+'" data-adjust="'+esc(r.key)+'">'
        + (r.qty!=null ? prettyQty(r.qty,r.unit,true) : "+") + '</button> '
      : (r.qty!=null?'<span class="qty" style="font-weight:700">'+prettyQty(r.qty,r.unit,true)+'</span> ':"");
    const note = (r.kind==="calc" && r.extra)
      ? '<span class="src">'+(r.base?prettyQty(r.base,r.unit,true)+" for meals · ":"")
        +(r.extra>0?"+":"−")+prettyQty(Math.abs(r.extra),r.unit,true)+' added</span>'
      : (r.sources.length?'<span class="src">'+esc(r.sources.join(", "))+'</span>':"");
    body += '<div class="item'+(r.done?" done":"")+'">'
      + '<button class="cb" '+tick+'>'+(r.done?"✓":"")+'</button>'
      + '<div class="txt">' + qtyHTML + esc(r.item) + note
      + '</div><button class="del" '+del+'>×</button></div>';
  });
  if(cur!==null) body+='</div>';
  view.innerHTML = html + '<div class="aisle">'+body+'</div>' + addBtn;
}

/* Buy more (or less) of something than the week's meals strictly need —
   an extra bag of carrots for snacking, say. Stored per week. */
let adjKey = null;
function openAdjust(key){
  const r = shoppingRows(week).find(x=>x.kind==="calc" && x.key===key);
  if(!r) return;
  adjKey = key;
  const unitTxt = r.unit || "";
  let total = r.qty==null ? 0 : r.qty;
  // Match what the list shows, so the number doesn't appear to change on tap.
  if((r.unit==="g"||r.unit==="ml") && total>=25) total = Math.round(total/5)*5;
  sheet("How much to buy",
      '<p style="margin:0 0 4px;font-size:17px;font-weight:650">'+esc(r.raw)+'</p>'
    + '<p class="small muted" style="margin:0">'
    + (r.base ? 'Your meals this week need '+prettyQty(r.base,r.unit,true)+'.'
              : 'Your meals don’t give this a quantity.')
    + '</p>'
    + '<div class="stepper">'
    + '<button data-step="-1" aria-label="Less">−</button>'
    + '<input type="number" id="adjVal" min="0" step="any" value="'+(Math.round(total*100)/100)+'">'
    + '<button data-step="1" aria-label="More">+</button></div>'
    + '<p class="small muted" style="text-align:center;margin:0 0 18px">'+(unitTxt?esc(unitTxt):"how many")+' to buy</p>'
    + '<div class="row" style="gap:8px"><button class="btn primary" data-act="adjsave">Done</button>'
    + (r.extra?'<button class="btn ghost" data-act="adjreset">Back to recipe amount</button>':"")
    + '</div>');
}
function stepAdjust(dir){
  const inp = document.getElementById("adjVal"); if(!inp) return;
  const r = shoppingRows(week).find(x=>x.kind==="calc" && x.key===adjKey);
  const step = stepFor(r ? r.unit : "");
  const now = Number(inp.value)||0;
  inp.value = Math.max(0, Math.round((now + dir*step)*100)/100);
}
function saveAdjust(){
  const inp = document.getElementById("adjVal");
  const r = shoppingRows(week).find(x=>x.kind==="calc" && x.key===adjKey);
  if(!inp || !r){ closeModal(); return; }
  const want = Math.max(0, Number(inp.value)||0);
  const base = r.base==null ? 0 : r.base;
  const extra = Math.round((want - base)*100)/100;
  if(extra === 0) drop(adjId(week, adjKey));
  else put("adj", adjId(week, adjKey), {week, key:adjKey, extra});
  closeModal(); renderShopping();
}
function resetAdjust(){
  drop(adjId(week, adjKey));
  closeModal(); renderShopping(); toast("Back to the recipe amount");
}

/* Type as many things as you like, one per line or comma separated. */
function openAddItems(){
  const opts = AISLES.map(a=>'<option value="'+a+'"'+(a==="Other"?" selected":"")+'>'+a+'</option>').join("");
  sheet("Add to the list",
      '<p class="small muted" style="margin:0 0 12px">One per line, or separated by commas. Anything at all — washing up liquid, tissues, a birthday card.</p>'
    + '<textarea id="bulkItems" rows="7" placeholder="washing up liquid&#10;tissues&#10;bin bags, foil"></textarea>'
    + '<label class="f" style="margin-top:14px">Where in the shop?</label>'
    + '<select id="bulkAisle">'+opts+'</select>'
    + '<p class="tiny muted" style="margin:8px 0 0">Only affects where they sit on the list. Household covers cleaning and toiletries.</p>'
    + '<div class="row" style="margin-top:18px;gap:8px"><button class="btn primary" data-act="addbulk">Add to list</button>'
    + '<button class="btn ghost" data-close>Cancel</button></div>');
  setTimeout(()=>{ const t=document.getElementById("bulkItems"); if(t) t.focus(); }, 60);
}
function addBulkItems(){
  const ta = document.getElementById("bulkItems");
  const aisle = document.getElementById("bulkAisle").value || "Other";
  const names = (ta.value||"").split(/[\n,]/).map(s=>s.trim()).filter(Boolean);
  if(!names.length){ toast("Nothing to add"); return; }
  const seen = new Set(extrasFor(week).map(x=>normItem(x.doc.text)));
  let added = 0, dupes = 0;
  names.forEach((text,i)=>{
    const k = normItem(text);
    if(seen.has(k)){ dupes++; return; }
    seen.add(k);
    put("extra", uid("x-"), {week, text, checked:false, order:Date.now()+i, aisle});
    added++;
  });
  closeModal(); renderShopping();
  toast(added
    ? added+" "+plural(added,"item")+" added"+(dupes?" ("+dupes+" already on the list)":"")
    : "Already on the list");
}

/* =========================================================
   8. Sheets
   ========================================================= */
function closeModal(){ modal.innerHTML=""; }
function sheet(title, bodyHTML, headExtra){
  modal.innerHTML = '<div class="overlay" data-overlay><div class="sheet">'

function openEditor(id, focus){

    + '<label class="row small" style="gap:8px;margin-bottom:8px"><input type="checkbox" data-d="freezer.ok" '+(r.freezer.ok?"checked":"")+' style="width:auto"> Freezer friendly</label>'
    + '<input type="text" data-d="freezer.note" value="'+esc(r.freezer.note||"")+'" placeholder="Freezing note (optional)" style="margin-bottom:18px">'
    + '<label class="f" id="editIng">Ingredients</label>';
  r.ingredients.forEach((i,n)=>{
    h += '<div class="ingedit">'
      + '<input class="iname" type="text" placeholder="Ingredient" value="'+esc(i.item)+'" data-ing="'+n+'" data-k="item">'
      + '<button class="btn sm ghost rmi" data-rmi="'+n+'" aria-label="Remove">×</button>'
      + '<input class="iqty" type="number" step="any" placeholder="Qty" value="'+(i.qty==null?"":i.qty)+'" data-ing="'+n+'" data-k="qty">'
      + '<select class="iunit" data-ing="'+n+'" data-k="unit">'+unitOpts(i.unit)+'</select>'
      + '<select class="iaisle" data-ing="'+n+'" data-k="aisle">'+aisleOpts(i.aisle)+'</select>'
      + '</div>';
  });
  h += '<button class="btn sm" data-addi style="margin:4px 0 18px">+ Ingredient</button><label class="f" id="editStep">Method</label>';
  r.steps.forEach((s,n)=>{
    h += '<div class="stepedit"><div class="stepnum snum">'+(n+1)+'</div>'
      + '<textarea class="stext" rows="3" placeholder="What to do" data-step="'+n+'" data-k="text">'+esc(s.text)+'</textarea>'
      + '<button class="btn sm ghost rms" data-rms="'+n+'" aria-label="Remove">×</button>'
      + '<input class="smins" type="number" min="0" placeholder="timer (min)" value="'+(s.mins||"")+'" data-step="'+n+'" data-k="mins">'
      + '</div>';
  });
  h += '<button class="btn sm" data-adds style="margin:4px 0 20px">+ Step</button>';

  const n = r.nutrition;
  h += '<details style="margin-bottom:20px"><summary class="f" style="cursor:pointer;margin-bottom:12px">More details</summary>'
    + '<label class="f">Equipment <span style="text-transform:none;font-weight:400">— one per line</span></label>'
    + '<textarea rows="3" data-list="equipment" style="margin-bottom:12px">'+esc((r.equipment||[]).join("\n"))+'</textarea>'
    + '<label class="f">Chef’s tips <span style="text-transform:none;font-weight:400">— one per line</span></label>'
    + '<textarea rows="4" data-list="tips" style="margin-bottom:12px">'+esc((r.tips||[]).join("\n"))+'</textarea>'
    + '<label class="f">Serve with <span style="text-transform:none;font-weight:400">— one per line</span></label>'
    + '<textarea rows="3" data-list="serveWith" style="margin-bottom:12px">'+esc((r.serveWith||[]).join("\n"))+'</textarea>'
    + '<label class="f">Storage</label>'
    + '<input type="text" data-d="storage.fridge" value="'+esc(r.storage.fridge||"")+'" placeholder="Fridge" style="margin-bottom:8px">'

    + '<div><input type="number" data-d="nutrition.kcal" value="'+(n.kcal||"")+'" placeholder="kcal"></div>'
    + '<div><input type="number" data-d="nutrition.protein" value="'+(n.protein||"")+'" placeholder="protein g"></div>'
    + '<div><input type="number" data-d="nutrition.carbs" value="'+(n.carbs||"")+'" placeholder="carbs g"></div>'
    + '<div><input type="number" data-d="nutrition.fat" value="'+(n.fat||"")+'" placeholder="fat g"></div>'
    + '<div><input type="number" data-d="nutrition.fibre" value="'+(n.fibre||"")+'" placeholder="fibre g"></div>'
    + '<div><input type="text" data-d="nutrition.note" value="'+esc(n.note||"")+'" placeholder="note"></div>'
    + '</div></details>';

  h += '<div class="row"><button class="btn primary" data-act="saverecipe">Save recipe</button><button class="btn ghost" data-close>Cancel</button></div>'
    + '<p class="tiny muted" style="margin-top:12px">Minutes on a step are optional — they power the cook-along timers.</p>';
  sheet(draftId?"Edit recipe":"New recipe", h);

  const NUMS = ["servings","time","prep","cook"];
  modal.querySelectorAll("[data-d]").forEach(el=>el.addEventListener("change",()=>{
    const k=el.dataset.d;
    if(k.indexOf(".")>-1){                                  // freezer.ok, nutrition.kcal, …
      const [a,b]=k.split(".");
      draft[a] = draft[a] || {};
      draft[a][b] = el.type==="checkbox" ? el.checked
                  : el.type==="number"   ? (el.value===""?"":Number(el.value))
                  : el.value;
      return;
    }
    if(k==="batch") draft.batch=el.checked;
    else if(k==="tags") draft.tags=el.value.split(",").map(s=>s.trim()).filter(Boolean);
    else if(NUMS.includes(k)) draft[k]=Number(el.value)||(k==="servings"||k==="time"?1:0);
    else draft[k]=el.value;
  }));
  modal.querySelectorAll("[data-list]").forEach(el=>el.addEventListener("change",()=>{
    draft[el.dataset.list] = el.value.split("\n").map(s=>s.trim()).filter(Boolean);
  }));
  modal.querySelectorAll("[data-ing]").forEach(el=>el.addEventListener("change",()=>{
    const i=Number(el.dataset.ing), k=el.dataset.k;
    draft.ingredients[i][k] = (k==="qty") ? (el.value===""?null:Number(el.value)) : el.value;
  }));
  modal.querySelectorAll("[data-step]").forEach(el=>el.addEventListener("change",()=>{
    const i=Number(el.dataset.step), k=el.dataset.k;
    draft.steps[i][k] = (k==="mins") ? (el.value===""?"":Number(el.value)) : el.value;
  }));
}
function commitInputs(){ modal.querySelectorAll("[data-d],[data-ing],[data-step],[data-list]").forEach(el=>el.dispatchEvent(new Event("change"))); }
function saveRecipe(){
  commitInputs();
  if(!draft.name.trim()){ toast("Give the recipe a name"); return; }
  draft.ingredients = draft.ingredients.filter(i=>i.item.trim());
  draft.steps = draft.steps.filter(s=>s.text.trim());
  put("recipe", draftId || uid("r-"), draft);
  closeModal(); render(); toast("Saved");
}

const SQL = `create table if not exists public.items (
  id         text primary key,
  household  text not null,
  kind       text not null,
  doc        jsonb not null default '{}'::jsonb,
  deleted    boolean not null default false,
  updated_at timestamptz not null default now()
);
create index if not exists items_hh_upd on public.items (household, updated_at);

create or replace function public.touch_items() returns trigger as $$
begin new.updated_at = now(); return new; end;
$$ language plpgsql;

drop trigger if exists items_touch on public.items;
create trigger items_touch before insert or update on public.items
  for each row execute function public.touch_items();

alter table public.items enable row level security;
drop policy if exists items_read   on public.items;
drop policy if exists items_write  on public.items;
drop policy if exists items_modify on public.items;
create policy items_read   on public.items for select to anon using (true);
create policy items_write  on public.items for insert to anon with check (true);
create policy items_modify on public.items for update to anon using (true) with check (true);
grant select, insert, update on public.items to anon;`;

let wcIndex = 0;
function openWelcome(){
  wcIndex = 0;
  const el = document.createElement("div");
  el.className = "wcwrap"; el.id = "wcwrap";
  document.body.appendChild(el);
  drawWelcome();
  let x0 = null;
  el.addEventListener("touchstart", e=>{ x0 = e.changedTouches[0].clientX; }, {passive:true});
  el.addEventListener("touchend", e=>{
    if(x0===null) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if(dx < -45) stepWelcome(1);
    else if(dx > 45) stepWelcome(-1);
  }, {passive:true});
}
function drawWelcome(){
  const el = document.getElementById("wcwrap"); if(!el) return;
  const c = CARDS[wcIndex], last = wcIndex === CARDS.length - 1;
  el.innerHTML = '<div class="wc">'
    + '<div class="card-body"><div class="art">'+c.art+'</div><h2>'+c.h+'</h2>'
    + c.p.map((t,i)=>'<p'+(i?' class="sub"':'')+'>'+t+'</p>').join("")
    + '</div><div class="wcfoot">'
    + '<button class="btn ghost" data-wc="'+(wcIndex?"back":"skip")+'">'+(wcIndex?"Back":"Skip")+'</button>'
    + '<span class="dots">'+CARDS.map((_,i)=>'<i class="'+(i===wcIndex?"on":"")+'"></i>').join("")+'</span>'
    + '<button class="btn primary" data-wc="next">'+(last?"Start planning":"Next")+'</button>'
    + '</div></div>';
  el.querySelectorAll("[data-wc]").forEach(b=>b.addEventListener("click", ()=>{
    const a = b.dataset.wc;
    if(a==="skip") closeWelcome();
    else if(a==="back") stepWelcome(-1);
    else stepWelcome(1);
  }));
}
function stepWelcome(d){
  if(wcIndex + d < 0) return;
  if(wcIndex + d >= CARDS.length){ closeWelcome(); return; }
  wcIndex += d; drawWelcome();
}
function closeWelcome(){
  const el = document.getElementById("wcwrap"); if(el) el.remove();
  lsSet(SEEN_KEY, "1");
}

  <div class="helpsec">
    <h3>Your three-week rotation</h3>
    <p>Gear → <b>Meal rotation</b> shows the three-week cycle the app was set up with, and lets you lay it out again from this Monday or the next. It fills six weeks at a time, which is two full cycles.</p>
    <p>Nothing runs automatically after that first fill, so any week you change stays changed. When you get near the end, open the rotation and refill — it writes over the weeks ahead, so do it from a week you haven't customised.</p>
  </div>

  <div class="helpsec">
    <h3>How the shopping list is worked out</h3>
    <p>Every ingredient of every meal that week is scaled by servings, then identical ingredients are merged into one line. A recipe serving four, planned for two, contributes half of everything.</p>
    <p>Units are converted before merging, so a tablespoon in one recipe and a teaspoon in another add up properly, and grams roll into kilograms once they pass a thousand. Anything you can only buy whole — tins, packs, avocados — rounds up, because half a tin isn't a thing.</p>
    <p>Under each line it says which meals it's for. That's how you tell whether the 8 cloves of garlic are worth buying two bulbs for.</p>
    <p>Tap the circle to tick something off. Tap the small <b>×</b> to remove a line entirely — that's for things you've already got in. <b>Reset ticks</b> puts everything back, and <b>Copy as text</b> gives you the whole list to paste into a message.</p>
    <p><b>Buying more than the recipes need.</b> Tap the <u>quantity</u> on any line and you can set what you actually want to buy — an extra bag of carrots for snacking, say. The line then reads in orange and shows the split, like "1 for meals · +3 added". Grams and millilitres step in fifties, everything else one at a time, and you can type an exact number instead. <b>Back to recipe amount</b> undoes it. Adjustments belong to that week only, so they don't follow you around.</p>
    <p class="q">Lines with no quantity, like fresh herbs, show a <b>+</b> instead — tap it to give them one.</p>
    <p class="q">Ticks are per week, so last week's shopping doesn't affect this week's.</p>
  </div>

  <div class="helpsec">
    <h3>Adding and editing recipes</h3>
    <p>Open any recipe and there's an <b>Edit</b> button at the top, next to Close. There are also Edit links beside the <b>Ingredients</b> and <b>Method</b> headings, which open the editor already scrolled to that part. <b>+ New</b> on the Recipes tab creates one from scratch.</p>
    <p>In the editor, every ingredient and every step is its own row. <b>+ Ingredient</b> and <b>+ Step</b> add more; the <b>×</b> at the end of a row removes it. Change these freely — they're your recipes now, and edits reach the other phone within seconds.</p>
    <p>For each ingredient give a quantity, a unit and an aisle. The aisle is what groups your shopping list, so getting it roughly right is worth the two seconds. Leave the unit blank for things you count, like onions.</p>
    <p>Each method step can have a number of minutes beside it. Those aren't used yet — they're waiting for the Start Cooking feature — but filling them in now means it'll work the day it arrives.</p>
    <p class="q">Deleting a recipe also removes any planned meals using it, so check the week first.</p>
  </div>

  <div class="helpsec">
    <h3>The coloured dot</h3>
    <div class="dotkey"><b>${led('#2f6f4e')}Synced</b><span>Everything's in step. Changes reach the other phone within about ten seconds.</span></div>
    <div class="dotkey"><b>${led('#a16207')}Offline</b><span>No signal. Carry on using it — the number beside it counts what's waiting, and it all sends when you're back.</span></div>
    <div class="dotkey"><b>${led('#b3261e')}Sync issue</b><span>Something's actually wrong. Tap the dot to see the error and the connection settings.</span></div>
    <div class="dotkey"><b>${led('#7c6f64')}Local only</b><span>Not sharing at all — this device is on its own. Usually means an invite link hasn't been applied yet.</span></div>
    <p style="margin-top:10px">If you both change different things at once, both changes survive — one of you adding Thursday's dinner while the other ticks off milk never collide. If you both edit the same recipe within a few seconds, the later save wins.</p>
  </div>

  <div class="helpsec">
    <h3>On your phone</h3>
    <p>Add it to your home screen so it opens like an app: on iPhone tap <b>Share</b> then <b>Add to Home Screen</b>; on Android use the browser menu and <b>Install app</b>.</p>
    <p><b>The iPhone catch.</b> A home-screen app gets storage separate from Safari, so the first time you open it that way it may say <i>Local only</i>. Copy the invite link — press and hold it, don't tap it — then here in the app go to <b>Sharing &amp; sync</b> and paste it into the box at the top. Once only.</p>
  </div>

  <div class="helpsec">
    <h3>Settings and backups</h3>
    <p><b>Default servings</b> sets what a new meal starts at, so you're not changing it every time.</p>
    <p><b>Export backup</b> saves everything to a file. Worth doing occasionally once you've typed in recipes you'd hate to lose. <b>Import backup</b> merges one back in.</p>
    <p><b>Reset this device</b> wipes the local copy only. If sharing is on, everything downloads again — it's a way to fix a device that's got itself confused, not a way to delete the plan.</p>
  </div>

  <div class="helpsec">
    <h3>When something looks wrong</h3>
    <p><b>A phone says Local only.</b> Paste the invite link into Sharing &amp; sync.</p>
    <p><b>Red dot after weeks of working.</b> The free database pauses after about a week of no use. Open the Supabase dashboard and press Restore — nothing is lost.</p>
    <p><b>Something's missing that the other person added.</b> Close and reopen the app, or tap the dot to force a sync. It checks every ten seconds while open, and immediately whenever you switch back to it.</p>
    <p><b>The shopping list looks wrong.</b> It's nearly always servings. Check the number next to each meal on the Plan tab.</p>
  </div>

  <div class="helpsec">
    <h3>Still to come</h3>
    <p>A freezer inventory, so finishing a batch cook adds portions and eating one takes it away. And <b>Start Cooking</b>, turning a recipe into a step-by-step guide with timers that chime when each step is due.</p>
  </div>

  <button class="btn" data-act="replaywelcome">Show the welcome cards again</button>`;
  sheet("How it works", h);
}

function toast(msg){
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2400);
}
function copyText(txt, okMsg){
  const done=()=>toast(okMsg||"Copied");
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallback());
  } else fallback();
  function fallback(){
    const ta=document.createElement("textarea");
    ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){ toast("Couldn't copy — select it manually"); }
    ta.remove();
  }
}
function listAsText(){
  const lines=[]; let cur=null;
  shoppingRows(week).forEach(r=>{
    if(r.aisle!==cur){ cur=r.aisle; lines.push(""); lines.push(cur.toUpperCase()); }
    lines.push((r.done?"[x] ":"[ ] ")+((r.qty!=null?prettyQty(r.qty,r.unit,true)+" ":"")+r.item).trim());
  });
  const d=weekDates(week);
  return "Shopping — "+fmtShort(d[0])+" to "+fmtShort(d[6])+"\n"+lines.join("\n").trim();
}

  const m=document.createElement("div");
  m.className="card menu";
  m.innerHTML = '<button data-act="rotation">Meal rotation…</button>'
    + '<button data-act="help">How it works…</button>'
    + '<button data-act="sharing">Sharing &amp; sync…</button>'
    + '<button data-act="household">Default servings: '+household()+'</button>'
    + '<button data-act="export">Export backup</button>'
    + '<button data-act="import">Import backup</button>'
    + '<button data-act="reset">Reset this device</button>'
    + '<button data-act="update">Check for update</button>'
    + '<div class="tiny muted" style="padding:6px 11px 4px">Version '+APP_VERSION+'</div>';
  document.body.appendChild(m);
  setTimeout(()=>document.addEventListener("click", function h(e){
    if(!m.contains(e.target)){ m.remove(); document.removeEventListener("click",h); }
  }),0);
}
const closeMenu = () => document.querySelectorAll(".menu").forEach(m=>m.remove());

  tab=b.dataset.tab; render(); window.scrollTo(0,0);

document.addEventListener("click", e=>{
  const t=e.target.closest("[data-week],[data-add],[data-delmeal],[data-openrecipe],[data-act],[data-pick],[data-tick],[data-tickx],[data-hide],[data-delx],[data-close],[data-overlay],[data-addi],[data-adds],[data-rmi],[data-rms],[data-adjust],[data-step]");
  if(!t) return;
  if(t.hasAttribute("data-overlay") && e.target===t){ closeModal(); return; }
  if(t.hasAttribute("data-close")){ closeModal(); return; }

  if(t.dataset.week!==undefined){
    const n=Number(t.dataset.week);
    week = n===0 ? iso(mondayOf(new Date())) : iso(addDays(parseISO(week), n*7));
    render(); window.scrollTo(0,0); return;
  }
  if(t.dataset.add){ const [d,s]=t.dataset.add.split("|"); openPicker(d,s); return; }
  if(t.dataset.delmeal){ drop(t.dataset.delmeal); render(); return; }
  if(t.dataset.openrecipe){ openRecipe(t.dataset.openrecipe); return; }
  if(t.dataset.pick){
    const serv=Number(document.getElementById("pserv").value)||household();
    const frozen=document.getElementById("pfrozen").checked;
    put("meal", uid("m-"), {date:pickTarget.dateISO, slot:pickTarget.slot, recipeId:t.dataset.pick,
                            servings:serv, order:Date.now(), frozen:frozen});
    closeModal(); render(); return;
  }
  if(t.dataset.adjust){ openAdjust(t.dataset.adjust); return; }
  if(t.dataset.step){ stepAdjust(Number(t.dataset.step)); return; }
  if(t.dataset.tick){ const id=tickId(week,t.dataset.tick); put("tick", id, {week, key:t.dataset.tick, on:!isOn(id)}); renderShopping(); return; }
  if(t.dataset.hide){ put("hide", hideId(week,t.dataset.hide), {week, key:t.dataset.hide, on:true}); renderShopping(); return; }
  if(t.dataset.tickx){ const x=get(t.dataset.tickx); if(x) put("extra", x.id, Object.assign({},x.doc,{checked:!x.doc.checked})); renderShopping(); return; }
  if(t.dataset.delx){ drop(t.dataset.delx); renderShopping(); return; }
  if(t.hasAttribute("data-addi")){ commitInputs(); draft.ingredients.push({qty:"",unit:"",item:"",aisle:"Produce"}); drawEditor(); return; }
  if(t.hasAttribute("data-adds")){ commitInputs(); draft.steps.push({text:"",mins:""}); drawEditor(); return; }
  if(t.hasAttribute("data-rmi")){ commitInputs(); draft.ingredients.splice(Number(t.dataset.rmi),1); drawEditor(); return; }
  if(t.hasAttribute("data-rms")){ commitInputs(); draft.steps.splice(Number(t.dataset.rms),1); drawEditor(); return; }

  const act=t.dataset.act; if(!act) return;
  if(act==="newrecipe") openEditor(null);
  else if(act==="editrecipe") openEditor(t.dataset.id, t.dataset.focus);
  else if(act==="saverecipe") saveRecipe();
  else if(act==="delrecipe"){
    if(confirm("Delete this recipe? Any planned meals using it will disappear.")){
      drop(t.dataset.id); closeModal(); render();
    }
  }
  else if(act==="clearweek"){
    if(confirm("Clear every meal from this week?")){ weekMeals(week).forEach(m=>drop(m.id)); render(); }
  }
  else if(act==="copylast"){
    const prevDays=weekDates(iso(addDays(parseISO(week),-7))).map(iso);
    const src=all("meal").filter(m=>prevDays.includes(m.doc.date));
    src.forEach(m=>{
      const offset = prevDays.indexOf(m.doc.date);
      put("meal", uid("m-"), Object.assign({}, m.doc, {date: iso(addDays(parseISO(week), offset)), order:Date.now()+offset}));
    });
    render(); toast(src.length?("Copied "+src.length+" "+plural(src.length,"meal")):"Last week was empty");
  }
  else if(act==="copylist") copyText(listAsText(), "List copied");
  else if(act==="resetlist"){
    all("tick").filter(i=>i.doc.week===week).forEach(i=>drop(i.id));
    all("hide").filter(i=>i.doc.week===week).forEach(i=>drop(i.id));
    renderShopping();
  }
  else if(act==="update"){
    /* Phones can sit on a cached copy for days. This throws the cache away
       and fetches the page fresh — the reliable way to pull in a new build. */
    closeMenu(); toast("Fetching the latest version…");
    (async()=>{
      try{
        if(window.caches){ const keys = await caches.keys(); await Promise.all(keys.map(k=>caches.delete(k))); }
        if(navigator.serviceWorker){
          const reg = await navigator.serviceWorker.getRegistration();
          if(reg) await reg.update();
        }
      }catch(e){ console.warn("update", e); }
      setTimeout(()=>location.reload(true), 700);
    })();
  }
  else if(act==="adjsave"){ saveAdjust(); }
  else if(act==="adjreset"){ resetAdjust(); }
  else if(act==="additems"){ openAddItems(); }
  else if(act==="addbulk"){ addBulkItems(); }
  else if(act==="rotation"){ closeMenu(); openRotation(); }
  else if(act==="refillnow" || act==="refillnext"){
    const anchor = act==="refillnow" ? iso(mondayOf(new Date())) : iso(addDays(mondayOf(new Date()),7));
    const n = fillRotation(anchor, ROTATION_WEEKS);
    closeModal(); week = anchor; tab="plan"; render(); window.scrollTo(0,0);
    toast("Filled "+ROTATION_WEEKS+" weeks — "+n+" meals");
  }
  else if(act==="clearrotation"){
    const v = get("setting:rotation");
    const anchor = v ? v.doc.anchor : iso(mondayOf(new Date()));
    if(confirm("Clear every planned meal for those "+ROTATION_WEEKS+" weeks?")){
      const n = clearRotation(anchor, ROTATION_WEEKS);
      closeModal(); render(); toast("Cleared "+n+" meals");
    }
  }
  else if(act==="help"){ closeMenu(); openHelp(); }
  else if(act==="replaywelcome"){ closeModal(); openWelcome(); }
  else if(act==="sharing"){ closeMenu(); openSharing(); }
  else if(act==="household"){
    const v=prompt("How many people are you usually cooking for?", household());
    if(v){ put("setting","setting:household",{value:Math.max(1,Number(v)||2)}); toast("Default set to "+household()); }
    closeMenu();
  }
  else if(act==="saveconn"){
    cfg.url=document.getElementById("cfgUrl").value.trim();
    cfg.key=document.getElementById("cfgKey").value.trim();
    cfg.hh =document.getElementById("cfgHh").value.trim();
    if(!cfg.url||!cfg.key||!cfg.hh){ toast("Fill in all three"); return; }
    saveCfg();
    Object.keys(S.items).forEach(id=>{ S.pending[id]=1; });   // upload what's already here
    S.watermark=null; saveLocal();
    setSync("busy");
    startSync();                                              // begin polling now, not on next load
    setTimeout(()=>{ openSharing(); if(syncState==="ok") toast("Connected — now send her the invite link"); }, 900);
  }
  else if(act==="join"){
    const v=document.getElementById("joinLink").value;
    if(!applyInvite(v)){ toast("That doesn't look like an invite link"); return; }
    S.seeded=true;                                       // take theirs, don't add samples
    Object.keys(S.items).forEach(id=>{ S.pending[id]=1; });
    saveLocal(); setSync("busy");
    startSync();                                              // begin polling now, not on next load
    setTimeout(()=>{ closeModal(); render(); toast(syncState==="ok"?"Joined — you're both on the same plan":"Couldn't reach it, check the link"); }, 900);
  }
  else if(act==="synctest"){ sync().then(()=>{ openSharing(); toast(syncState==="ok"?"All good":"Still failing"); }); }
  else if(act==="copyinvite") copyText(inviteLink(), "Invite link copied");
  else if(act==="copysql") copyText(SQL, "SQL copied");
  else if(act==="disconnect"){
    if(confirm("Stop syncing on this device? Your plan stays here but changes will no longer be shared.")){
      cfg={url:"",key:"",hh:""}; saveCfg(); clearInterval(syncTimer); setSync("off"); closeModal();
    }
  }
  else if(act==="export"){
    const blob=new Blob([JSON.stringify({items:S.items},null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="meal-plan-backup-"+iso(new Date())+".json"; a.click();
    URL.revokeObjectURL(a.href); closeMenu();
  }
  else if(act==="import"){
    const inp=document.createElement("input"); inp.type="file"; inp.accept="application/json";
    inp.onchange=()=>{
      const f=inp.files[0]; if(!f) return;
      const rd=new FileReader();
      rd.onload=()=>{
        try{
          const p=JSON.parse(rd.result);
          const items=p.items||p;
          if(typeof items!=="object") throw new Error("bad");
          Object.keys(items).forEach(id=>{ S.items[id]=items[id]; S.pending[id]=1; });
          saveLocal(); render(); kick(); toast("Backup merged in");
        }catch(err){ toast("That file didn't look right"); }
      };
      rd.readAsText(f);
    };
    inp.click(); closeMenu();
  }
  else if(act==="reset"){
    if(confirm("Erase everything on this device? If sharing is on, it will download again from the shared copy.")){
      S={items:{},pending:{},watermark:null,seeded:false};
      lsSet(DATA_KEY, JSON.stringify(S));
      if(connected()) sync().then(()=>{ ensureRecipes(); ensureRotation(); render(); }); else { ensureRecipes(); ensureRotation(); render(); }
    }
    closeMenu();
  }
});

/* Runs once per household, not once per device — the version lives in the
   shared store, so the second phone doesn't repeat the work. */
/* Returns true if it actually wrote something, so the caller knows to redraw. */
function ensureRecipes(){
  let wrote = false;
  /* Clear retired starters whenever they turn up, whatever order the
     devices happen to sync in. Dropping an already-dropped id is a no-op. */
  RETIRED.forEach(id=>{ const it = S.items[id]; if(it && !it.deleted){ drop(id); wrote = true; } });
  const v = get("setting:recipes");
  if(v && (v.doc.v||0) >= RECIPE_SET) return wrote;
  RECIPES.forEach(([id,doc])=>put("recipe", id, doc));
  put("setting","setting:recipes",{v:RECIPE_SET});
  S.seeded = true; saveLocal();
  return true;
}

/* =========================================================
   10b. The three-week rotation
   [day 0=Mon, slot, recipe, servings, from the freezer?]
   ========================================================= */
const ROTATION = [
  [ [0,"dinner","r-taco-beef-pasta",2,false],
    [1,"dinner","r-tuscan-chicken",2,false],
    [2,"dinner","r-seabass-orzo",2,false],
    [3,"dinner","r-fajita-rice-bowls",2,false],
    [4,"dinner","r-teriyaki-salmon",2,false],
    [5,"batch","r-tikka-masala",4,false],
    [6,"batch","r-beef-bean-chilli",6,false] ],
  [ [0,"dinner","r-tikka-masala",2,true],
    [1,"dinner","r-korean-beef",2,false],
    [2,"dinner","r-salmon-orzo",2,false],
    [3,"dinner","r-cajun-chicken-pasta",2,false],
    [4,"dinner","r-shawarma-flatbreads",2,false],
    [5,"batch","r-chicken-meatballs",4,false],
    [6,"batch","r-chicken-tagine",4,false] ],
  [ [0,"dinner","r-beef-bean-chilli",2,true],
    [1,"dinner","r-chicken-meatballs",2,true],
    [2,"dinner","r-salmon-traybake",2,false],
    [3,"dinner","r-mexican-chicken-rice",2,false],
    [4,"dinner","r-beef-stirfry",2,false],
    [5,"batch","r-fajita-filling",4,false],
    [6,"batch","r-taco-beef-sauce",4,false] ]
];
const ROTATION_WEEKS = 6;
const ROTATION_SET = 1;

/* Deterministic ids, so if both phones fill the same week they land on the
   same records rather than doubling everything up. */
function fillRotation(anchorISO, weeks){
  const anchor = parseISO(anchorISO);
  let n = 0;
  for(let w=0; w<weeks; w++){
    ROTATION[w % ROTATION.length].forEach((m,i)=>{
      const [day,slot,recipeId,servings,frozen] = m;
      const date = iso(addDays(anchor, w*7 + day));
      put("meal", "p-"+date+"-"+slot+"-"+i,
          {date, slot, recipeId, servings, order:i, frozen:!!frozen});
      n++;
    });
  }
  put("setting","setting:rotation",{v:ROTATION_SET, anchor:anchorISO, weeks:weeks});
  return n;
}
function clearRotation(anchorISO, weeks){
  const anchor = parseISO(anchorISO);
  let n = 0;
  for(let w=0; w<weeks*7; w++){
    const ds = iso(addDays(anchor,w));
    SLOTS.forEach(slot=>mealsOn(ds,slot).forEach(m=>{ drop(m.id); n++; }));
  }
  return n;
}
function ensureRotation(){
  const v = get("setting:rotation");
  if(v && (v.doc.v||0) >= ROTATION_SET) return false;
  fillRotation(iso(mondayOf(new Date())), ROTATION_WEEKS);
  return true;
}
function openRotation(){
  const v = get("setting:rotation");
  const anchor = v ? v.doc.anchor : iso(mondayOf(new Date()));
  const a = parseISO(anchor);
  let h = '<p class="small muted" style="margin:0 0 16px">Your three-week cycle, laid out '
    + ROTATION_WEEKS+' weeks ahead from '+fmtShort(a)+'. Change any week however you like — '
    + 'nothing here overwrites it unless you refill below.</p>';
  ROTATION.forEach((wk,i)=>{
    h += '<label class="f" style="margin-top:14px">Week '+(i+1)+'</label><div class="card" style="padding:2px 0">';
    wk.forEach(([day,slot,rid,serv,frozen])=>{
      const r = recipeById(rid);
      h += '<div class="ingline" style="padding:8px 12px;align-items:center">'
        + '<span style="min-width:42px;font-weight:700;font-size:13px">'+DAYNAMES[day].slice(0,3)+'</span>'
        + '<span style="flex:1">'+(frozen?'<span style="color:#4a90c2">❄ </span>':"")+esc(r?r.doc.name:rid)+'</span>'
        + (slot==="batch"?'<span class="pill green">Batch ×'+serv+'</span>':'<span class="tiny muted">'+serv+'</span>')
        + '</div>';
    });
    h += '</div>';
  });
  h += '<div class="note" style="margin:20px 0 14px">❄ marks a meal you eat from the freezer, so it adds nothing to that week\'s shopping list. Batch cook days buy for the whole batch.</div>'
    + '<div class="row wrap" style="gap:8px">'
    + '<button class="btn primary" data-act="refillnow">Refill from this week</button>'
    + '<button class="btn" data-act="refillnext">Refill from next Monday</button></div>'
    + '<div class="row" style="margin-top:10px"><button class="btn sm danger" data-act="clearrotation">Clear these '+ROTATION_WEEKS+' weeks</button></div>';
  sheet("Meal rotation", h);
}

/* =========================================================
   11. Boot
   ========================================================= */
const invited = readInvite();
if(connected()){
  setSync("busy");
  startSync();                      // seeds after first successful pull if empty
  if(invited) setTimeout(()=>toast("Connected to your shared plan"), 600);
}else{
  ensureRecipes(); ensureRotation();
  setSync("off");
}
render();
if(!storageOK) setTimeout(()=>toast("This browser won't let the app save — try a normal (non-private) window"), 800);
if(!lsGet(SEEN_KEY)) setTimeout(openWelcome, invited ? 1400 : 350);

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
