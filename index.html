];
const ROTATION_WEEKS = 6;
const ROTATION_SET = 2;   // 2 = re-laid onto Sunday-start weeks

/* Deterministic ids, so if both phones fill the same week they land on the
   same records rather than doubling everything up. */
function fillRotation(anchorISO, weeks){
  const anchor = parseISO(anchorISO);
  let n = 0;
  for(let w=0; w<weeks; w++){
    ROTATION[w % ROTATION.length].forEach((m,i)=>{
      const [day,slot,recipeId,servings,frozen] = m;
      const date = iso(addDays(anchor, w*7 + day));
      put("meal", "p-"+date+"-"+slot+"-"+i,
          {date, slot, recipeId, servings, order:i, frozen:!!frozen});
      n++;
    });
  }
  put("setting","setting:rotation",{v:ROTATION_SET, anchor:anchorISO, weeks:weeks});
  return n;
}
function clearRotation(anchorISO, weeks){
  const anchor = parseISO(anchorISO);
  let n = 0;
  for(let w=0; w<weeks*7; w++){
    const ds = iso(addDays(anchor,w));
    SLOTS.forEach(slot=>mealsOn(ds,slot).forEach(m=>{ drop(m.id); n++; }));
  }
  return n;
}
/* Weeks used to start on Monday. Everything keyed by week — shopping ticks,
   hand-added items, quantity tweaks, receipts — is moved onto the Sunday that
   now begins that same week, so no history is stranded. Runs once. */
function migrateWeekStart(){
  const v = get("setting:weekstart");
  if(v && (v.doc.v||0) >= 1) return false;
  const shift = w => iso(weekStartOf(parseISO(w)));
  let moved = 0;
  ["spend","extra"].forEach(k=>{
    all(k).forEach(i=>{
      const nw = shift(i.doc.week);
      if(nw !== i.doc.week){ put(k, i.id, Object.assign({}, i.doc, {week:nw})); moved++; }
    });
  });
  const PREFIX = { tick:"k:", hide:"h:", adj:"a:" };
  Object.keys(PREFIX).forEach(k=>{
    all(k).forEach(i=>{
      const nw = shift(i.doc.week);
      if(nw === i.doc.week) return;
      put(k, PREFIX[k] + nw + ":" + i.doc.key, Object.assign({}, i.doc, {week:nw}));
      drop(i.id); moved++;
    });
  });
  put("setting","setting:weekstart",{v:1});
  return moved > 0 || true;
}

function ensureRotation(){
  const v = get("setting:rotation");
  const at = v ? (v.doc.v||0) : 0;
  if(at >= ROTATION_SET) return false;
  /* Re-laying the cycle onto Sunday-start weeks: clear what a previous fill
     put down, but leave anything added by hand (those ids don't start p-). */
  if(at > 0 && v.doc.anchor){
    const a = parseISO(v.doc.anchor);
    for(let d = -7; d < ((v.doc.weeks||ROTATION_WEEKS)+1)*7; d++){
      const ds = iso(addDays(a,d));
      SLOTS.forEach(slot=>mealsOn(ds,slot).forEach(m=>{ if(/^p-/.test(m.id)) drop(m.id); }));
    }
  }
  fillRotation(iso(weekStartOf(new Date())), ROTATION_WEEKS);
  return true;
}
function openRotation(){
  const v = get("setting:rotation");
  const anchor = v ? v.doc.anchor : iso(weekStartOf(new Date()));
  const a = parseISO(anchor);
  let h = '<p class="small muted" style="margin:0 0 16px">Your three-week cycle, laid out '
    + ROTATION_WEEKS+' weeks ahead from '+fmtShort(a)+'. Change any week however you like — '
    + 'nothing here overwrites it unless you refill below.</p>';
  ROTATION.forEach((wk,i)=>{
    h += '<label class="f" style="margin-top:14px">Week '+(i+1)+'</label><div class="card" style="padding:2px 0">';
    wk.forEach(([day,slot,rid,serv,frozen])=>{
      const r = recipeById(rid);
      h += '<div class="ingline" style="padding:8px 12px;align-items:center">'
        + '<span style="min-width:42px;font-weight:700;font-size:13px">'+DAYNAMES[day].slice(0,3)+'</span>'
        + '<span style="flex:1">'+(frozen?'<span style="color:#4a90c2">❄ </span>':"")+esc(r?r.doc.name:rid)+'</span>'
        + (slot==="batch"?'<span class="pill green">Batch ×'+serv+'</span>':'<span class="tiny muted">'+serv+'</span>')
        + '</div>';
    });
    h += '</div>';
  });
  h += '<div class="note" style="margin:20px 0 14px">❄ marks a meal you eat from the freezer, so it adds nothing to that week\'s shopping list. Batch cook days buy for the whole batch.</div>'
    + '<div class="row wrap" style="gap:8px">'
    + '<button class="btn primary" data-act="refillnow">Refill from this week</button>'
    + '<button class="btn" data-act="refillnext">Refill from next Sunday</button></div>'
    + '<div class="row" style="margin-top:10px"><button class="btn sm danger" data-act="clearrotation">Clear these '+ROTATION_WEEKS+' weeks</button></div>';
  sheet("Meal rotation", h);
}

/* =========================================================
   11. Boot
   ========================================================= */
const invited = readInvite();
if(connected()){
  setSync("busy");
  startSync();                      // seeds after first successful pull if empty
  if(invited) setTimeout(()=>toast("Connected to your shared plan"), 600);
}else{
  migrateWeekStart(); ensureRecipes(); ensureRotation();
  setSync("off");
}
render();
if(!storageOK) setTimeout(()=>toast("This browser won't let the app save — try a normal (non-private) window"), 800);
if(!lsGet(SEEN_KEY)) setTimeout(openWelcome, invited ? 1400 : 350);
setTimeout(restoreCook, 500);   // pick up a session that was mid-timer

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
