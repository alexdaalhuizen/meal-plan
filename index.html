<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meal Plan</title>
<meta name="theme-color" content="#faf7f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meal Plan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#faf7f3; --card:#ffffff; --ink:#26201b; --muted:#7c6f64; --line:#e7ded2;
  --accent:#b4532a; --accent-soft:#fbeee6; --green:#2f6f4e; --green-soft:#e8f2ec;
  --amber:#a16207; --red:#b3261e;
  --shadow:0 1px 2px rgba(38,32,27,.06), 0 4px 14px rgba(38,32,27,.05);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#17140f; --card:#221d17; --ink:#f0e9e0; --muted:#a2958a; --line:#352d25;
    --accent:#e8834f; --accent-soft:#3a251a; --green:#6fbf92; --green-soft:#1e3229;
    --amber:#d9a441; --red:#e97066;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
a{color:var(--accent)}
code{font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--bg);padding:1px 5px;border-radius:5px;border:1px solid var(--line)}

header.app{
  position:sticky; top:0; z-index:40; background:var(--bg);
  border-bottom:1px solid var(--line); padding:14px 16px 0;
  padding-top:calc(14px + env(safe-area-inset-top));
}
.brandrow{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.brand{font-size:19px;font-weight:700;letter-spacing:-.02em}
.brand .dot{color:var(--accent)}
.sp{flex:1}
.tabs{display:flex;gap:4px}
.tab{
  appearance:none;border:0;background:none;padding:9px 14px 12px;
  color:var(--muted);font-weight:600;font-size:15px;
  border-bottom:2.5px solid transparent;margin-bottom:-1px;border-radius:8px 8px 0 0;
}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:1180px;margin:0 auto;padding:16px 16px 90px;padding-bottom:calc(90px + env(safe-area-inset-bottom))}

.syncpill{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);
  border-radius:99px;padding:4px 10px 4px 8px;font-size:12.5px;font-weight:600;color:var(--muted);
}
.syncpill .led{width:7px;height:7px;border-radius:99px;background:var(--muted)}
.syncpill[data-s="ok"] .led{background:var(--green)}
.syncpill[data-s="busy"] .led{background:var(--amber);animation:pulse 1s infinite}
.syncpill[data-s="err"] .led{background:var(--red)}
.syncpill[data-s="offline"] .led{background:var(--amber)}
.syncpill[data-s="off"] .led{background:var(--muted)}
@keyframes pulse{50%{opacity:.25}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 13px;border-radius:10px;font-size:14px;font-weight:600}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{opacity:.9;color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--accent)}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:8px}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.pill.green{background:var(--green-soft);color:var(--green)}
.empty{text-align:center;color:var(--muted);padding:34px 18px;font-size:14.5px}
input[type=text],input[type=number],input[type=search],input[type=url],select,textarea{
  background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 4px;text-transform:uppercase;letter-spacing:.04em}

.weeknav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.weeknav .wlabel{font-weight:700;font-size:16px;flex:1;text-align:center}
.weeknav .wlabel .sub{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.arrow{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:17px;line-height:1;display:grid;place-items:center}
.arrow:hover{border-color:var(--accent);color:var(--accent)}

.days{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(228px,1fr))}
.day{padding:12px 13px 13px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent), var(--shadow)}
.dayhead{display:flex;align-items:baseline;gap:6px;margin-bottom:9px}
.dayname{font-weight:700;font-size:14.5px}
.daydate{font-size:12.5px;color:var(--muted)}
.slot{margin-top:8px}
.slotlabel{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.meal{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:6px 7px 6px 9px;margin-bottom:5px}
.meal .nm{flex:1;font-size:13.5px;font-weight:600;line-height:1.3;text-align:left;background:none;border:0;padding:0}
.meal .nm:hover{color:var(--accent)}
.meal .sv{font-size:11.5px;color:var(--muted);font-weight:700;white-space:nowrap}
.meal .x{border:0;background:none;color:var(--muted);font-size:15px;line-height:1;padding:2px 3px;border-radius:6px}
.meal .x:hover{color:var(--red)}
.addslot{width:100%;border:1px dashed var(--line);background:none;color:var(--muted);border-radius:9px;padding:6px;font-size:13px;font-weight:600}
.addslot:hover{border-color:var(--accent);color:var(--accent);border-style:solid}
.addslot.ghostadd{border:0;color:var(--muted);opacity:.6;font-size:12px;margin-top:7px;padding:3px}
.addslot.ghostadd:hover{opacity:1;color:var(--green)}
.batchslot .slotlabel{color:var(--green)}
.batchslot .meal{background:var(--green-soft);border-color:transparent}
.meal.frozen{background:transparent;border-style:dashed}
.meal .snow{color:#4a90c2;margin-right:4px}
@media (prefers-color-scheme:dark){.meal .snow{color:#7cc0e8}}

.rgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.rcard{padding:14px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);width:100%}
.rcard:hover{border-color:var(--accent)}
.rcard h3{font-size:15.5px;margin-bottom:5px}
.tagrow{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.tag{font-size:11.5px;color:var(--muted);background:var(--bg);border:1px solid var(--line);padding:2px 7px;border-radius:99px}

.aisle h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:14px 4px 6px}
.item{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .cb{width:22px;height:22px;flex:none;margin-top:1px;border-radius:6px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;color:#fff;font-size:13px;padding:0}
.item.done .cb{background:var(--green);border-color:var(--green)}
.item .txt{flex:1;line-height:1.35;font-size:14.5px}
.item .txt .src{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.item.done .txt{text-decoration:line-through;color:var(--muted)}
.qtybtn{
  border:0;background:none;padding:0 1px;font:inherit;font-weight:700;color:var(--ink);
  border-bottom:1.5px dotted var(--muted);line-height:1.2;
}
.qtybtn:hover{color:var(--accent);border-bottom-color:var(--accent)}
.qtybtn.tweaked{color:var(--accent);border-bottom-style:solid;border-bottom-color:var(--accent)}
.item.done .qtybtn{border-bottom:0;color:inherit}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px 0 6px}
.stepper button{width:52px;height:52px;border-radius:14px;border:1px solid var(--line);
  background:var(--card);font-size:24px;line-height:1;font-weight:600}
.stepper button:hover{border-color:var(--accent);color:var(--accent)}
.stepper input{width:110px;text-align:center;font-size:22px;font-weight:700;padding:10px 6px}
.item .del{border:0;background:none;color:var(--muted);font-size:15px;padding:0 4px;opacity:.55}
.item .del:hover{opacity:1;color:var(--red)}

.overlay{position:fixed;inset:0;z-index:100;background:rgba(20,15,10,.5);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.overlay{align-items:center;padding:24px}}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:640px){.sheet{border-radius:16px}}
.sheethead{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:10px;z-index:2}
.sheethead h2{font-size:17px;flex:1}
.sheetbody{padding:16px}
.fieldrow{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}

/* Editor rows give the name a full line of its own — on a phone a flat row
   squeezes it down to a couple of characters. */
.ingedit{
  display:grid; grid-template-columns:78px 92px 1fr 32px; gap:8px; align-items:center;
  padding:10px; margin-bottom:8px; border:1px solid var(--line);
  border-radius:11px; background:var(--bg);
}
.ingedit .iname { grid-column:1 / span 3; grid-row:1; font-weight:600 }
.ingedit .rmi   { grid-column:4; grid-row:1 }
.ingedit .iqty  { grid-column:1; grid-row:2 }
.ingedit .iunit { grid-column:2; grid-row:2 }
.ingedit .iaisle{ grid-column:3 / span 2; grid-row:2; font-size:13px; color:var(--muted) }
.stepedit{
  display:grid; grid-template-columns:26px 1fr 32px; gap:8px; align-items:start;
  padding:10px; margin-bottom:8px; border:1px solid var(--line);
  border-radius:11px; background:var(--bg);
}
.stepedit .snum { grid-column:1; grid-row:1; margin-top:6px }
.stepedit .stext{ grid-column:2; grid-row:1 }
.stepedit .rms  { grid-column:3; grid-row:1 }
.stepedit .smins{ grid-column:2; grid-row:2; width:130px; font-size:13px }
.ingedit input, .ingedit select, .stepedit input, .stepedit textarea{ background:var(--card) }
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepnum{width:24px;height:24px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:800;display:grid;place-items:center;flex:none;margin-top:8px}
.ingline{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.ingline:last-child{border-bottom:0}
.method li{margin-bottom:10px;line-height:1.5}
.method li .t{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:99px;margin-left:6px;white-space:nowrap}
.menu{position:absolute;right:16px;top:52px;z-index:60;padding:6px;min-width:210px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 11px;border-radius:8px;font-size:14px}
.menu button:hover{background:var(--bg);color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:200;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:88vw;text-align:center}
pre.sql{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;margin:0}
.step{display:flex;gap:11px;margin-bottom:16px}
.step .n{width:23px;height:23px;border-radius:99px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:800;display:grid;place-items:center;flex:none;margin-top:2px}
.step .b{flex:1}
.note{background:var(--accent-soft);border-radius:10px;padding:11px 13px;font-size:13.5px;line-height:1.5}
.pbox{background:var(--accent-soft);border-radius:12px;padding:12px 13px 6px;margin-bottom:18px;font-size:13.5px;line-height:1.5}
.pnote{position:relative;padding:8px 26px 8px 0;border-top:1px solid rgba(128,128,128,.22);margin-top:8px}
.pdis{position:absolute;top:6px;right:-4px;background:none;border:0;color:var(--muted);font-size:19px;line-height:1;padding:2px 6px;cursor:pointer}

/* ---------- cook along ---------- */
.cookwrap{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.cookbar{display:flex;align-items:center;gap:10px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.cookbar .ctitle{flex:1;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cookbar .cstep{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
.cprog{height:3px;background:var(--line)}
.cprog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 4px}
.chip{display:inline-flex;align-items:center;gap:8px;flex:none;background:var(--card);
  border:1px solid var(--line);border-radius:99px;padding:7px 8px 7px 13px;font-size:13px;max-width:74vw}
.chip.ready{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.chip .cl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.chip .cd{font-variant-numeric:tabular-nums;font-weight:800}
.chip .cx{border:0;background:none;color:inherit;opacity:.55;font-size:15px;padding:0 3px}
.chip .cx:hover{opacity:1}
.cookmain{flex:1;overflow:auto;padding:18px 20px 8px;display:flex;flex-direction:column}
.cnum{width:34px;height:34px;border-radius:99px;background:var(--accent);color:#fff;font-weight:800;
  font-size:15px;display:grid;place-items:center;margin-bottom:14px;flex:none}
.ctext{font-size:23px;line-height:1.42;font-weight:600;margin:0 0 22px;letter-spacing:-.01em}
.ctimer{margin-top:auto;padding-bottom:6px}
.bigbtn{width:100%;padding:17px;border-radius:15px;font-size:17px;font-weight:700;
  border:1px solid var(--accent);background:var(--accent);color:#fff}
.bigbtn.ghost{background:var(--card);color:var(--accent)}
.running{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:15px;padding:14px 16px}
.running .cd{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.running .rl{flex:1;font-size:13px;color:var(--muted);font-weight:600}
.cooknav{display:flex;gap:10px;padding:12px 16px 16px;border-top:1px solid var(--line)}
.cooknav .btn{flex:1;padding:16px;font-size:16px;border-radius:14px}
.cooknav .btn.primary{flex:2}
.cookalert{background:var(--green);color:#fff;padding:13px 16px;display:flex;align-items:center;gap:12px}
.cookalert .at{flex:1;font-weight:650;font-size:15px;line-height:1.35}
.cookalert button{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;
  border-radius:9px;padding:7px 12px;font-weight:700;font-size:13px}
/* ---------- spending ---------- */
.viz-root{--chart:#b4532a;--chart-soft:#fbeee6;--grid:#e7ded2}
@media (prefers-color-scheme:dark){.viz-root{--chart:#d9713d;--chart-soft:#3a251a;--grid:#352d25}}
.seg{border:1px solid var(--line);background:var(--card);font-weight:650}
.seg.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.wkr{display:block;font-size:11px;font-weight:500;opacity:.75;margin-top:2px}
.quickadd{padding:12px 13px}
.hero{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero .big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.hero .sub{font-size:14px;color:var(--muted);font-weight:600}
.kpis{display:flex;gap:10px;margin:16px 0 4px}
.kpi{flex:1;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 13px;box-shadow:var(--shadow)}
.kpi .k{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:21px;font-weight:800;margin-top:3px;letter-spacing:-.02em}
.chartcard{padding:16px 14px 10px;margin-top:14px}
.chartcap{font-size:13px;color:var(--muted);text-align:center;margin-top:2px;min-height:19px}
.wrow{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);width:100%;
  background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.wrow:last-child{border-bottom:0}
.wrow .wd{flex:1}
.wrow .wk{font-weight:650;font-size:14.5px}
.wrow .wm{font-size:12.5px;color:var(--muted);margin-top:1px}
.wrow .wv{font-weight:800;font-size:16px;letter-spacing:-.01em}
.secbar{display:flex;align-items:center;gap:10px;padding:7px 0}
.secbar .sl{width:96px;font-size:13px;color:var(--muted);flex:none}
.secbar .st{flex:1;height:10px;background:var(--chart-soft);border-radius:99px;overflow:hidden}
.secbar .st i{display:block;height:100%;background:var(--chart);border-radius:99px}
.secbar .sv{font-size:13px;font-weight:700;width:58px;text-align:right;flex:none}
.amts{display:flex;flex-wrap:wrap;gap:7px;margin:-8px 0 20px}
.amt{background:var(--accent-soft);color:var(--accent);border-radius:99px;
  padding:6px 12px;font-size:14.5px;font-weight:600}
.amt b{font-weight:800}
.ovmethod li.here{background:var(--accent-soft);border-radius:9px;padding:8px 10px;margin-left:-10px;font-weight:650}
.cdone{text-align:center;padding:30px 10px}
.cdone .big{font-size:22px;font-weight:700;margin-bottom:8px}

/* ---------- welcome cards ---------- */
.wcwrap{position:fixed;inset:0;z-index:150;background:rgba(20,15,10,.55);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.wcwrap{align-items:center;padding:24px}}
.wc{background:var(--card);width:100%;max-width:460px;border-radius:20px 20px 0 0;
    box-shadow:0 -8px 40px rgba(0,0,0,.3);padding:26px 22px 18px;
    padding-bottom:calc(18px + env(safe-area-inset-bottom));touch-action:pan-y}
@media(min-width:640px){.wc{border-radius:18px}}
.wc .art{width:60px;height:60px;border-radius:17px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-size:29px;margin-bottom:16px}
.wc h2{font-size:21px;margin-bottom:8px;letter-spacing:-.02em}
.wc p{margin:0 0 10px;font-size:15.5px;line-height:1.55;color:var(--ink)}
.wc p.sub{color:var(--muted);font-size:14.5px}
.wc .card-body{min-height:196px}
.wcfoot{display:flex;align-items:center;gap:10px;margin-top:14px}
.dots{display:flex;gap:6px;flex:1;justify-content:center}
.dots i{width:7px;height:7px;border-radius:99px;background:var(--line);display:block}
.dots i.on{background:var(--accent);width:20px}
.helpsec{margin:0 0 22px}
.helpsec h3{font-size:15.5px;margin-bottom:6px}
.helpsec p{margin:0 0 9px;font-size:14.8px;line-height:1.6;color:var(--ink)}
.helpsec p.q{color:var(--muted);font-size:14px}

<body>

<header class="app">
  <div class="brandrow">
    <div class="brand">Meal Plan<span class="dot">.</span></div>
    <div class="sp"></div>
    <button class="syncpill" id="syncPill" data-s="off"><span class="led"></span><span id="syncTxt">Local</span></button>
    <button class="btn sm ghost" id="menuBtn" aria-label="Menu">&#9881;</button>
  </div>
  <nav class="tabs">
    <button class="tab on" data-tab="plan">Plan</button>
    <button class="tab" data-tab="recipes">Recipes</button>
    <button class="tab" data-tab="shopping">Shopping</button>
    <button class="tab" data-tab="spend">Spend</button>
  </nav>
</header>

<main id="view"></main>
<div id="modal"></div>

<script>
"use strict";

/* =========================================================
   0. Keys, constants
   ========================================================= */
const APP_VERSION = "2026.08.28";
const CFG_KEY  = "mealplan.cfg";
const DATA_KEY = "mealplan.v2";
const AISLES = ["Produce","Meat & Fish","Dairy & Eggs","Bakery","Tins & Jars","Dry Goods","Herbs & Spices","Frozen","Household","Other"];
const UNITS  = ["","g","kg","ml","l","tsp","tbsp","clove","can","pack","bunch","handful","slice","cup","pinch","sprig"];
const DAYNAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const SLOTS = ["lunch","dinner","batch"];
const SLOT_LABEL = { lunch:"Lunch", dinner:"Dinner", batch:"Batch cook" };
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const uid = p => (p||"") + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);

/* =========================================================
   1. Local persistence  (never throws — degrades to memory)
   ========================================================= */
let storageOK = true;
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ storageOK=false; return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){ storageOK=false; } }

let cfg = { url:"", key:"", hh:"" };
try{ Object.assign(cfg, JSON.parse(lsGet(CFG_KEY)||"{}")); }catch(e){}
function saveCfg(){ lsSet(CFG_KEY, JSON.stringify(cfg)); }

/* The store is a flat bag of items so two people can edit different
   things at once without overwriting each other's work.            */
let S = { items:{}, pending:{}, watermark:null, seeded:false };
try{
  const raw = lsGet(DATA_KEY);
  if(raw){ const p = JSON.parse(raw); if(p && p.items) S = Object.assign(S, p); }
}catch(e){}
let saveTimer=null;
function saveLocal(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>lsSet(DATA_KEY, JSON.stringify(S)), 120);
}

/* =========================================================
   2. Item helpers
   ========================================================= */
function put(kind, id, doc){
  S.items[id] = { id, kind, doc, deleted:false, updated_at:new Date().toISOString() };
  S.pending[id] = 1; saveLocal(); kick();
  return id;
}
function drop(id){
  const it = S.items[id]; if(!it) return;
  it.deleted = true; it.updated_at = new Date().toISOString();
  S.pending[id] = 1; saveLocal(); kick();
}
function get(id){ const i=S.items[id]; return (i && !i.deleted) ? i : null; }
function all(kind){
  const out=[];
  for(const k in S.items){ const i=S.items[k]; if(i.kind===kind && !i.deleted) out.push(i); }
  return out;
}

/* =========================================================
   3. Sync engine — plain fetch against Supabase PostgREST
   ========================================================= */
let syncState = "off";        // off | ok | busy | err
let syncMsg = "";
let syncTimer=null, kickTimer=null;

const connected = () => !!(cfg.url && cfg.key && cfg.hh);
function base(){ return cfg.url.replace(/\/+$/,""); }
function api(path, opts){
  opts = opts || {};
  return fetch(base()+"/rest/v1/"+path, Object.assign({}, opts, {
    headers: Object.assign({
      apikey: cfg.key,
      Authorization: "Bearer "+cfg.key,
      "Content-Type": "application/json"
    }, opts.headers||{})
  }));
}
function setSync(state, msg){
  syncState=state; syncMsg=msg||"";
  const pill=document.getElementById("syncPill"), txt=document.getElementById("syncTxt");
  pill.dataset.s = state;
  const waiting = Object.keys(S.pending).length;
  txt.textContent =
      state==="ok"      ? "Synced"
    : state==="busy"    ? "Syncing"
    : state==="offline" ? (waiting ? "Offline · "+waiting : "Offline")
    : state==="err"     ? "Sync issue"
    :                     "Local only";
}

async function pull(){
  let q = "items?household=eq."+encodeURIComponent(cfg.hh)+"&select=id,kind,doc,deleted,updated_at";
  if(S.watermark) q += "&updated_at=gte."+encodeURIComponent(S.watermark);
  const r = await api(q);
  if(!r.ok) throw new Error("Couldn't read ("+r.status+")");
  const rows = await r.json();
  let changed=false, maxT = S.watermark ? new Date(S.watermark) : null;
  rows.forEach(row=>{
    const t = new Date(row.updated_at);
    if(!maxT || t>maxT) maxT = t;
    if(S.pending[row.id]) return;                       // our unpushed edit wins for now
    const cur = S.items[row.id];
    // Rows we already have, unchanged — usually our own writes coming back.
    // Treating these as "changed" would redraw the screen every few seconds
    // and wipe out anything being typed.
    if(cur && cur.updated_at === row.updated_at && cur.deleted === !!row.deleted) return;
    if(!cur || t >= new Date(cur.updated_at||0)){
      S.items[row.id] = { id:row.id, kind:row.kind, doc:row.doc, deleted:!!row.deleted, updated_at:row.updated_at };
      changed = true;
    }
  });
  if(maxT) S.watermark = maxT.toISOString();
  if(changed){ saveLocal(); render(); }
  return rows.length;
}

async function push(){
  const ids = Object.keys(S.pending);
  if(!ids.length) return 0;
  const payload = ids.map(id=>{
    const i = S.items[id];
    return { id:i.id, household:cfg.hh, kind:i.kind, doc:i.doc, deleted:!!i.deleted };
  });
  const r = await api("items?on_conflict=id", {
    method:"POST",
    headers:{ Prefer:"resolution=merge-duplicates,return=representation" },
    body: JSON.stringify(payload)
  });
  if(!r.ok){
    const body = await r.text();
    throw new Error("Couldn't save ("+r.status+") "+body.slice(0,120));
  }
  const rows = await r.json();
  rows.forEach(row=>{
    if(S.items[row.id]) S.items[row.id].updated_at = row.updated_at;
    delete S.pending[row.id];
  });
  saveLocal();
  return rows.length;
}

let syncing=false;
async function sync(quiet){
  if(!connected()){ setSync("off"); return; }
  if(syncing) return;
  syncing=true;
  if(!quiet) setSync("busy");
  try{
    await push();
    await pull();
    setSync("ok");
    // First run for a household writes the recipes and the rotation — redraw so they show.
    const wroteA = migrateWeekStart(), wroteB = ensureRecipes(), wroteC = ensureRotation();
    if(wroteA || wroteB || wroteC) render();
  }catch(e){
    // A flat "no internet" isn't a fault worth alarming anyone about.
    setSync(navigator.onLine ? "err" : "offline", e.message);
    console.warn("sync", e);
  }finally{ syncing=false; }
}
function kick(){ clearTimeout(kickTimer); kickTimer = setTimeout(()=>sync(true), 500); }
/* Poll faster on the shopping list — that's the screen two people use at
   the same time, one in the shop and one at home. */
const pollEvery = () => tab === "shopping" ? 4000 : 12000;
let pollRate = 0;
function startSync(quiet){
  clearInterval(syncTimer);
  if(!connected()){ setSync("off"); return; }
  if(!quiet) sync();
  pollRate = pollEvery();
  syncTimer = setInterval(()=>{ if(document.visibilityState==="visible") sync(true); }, pollRate);
}
/* Called whenever the tab changes, so the rate follows the screen. */
function retimeSync(){
  if(!connected()) return;
  if(pollEvery() !== pollRate) startSync(true);
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") sync(true); });
window.addEventListener("online", ()=>sync());
window.addEventListener("offline", ()=>{ if(connected()) setSync("offline"); });

/* base64url for the invite link */
function b64e(str){
  const bytes = new TextEncoder().encode(str);
  let s=""; bytes.forEach(b=>s+=String.fromCharCode(b));
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64d(b64){
  const s = atob(b64.replace(/-/g,"+").replace(/_/g,"/"));
  const bytes = new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) bytes[i]=s.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function inviteLink(){
  const payload = b64e(JSON.stringify({u:cfg.url,k:cfg.key,h:cfg.hh}));
  return location.origin + location.pathname + "#s=" + payload;
}
/* Accepts a whole invite link or just the code after #s=.
   The paste route matters on iPhone: a home-screen app gets its own
   storage, so she may need to paste the link once more inside it. */
function applyInvite(str){
  if(!str) return false;
  const m = String(str).match(/#s=([A-Za-z0-9\-_]+)/) || String(str).trim().match(/^([A-Za-z0-9\-_]{20,})$/);
  if(!m) return false;
  try{
    const o = JSON.parse(b64d(m[1]));
    if(!o.u||!o.k||!o.h) return false;
    cfg.url=o.u; cfg.key=o.k; cfg.hh=o.h; saveCfg();
    S.watermark = null;                                  // fresh device: pull everything
    return true;
  }catch(e){ return false; }
}
function readInvite(){
  if(!location.hash.startsWith("#s=")) return false;
  const ok = applyInvite(location.hash);
  history.replaceState(null,"",location.pathname);
  return ok;
}

/* =========================================================
   4. Dates
   ========================================================= */
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseISO(s){ const p=s.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
function addDays(d,n){ const x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
/* Weeks run Sunday to Saturday. */
function weekStartOf(d){ const x=new Date(d.getTime()); x.setDate(x.getDate()-x.getDay()); x.setHours(0,0,0,0); return x; }
function fmtShort(d){ return d.getDate()+" "+MONTHS[d.getMonth()]; }
function weekDates(w){ const m=parseISO(w); return Array.from({length:7},(_,i)=>addDays(m,i)); }

let tab="plan";
let week = iso(weekStartOf(new Date()));
let recipeSearch="";

/* =========================================================
   5. Units
   ========================================================= */
const WHOLE   = ["","can","pack","bunch","slice","clove"];
const COUNTED = ["clove","can","pack","bunch","handful","slice"];
function canon(unit){
  const u=(unit||"").toLowerCase().trim();
  if(u==="kg") return {u:"g", f:1000};
  if(u==="l"||u==="litre") return {u:"ml", f:1000};
  if(u==="tbsp") return {u:"tsp", f:3};
  return {u:u, f:1};
}
function prettyQty(n,u,shopping){
  if(n==null||n==="") return "";
  let unit=u, val=Number(n);
  if(shopping && WHOLE.includes(unit)) val = Math.ceil(val-1e-9);
  if(unit==="g" && val>=1000){ unit="kg"; val=val/1000; }
  else if(unit==="ml" && val>=1000){ unit="l"; val=val/1000; }
  else if((unit==="g"||unit==="ml") && val>=25) val = Math.round(val/5)*5;
  else if(unit==="tsp"){
    val = Math.max(0.25, Math.round(val*4)/4);
    if(val>=3 && Math.abs(val/3 - Math.round(val*10/3)/10) < 1e-9){ unit="tbsp"; val=val/3; }
  }
  const s = String(Math.round(val*100)/100);
  if(!unit) return s;
  if(COUNTED.includes(unit)) return s+" "+unit+(val===1?"":"s");
  return s+unit;
}
const plural = (n,w) => n===1 ? w : w+"s";

/* "onion" and "onions" are the same thing on a shopping list; "red onion"
   is not. So we fold plurals for matching, but keep every other word. */
function singular(w){
  if(w.length < 4) return w;
  if(/ies$/.test(w)) return w.slice(0,-3)+"y";
  if(/(ses|xes|zes|ches|shes)$/.test(w)) return w.slice(0,-2);
  if(/oes$/.test(w)) return w.slice(0,-2);
  if(/(ss|us|is)$/.test(w)) return w;
  if(/s$/.test(w)) return w.slice(0,-1);
  return w;
}
function normItem(s){
  return String(s).toLowerCase().trim().replace(/[.,]+$/,"").replace(/\s+/g," ")
         .split(" ").map(singular).join(" ");
}
function pluralise(s){
  const parts = s.split(" ");
  let w = parts[parts.length-1];
  if(/s$/i.test(w)) return s;                       // already plural
  if(/(tomato|potato)$/i.test(w)) w += "es";
  else if(/[^aeiou]y$/i.test(w)) w = w.slice(0,-1)+"ies";
  else if(/(ch|sh|x|z|ss)$/i.test(w)) w += "es";
  else w += "s";
  parts[parts.length-1] = w;
  return parts.join(" ");
}
/* Only pluralise things we're counting — "3 onions" but never "200g flours". */
function itemLabel(item, qty, unit){
  if(unit || qty==null || qty==="") return item;
  return Math.ceil(Number(qty)-1e-9) > 1 ? pluralise(item) : item;
}

/* =========================================================
   6. Domain accessors
   ========================================================= */
const household = () => { const s=get("setting:household"); return (s && s.doc.value) || 2; };
function recipes(){ return all("recipe").sort((a,b)=>a.doc.name.localeCompare(b.doc.name)); }
function recipeById(id){ const i=get(id); return (i && i.kind==="recipe") ? i : null; }
function mealsOn(dateISO, slot){
  return all("meal").filter(m=>m.doc.date===dateISO && m.doc.slot===slot)
                    .sort((a,b)=>(a.doc.order||0)-(b.doc.order||0));
}
function weekMeals(w){
  const days = weekDates(w).map(iso);
  return all("meal").filter(m=>days.includes(m.doc.date))
                    .sort((a,b)=>(a.doc.date+a.doc.slot).localeCompare(b.doc.date+b.doc.slot));
}
const tickId = (w,k) => "k:"+w+":"+k;
const hideId = (w,k) => "h:"+w+":"+k;
const adjId  = (w,k) => "a:"+w+":"+k;
const isOn = id => { const i=get(id); return !!(i && i.doc.on); };
/* How much you've added on top of what the recipes ask for, this week. */
const adjOf = (w,k) => { const i=get(adjId(w,k)); return i ? (Number(i.doc.extra)||0) : 0; };
/* Sensible nudge per tap: 50g at a time, but one carrot at a time. */
const stepFor = u => (u==="g"||u==="ml") ? 50 : 1;

function buildList(w){
  const map = new Map();
  weekMeals(w).forEach(m=>{
    if(m.doc.frozen) return;              // already in the freezer — nothing to buy
    const r = recipeById(m.doc.recipeId); if(!r) return;
    const factor = (m.doc.servings || r.doc.servings) / (r.doc.servings || 1);
    r.doc.ingredients.forEach(ing=>{
      if(!ing.item) return;
      const c = canon(ing.unit);
      const key = normItem(ing.item)+"|"+c.u;
      const qty = (ing.qty==null||ing.qty==="") ? null : Number(ing.qty)*c.f*factor;
      if(!map.has(key)) map.set(key,{key,item:ing.item.trim(),unit:c.u,qty:qty,aisle:ing.aisle||"Other",sources:new Set([r.doc.name])});
      else { const e=map.get(key); if(qty!=null) e.qty=(e.qty||0)+qty; e.sources.add(r.doc.name); }
    });
  });
  const items = [...map.values()]
    .filter(e=>!isOn(hideId(w,e.key)))
    .map(e=>{
      const extra = adjOf(w, e.key);
      const base = e.qty;
      // An adjustment can also give a quantity to something that had none.
      const qty = extra ? Math.max(0, (base==null?0:base) + extra) : base;
      return {...e, base, extra, qty, sources:[...e.sources], done:isOn(tickId(w,e.key))};
    });
  items.sort((a,b)=>{
    const ai=AISLES.indexOf(a.aisle), bi=AISLES.indexOf(b.aisle);
    if(ai!==bi) return (ai<0?99:ai)-(bi<0?99:bi);
    return a.item.localeCompare(b.item);
  });
  return items;
}
function extrasFor(w){ return all("extra").filter(x=>x.doc.week===w).sort((a,b)=>(a.doc.order||0)-(b.doc.order||0)); }

/* =========================================================
   7. Rendering
   ========================================================= */
const view = document.getElementById("view");
const modal = document.getElementById("modal");
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function render(){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on", b.dataset.tab===tab));
  if(tab==="plan") renderPlan();
  else if(tab==="recipes") renderRecipes();
  else if(tab==="spend") renderSpend();
  else renderShopping();
}
function weekNav(){
  const d=weekDates(week), thisWeek=iso(weekStartOf(new Date()));
  const rel=Math.round((parseISO(week)-parseISO(thisWeek))/(7*864e5));
  const relTxt = rel===0?"This week":rel===1?"Next week":rel===-1?"Last week":(rel>0?"In "+rel+" weeks":Math.abs(rel)+" weeks ago");
  return '<div class="weeknav">'
    + '<button class="arrow" data-week="-1" aria-label="Previous week">‹</button>'
    + '<div class="wlabel">'+fmtShort(d[0])+' – '+fmtShort(d[6])+' '+d[6].getFullYear()+'<span class="sub">'+relTxt+'</span></div>'
    + '<button class="arrow" data-week="1" aria-label="Next week">›</button>'
    + (rel!==0?'<button class="btn sm" data-week="0">Today</button>':'')
    + '</div>';
}

function renderPlan(){
  const today=iso(new Date());
  let html = weekNav() + '<div class="days">';
  weekDates(week).forEach((d,i)=>{
    const ds=iso(d);
    html += '<div class="card day'+(ds===today?" today":"")+'">'
      + '<div class="dayhead"><span class="dayname">'+DAYNAMES[i]+'</span><span class="daydate">'+fmtShort(d)+'</span></div>';
    SLOTS.forEach(slot=>{
      const entries = mealsOn(ds,slot);
      // The batch row only takes up space on days you're actually batch cooking.
      if(slot==="batch" && !entries.length) return;
      html += '<div class="slot'+(slot==="batch"?" batchslot":"")+'"><div class="slotlabel">'+SLOT_LABEL[slot]+'</div>';
      entries.forEach(m=>{
        const r = recipeById(m.doc.recipeId);
        if(!r) return;
        html += '<div class="meal'+(m.doc.frozen?" frozen":"")+'">'
          + '<button class="nm" data-openrecipe="'+r.id+'">'+(m.doc.frozen?'<span class="snow">❄</span>':"")+esc(r.doc.name)+'</button>'
          + '<span class="sv">'+m.doc.servings+'</span>'
          + '<button class="x" data-delmeal="'+m.id+'" aria-label="Remove">×</button></div>';
      });
      html += '<button class="addslot" data-add="'+ds+"|"+slot+'">+ Add</button></div>';
    });
    if(!mealsOn(ds,"batch").length)
      html += '<button class="addslot ghostadd" data-add="'+ds+'|batch">+ Batch cook</button>';
    html += '</div>';
  });
  html += '</div>';
  const n = weekMeals(week).length;
  html += '<div class="row wrap" style="margin-top:16px;gap:8px">'
    + '<button class="btn sm" data-act="copylast">Copy last week</button>'
    + '<button class="btn sm danger" data-act="clearweek">Clear week</button>'
    + '<div class="sp"></div><span class="small muted">'+n+" "+plural(n,"meal")+' planned</span></div>';
  view.innerHTML = html;
}

function renderRecipes(){
  const q=recipeSearch.toLowerCase();
  const list = recipes().filter(r=>!q || r.doc.name.toLowerCase().includes(q) || (r.doc.tags||[]).join(" ").toLowerCase().includes(q));
  let html = '<div class="row" style="margin-bottom:14px;gap:8px">'
    + '<input type="search" id="rsearch" placeholder="Search recipes…" value="'+esc(recipeSearch)+'">'
    + '<button class="btn primary" data-act="newrecipe" style="white-space:nowrap">+ New</button></div>'
    + '<div class="row" style="margin-bottom:14px"><button class="btn" data-act="pasterecipe" style="width:100%">📋  Paste a recipe</button></div>';
  if(!list.length){
    html += '<div class="card empty">No recipes'+(q?" match “"+esc(recipeSearch)+"”":" yet")+'.</div>';
  }else{
    html += '<div class="rgrid">' + list.map(r=>
      '<button class="rcard" data-openrecipe="'+r.id+'"><h3>'+esc(r.doc.name)+'</h3>'
      + '<div class="small muted">Serves '+r.doc.servings+' · '+r.doc.time+' min · '+r.doc.steps.length+' steps</div>'
      + '<div class="tagrow">'+(r.doc.batch?'<span class="pill green">Batch</span>':"")
      + (r.doc.tags||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join("")+'</div></button>').join("") + '</div>';
  }
  view.innerHTML = html;
  const s=document.getElementById("rsearch");
  s.addEventListener("input", e=>{
    recipeSearch=e.target.value; const p=e.target.selectionStart;
    renderRecipes();
    const n2=document.getElementById("rsearch"); n2.focus(); n2.setSelectionRange(p,p);
  });
}

/* =========================================================
   Spending — what the shop actually cost
   ========================================================= */
/* Money. Receipts remember the currency they were rung up in; everything is
   reported in whichever you've chosen, converted at a rate you set yourself
   so it never depends on the network or goes stale behind your back. */
const CURRENCIES = { QAR:{sym:"QAR ", name:"Qatari riyal"}, GBP:{sym:"£", name:"Pound sterling"} };
const DEFAULT_RATE = 4.96;                 // QAR per GBP, editable in settings
function moneyCfg(){
  const s = get("setting:money");
  return { cur:(s && s.doc.cur) || "QAR", rate:(s && Number(s.doc.rate)) || DEFAULT_RATE };
}
const curCode = () => moneyCfg().cur;
const curSym  = code => (CURRENCIES[code||curCode()] || CURRENCIES.QAR).sym;
const money  = (n,code) => curSym(code) + (Math.round(Number(n)*100)/100).toFixed(2);
const money0 = (n,code) => curSym(code) + Math.round(Number(n));
/* Older receipts predate the setting and were entered when the app said £. */
const entryCur = doc => doc.cur || "GBP";
function inDisplay(amount, cur){
  const {cur:disp, rate} = moneyCfg();
  const from = cur || "GBP";
  const v = Number(amount) || 0;
  if(from === disp || !rate) return v;
  return disp === "QAR" ? v*rate : v/rate;
}
const SHOPS = ["LuLu","Food World","Carrefour","Monoprix","Spar","Other"];
let spendWeekSel = null;     // week or month highlighted on the chart
let spendMode = "week";      // week | month
let quickShop = SHOPS[0], quickAmt = "";   // kept across redraws so typing survives
/* You shop for the week ahead at the weekend, so on Friday and Saturday the
   forms open on next week. Always shown, never silent. */
function defaultSpendWeek(){
  const now = new Date(), dow = now.getDay();        // 5 = Fri, 6 = Sat
  const start = weekStartOf(now);
  return iso(dow >= 5 ? addDays(start, 7) : start);
}
let quickWeek = defaultSpendWeek();
function weekChooserHTML(sel, attr){
  const thisW = iso(weekStartOf(new Date())), nextW = iso(addDays(parseISO(thisW), 7));
  const range = w => { const d = weekDates(w); return fmtShort(d[0])+" – "+fmtShort(d[6]); };
  const other = (sel !== thisW && sel !== nextW);
  return '<div class="row" style="gap:8px">'
    + '<button class="btn sm seg'+(sel===thisW?" on":"")+'" '+attr+'="'+thisW+'" style="flex:1">This week'
      + '<span class="wkr">'+range(thisW)+'</span></button>'
    + '<button class="btn sm seg'+(sel===nextW?" on":"")+'" '+attr+'="'+nextW+'" style="flex:1">Next week'
      + '<span class="wkr">'+range(nextW)+'</span></button>'
    + (other ? '<button class="btn sm seg on" '+attr+'="'+sel+'" style="flex:1">Other<span class="wkr">'+range(sel)+'</span></button>' : "")
    + '</div>';
}

const monthKey   = w => w.slice(0,7);                       // the week's first day decides its month
const monthLabel = k => MONTHS[Number(k.slice(5,7))-1] + " " + k.slice(0,4);

function spendEntries(w){ return all("spend").filter(s=>s.doc.week===w).sort((a,b)=>(a.doc.at||0)-(b.doc.at||0)); }
function spendTotal(w){ return spendEntries(w).reduce((a,s)=>a+inDisplay(s.doc.amount, entryCur(s.doc)), 0); }
/* True if anything on screen has been converted, so we can say so. */
function anyConverted(){
  const disp = curCode();
  return all("spend").some(s=>entryCur(s.doc) !== disp);
}
/* Every week that has at least one receipt, oldest first. */
function spendWeeks(){
  const set = {};
  all("spend").forEach(s=>{ set[s.doc.week] = true; });
  return Object.keys(set).sort();
}
/* Fills the gaps, so a week you didn't record shows as a gap rather than
   quietly disappearing and flattering the average. */
function spendSeries(limit){
  const weeks = spendWeeks();
  if(!weeks.length) return [];
  const last = parseISO(weeks[weeks.length-1]);
  const first = parseISO(weeks[0]);
  const span = Math.round((last-first)/(7*864e5)) + 1;
  const n = Math.min(span, limit||12);
  const out = [];
  for(let k=n-1; k>=0; k--){
    const w = iso(addDays(last, -k*7));
    out.push({ key:w, label:fmtShort(parseISO(w)), total:spendTotal(w), has:spendEntries(w).length>0 });
  }
  return out;
}
function spendMonths(){
  const set = {};
  spendWeeks().forEach(w=>{ set[monthKey(w)] = true; });
  return Object.keys(set).sort();
}
function monthTotal(k){
  return spendWeeks().filter(w=>monthKey(w)===k).reduce((a,w)=>a+spendTotal(w), 0);
}
function monthShops(k){
  return spendWeeks().filter(w=>monthKey(w)===k).reduce((a,w)=>a+spendEntries(w).length, 0);
}
/* Every month between the first and the last, so a quiet month shows as a gap. */
function monthSeries(limit){
  const ms = spendMonths();
  if(!ms.length) return [];
  const [fy,fm] = ms[0].split("-").map(Number);
  const [ly,lm] = ms[ms.length-1].split("-").map(Number);
  const span = (ly-fy)*12 + (lm-fm) + 1;
  const n = Math.min(span, limit||12);
  const out = [];
  for(let k=n-1; k>=0; k--){
    let y = ly, m = lm - k;
    while(m < 1){ m += 12; y -= 1; }
    const key = y + "-" + String(m).padStart(2,"0");
    out.push({ key, label:MONTHS[m-1], total:monthTotal(key), has:ms.includes(key) });
  }
  return out;
}
function sectionTotals(w){
  const acc = {};
  spendEntries(w).forEach(s=>{
    const sec = s.doc.sections || {}, c = entryCur(s.doc);
    Object.keys(sec).forEach(k=>{ const v=Number(sec[k])||0; if(v) acc[k]=(acc[k]||0)+inDisplay(v,c); });
  });
  return acc;
}

function barPath(x,y,w,h,r){
  r = Math.max(0, Math.min(r, w/2, h));
  return "M"+x+","+(y+h)+" L"+x+","+(y+r)+" Q"+x+","+y+" "+(x+r)+","+y
       + " L"+(x+w-r)+","+y+" Q"+(x+w)+","+y+" "+(x+w)+","+(y+r)
       + " L"+(x+w)+","+(y+h)+" Z";
}
/* One series, one hue, so no legend — the heading says what it is. */
function spendChart(series, avg){
  if(!series.length) return "";
  const W=340, H=168, PAD_L=26, PAD_R=8, PAD_T=26, PAD_B=22;   // left gutter for the avg tag
  const plotW = W-PAD_L-PAD_R, plotH = H-PAD_T-PAD_B;
  const max = Math.max(avg, ...series.map(s=>s.total)) || 1;
  const top = max * 1.12;
  const slot = plotW / series.length;
  const bw = Math.max(6, Math.min(24, slot-6));
  const y = v => PAD_T + plotH - (v/top)*plotH;

  let bars = "", labels = "";
  series.forEach((s,n)=>{
    const x = PAD_L + slot*n + (slot-bw)/2;
    const on = spendWeekSel === s.key;
    if(s.has){
      bars += '<path d="'+barPath(x, y(s.total), bw, PAD_T+plotH-y(s.total), 4)+'" fill="var(--chart)"'
            + (on?'':' opacity="'+(spendWeekSel?0.35:1)+'"')
            + ' data-spendweek="'+s.key+'"></path>';
    }else{
      bars += '<rect x="'+x+'" y="'+(PAD_T+plotH-3)+'" width="'+bw+'" height="3" rx="1.5" fill="var(--grid)"'
            + ' data-spendweek="'+s.key+'"></rect>';
    }
    if(n===0 || n===series.length-1 || (series.length<=6 && s.has)){
      labels += '<text x="'+(x+bw/2)+'" y="'+(H-6)+'" text-anchor="middle" font-size="10.5" fill="var(--muted)">'
              + esc(s.label) + '</text>';
    }
  });
  // the one direct label: the most recent shop
  const lastS = series[series.length-1];
  let tip = "";
  if(lastS && lastS.has){
    const x = PAD_L + slot*(series.length-1) + slot/2;
    tip = '<text x="'+x+'" y="'+(y(lastS.total)-8)+'" text-anchor="end" font-size="12.5" font-weight="700" fill="var(--ink)">'
        + money0(lastS.total) + '</text>';
  }
  const avgY = y(avg);
  const avgLine = avg>0
    ? '<line x1="'+PAD_L+'" y1="'+avgY+'" x2="'+(W-PAD_R)+'" y2="'+avgY+'" stroke="var(--grid)" stroke-width="1"></line>'
      /* Just "avg" — the figure itself is in the card above, so repeating it
         only creates something to collide with. */
      + '<text x="0" y="'+(avgY+3.5)+'" font-size="10" fill="var(--muted)">avg</text>'
    : "";
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Weekly shopping spend">'
       + avgLine + bars + tip + labels + '</svg>';
}

/* The nip-to-the-shops row: pick the shop, type the amount, done. */
function quickAddHTML(){
  return '<div class="card quickadd">'
    + '<div class="small muted" style="margin-bottom:8px">Quick add — a shop you\'ve just done</div>'
    + weekChooserHTML(quickWeek, "data-qweek")
    + '<div class="row" style="gap:8px;margin-top:10px">'
    + '<select id="qShop" style="flex:1.2">'+SHOPS.map(s=>'<option'+(s===quickShop?" selected":"")+'>'+s+'</option>').join("")+'</select>'
    + '<input type="number" step="0.01" inputmode="decimal" id="qAmt" placeholder="'+esc(curSym().trim())+' amount" value="'+esc(quickAmt)+'" style="flex:1">'
    + '<button class="btn primary" data-act="quickadd">Add</button>'
    + '</div></div>';
}
function bindQuick(){
  const s = document.getElementById("qShop"), a = document.getElementById("qAmt");
  if(s) s.addEventListener("change", ()=>{ quickShop = s.value; });
  if(a) a.addEventListener("input", ()=>{ quickAmt = a.value; });
}
function quickAdd(){
  const s = document.getElementById("qShop"), a = document.getElementById("qAmt");
  const amt = Number(a && a.value);
  if(!amt || amt<=0){ toast("Put in an amount"); return; }
  put("spend", uid("sp-"), { week:quickWeek, amount:Math.round(amt*100)/100, shop:(s&&s.value)||"Other",
                             cur:curCode(), at:Date.now(), sections:{} });
  quickAmt = ""; spendWeekSel = null;
  renderSpend();
  const wl = quickWeek === iso(weekStartOf(new Date())) ? "this week" : "week of "+fmtShort(parseISO(quickWeek));
  toast(money(amt)+" at "+((s&&s.value)||"the shops")+" · "+wl);
}

function renderSpend(){
  const weeks = spendWeeks();
  const monthly = spendMode === "month";
  const addBtn = '<button class="btn" data-act="addspend" style="width:100%;margin-top:12px;padding:13px">+ Add a full receipt</button>';

  if(!weeks.length){
    view.innerHTML = '<div class="viz-root">' + quickAddHTML()
      + '<div class="card empty" style="margin-top:14px">Nothing recorded yet.<br>'
      + '<span class="small">Add a top-up above, or put a full receipt in below.</span></div>' + addBtn + '</div>';
    bindQuick();
    return;
  }

  const thisWeek = iso(weekStartOf(new Date()));
  const thisMonth = thisWeek.slice(0,7);
  const recorded = monthly ? spendMonths().map(monthTotal) : weeks.map(spendTotal);
  const avg = recorded.length ? recorded.reduce((a,b)=>a+b,0)/recorded.length : 0;
  const thisTotal = monthly ? monthTotal(thisMonth) : spendTotal(thisWeek);
  const shops = monthly ? monthShops(thisMonth) : spendEntries(thisWeek).length;
  const series = monthly ? monthSeries(12) : spendSeries(12);

  let html = '<div class="viz-root">' + quickAddHTML();
  html += '<div class="hero" style="margin-top:18px"><span class="big">'+(thisTotal?money(thisTotal):"—")+'</span>'
    + '<span class="sub">this '+(monthly?"month":"week")
    + (shops?" · "+shops+" "+plural(shops,"shop"):", nothing yet")+'</span></div>';

  html += '<div class="kpis">'
    + '<div class="kpi"><div class="k">'+(monthly?"Monthly":"Weekly")+' average</div><div class="v">'+money(avg)+'</div></div>'
    + '<div class="kpi"><div class="k">'+(monthly?"Months":"Weeks")+' tracked</div><div class="v">'+recorded.length+'</div></div>'
    + '</div>';
  if(anyConverted()){
    const cfg = moneyCfg();
    html += '<p class="tiny muted" style="margin:8px 2px 0">Shown in '+cfg.cur
      + '. Other currencies converted at 1 GBP = '+cfg.rate+' QAR — '
      + '<button class="btn sm ghost" data-act="money" style="padding:0;font-size:12px">change</button></p>';
  }

  const hit = series.find(s=>s.key===spendWeekSel && s.has);
  const sel = hit
    ? (monthly ? monthLabel(hit.key) : fmtShort(parseISO(hit.key))) + " — " + money(hit.total)
    : "Tap a bar to see that "+(monthly?"month":"week");
  html += '<div class="card chartcard">'
    + '<div class="row" style="margin-bottom:8px"><div class="small muted" style="flex:1">Spend per '+(monthly?"month":"week")+'</div>'
    + '<span class="row" style="gap:6px">'
    + '<button class="btn sm seg'+(monthly?"":" on")+'" data-spmode="week">Weekly</button>'
    + '<button class="btn sm seg'+(monthly?" on":"")+'" data-spmode="month">Monthly</button></span></div>'
    + spendChart(series, avg) + '<div class="chartcap">'+esc(sel)+'</div></div>';

  // Where the money went, when the sections have been filled in
  const secWeek = (spendWeekSel && Object.keys(sectionTotals(spendWeekSel)).length) ? spendWeekSel
                : weeks.slice().reverse().find(w=>Object.keys(sectionTotals(w)).length);
  if(secWeek){
    const sec = sectionTotals(secWeek);
    const rows = Object.keys(sec).sort((a,b)=>sec[b]-sec[a]);
    const top = sec[rows[0]] || 1;
    const sum = rows.reduce((a,k)=>a+sec[k],0);
    const tot = spendTotal(secWeek);
    html += '<label class="f" style="margin-top:22px">Where it went · week of '+fmtShort(parseISO(secWeek))+'</label>'
      + '<div class="card" style="padding:10px 14px">'
      + rows.map(k=>'<div class="secbar"><span class="sl">'+esc(k)+'</span>'
        + '<span class="st"><i style="width:'+Math.round((sec[k]/top)*100)+'%"></i></span>'
        + '<span class="sv">'+money(sec[k])+'</span></div>').join("")
      + (tot - sum > 0.01
          ? '<div class="secbar"><span class="sl">Unassigned</span><span class="st"><i style="width:'
            + Math.round(((tot-sum)/top)*100)+'%;opacity:.4"></i></span><span class="sv">'+money(tot-sum)+'</span></div>'
          : "")
      + '</div>';
  }

  if(monthly){
    html += '<label class="f" style="margin-top:22px">Every month</label><div class="card">'
      + spendMonths().slice().reverse().map(k=>{
          const n = monthShops(k), wk = spendWeeks().filter(w=>monthKey(w)===k).length;
          return '<div class="wrow"><div class="wd"><div class="wk">'+monthLabel(k)+'</div>'
            + '<div class="wm">'+wk+' '+plural(wk,"week")+' · '+n+' '+plural(n,"shop")+'</div></div>'
            + '<div class="wv">'+money(monthTotal(k))+'</div></div>';
        }).join("")
      + '</div>';
  }else{
    html += '<label class="f" style="margin-top:22px">Every week</label><div class="card">'
      + weeks.slice().reverse().map(w=>{
          const d = weekDates(w), n = spendEntries(w).length;
          const hasSec = Object.keys(sectionTotals(w)).length;
          return '<button class="wrow" data-spendopen="'+w+'"><div class="wd">'
            + '<div class="wk">'+fmtShort(d[0])+' – '+fmtShort(d[6])+'</div>'
            + '<div class="wm">'+n+' '+plural(n,"shop")+(hasSec?" · broken down":"")+'</div></div>'
            + '<div class="wv">'+money(spendTotal(w))+'</div></button>';
        }).join("")
      + '</div>';
  }

  html += addBtn + '</div>';
  view.innerHTML = html;
  bindQuick();
}

/* ---- add / edit a receipt ---- */
let spendDraft = null;
function openSpend(id){
  const ex = id ? get(id) : null;
  spendDraft = ex
    ? { id:ex.id, week:ex.doc.week, amount:ex.doc.amount, shop:ex.doc.shop||"",
        cur:entryCur(ex.doc), sections:Object.assign({}, ex.doc.sections||{}) }
    : { id:null, week:defaultSpendWeek(), amount:"", shop:"",
        cur:curCode(), sections:{} };
  drawSpendSheet();
}
function secSummary(){
  const d = spendDraft;
  const sum = Object.keys(d.sections).reduce((a,k)=>a+(Number(d.sections[k])||0),0);
  const amt = Number(d.amount)||0;
  return "Sections add up to <b>"+money(sum,d.cur)+"</b>" + (amt ? " of "+money(amt,d.cur) : "") + ".";
}
function drawSpendSheet(){
  const d = spendDraft, wd = weekDates(d.week);
  let h = '<label class="f">Currency on this receipt</label>'
    + '<div class="row" style="gap:8px;margin-bottom:14px">'
    + Object.keys(CURRENCIES).map(c=>{
        const sym = CURRENCIES[c].sym.trim();
        return '<button class="btn seg'+(d.cur===c?" on":"")+'" data-spcur="'+c+'" style="flex:1">'
          + c + (sym!==c ? ' <span style="font-weight:400;opacity:.7">'+sym+'</span>' : "") + '</button>';
      }).join("")
    + '</div>'
    + '<label class="f">Total on the receipt</label>'
    + '<div class="row" style="gap:8px"><span style="font-size:20px;font-weight:700;color:var(--muted)">'+esc(curSym(d.cur).trim())+'</span>'
    + '<input type="number" step="0.01" inputmode="decimal" id="spAmount" placeholder="0.00" value="'+(d.amount===""?"":d.amount)+'" style="font-size:22px;font-weight:700;padding:12px"></div>'
    + '<label class="f" style="margin-top:14px">Shop</label>'
    + '<select id="spShop">'
    + SHOPS.map(s=>'<option'+((d.shop===s || (s==="Other" && d.shop && SHOPS.indexOf(d.shop)<0))?" selected":"")+'>'+s+'</option>').join("")
    + '</select>'
    + (d.shop && SHOPS.indexOf(d.shop)<0
        ? '<input type="text" id="spShopOther" placeholder="Which shop?" value="'+esc(d.shop)+'" style="margin-top:8px">'
        : '<input type="text" id="spShopOther" placeholder="Which shop?" style="margin-top:8px;display:none">')
    + '<label class="f" style="margin-top:14px">Which week is this shop for</label>'
    + weekChooserHTML(d.week, "data-fweek")
    + '<div class="weeknav" style="margin:8px 0 0"><button class="arrow" data-spweek="-1">‹</button>'
    + '<div class="wlabel" style="font-size:13px;font-weight:600">'+fmtShort(wd[0])+' – '+fmtShort(wd[6])+'</div>'
    + '<button class="arrow" data-spweek="1">›</button></div>';

  h += '<details style="margin-top:16px"'+(Object.keys(d.sections).length?" open":"")+'>'
    + '<summary class="f" style="cursor:pointer;margin-bottom:10px">Break it down by section — optional</summary>'
    + '<p class="tiny muted" style="margin:0 0 10px">Only if you fancy it. Fill in what you can; anything left over shows as unassigned.</p>'
    + AISLES.map(a=>'<div class="row" style="gap:10px;margin-bottom:7px">'
        + '<span class="small" style="flex:1">'+a+'</span>'
        + '<input type="number" step="0.01" inputmode="decimal" data-sec="'+esc(a)+'" value="'+(d.sections[a]||"")+'" placeholder="0.00" style="width:104px">'
        + '</div>').join("")
    + '<p class="small muted" id="secSum" style="margin:10px 0 0">'+secSummary()+'</p></details>';

  h += '<div class="row" style="margin-top:20px;gap:8px"><button class="btn primary" data-act="savespend">Save</button>'
    + '<button class="btn ghost" data-close>Cancel</button>'
    + (d.id?'<div class="sp"></div><button class="btn sm danger" data-act="delspend">Delete</button>':"")
    + '</div>';
  sheet(d.id?"Edit receipt":"What you spent", h);

  const grab = ()=>{
    const a = document.getElementById("spAmount"), s = document.getElementById("spShop");
    const o = document.getElementById("spShopOther");
    if(a) spendDraft.amount = a.value;
    if(s){
      const other = s.value === "Other";
      if(o) o.style.display = other ? "" : "none";
      spendDraft.shop = other ? ((o && o.value.trim()) || "Other") : s.value;
    }
    modal.querySelectorAll("[data-sec]").forEach(el=>{
      const v = el.value.trim();
      if(v === "") delete spendDraft.sections[el.dataset.sec];
      else spendDraft.sections[el.dataset.sec] = Number(v)||0;
    });
  };
  /* Update the running total in place rather than redrawing — a redraw
     would yank the keyboard away mid-entry. */
  const refresh = ()=>{ grab(); const el = document.getElementById("secSum"); if(el) el.innerHTML = secSummary(); };
  modal.querySelectorAll("#spAmount,#spShop,#spShopOther,[data-sec]").forEach(el=>{
    el.addEventListener("input", refresh);
    el.addEventListener("change", refresh);
  });
  spendDraft.grab = grab;
}
function saveSpend(){
  if(spendDraft.grab) spendDraft.grab();
  const d = spendDraft;
  const amt = Number(d.amount);
  if(!amt || amt<=0){ toast("Put in what it came to"); return; }
  const doc = { week:d.week, amount:Math.round(amt*100)/100, shop:(d.shop||"").trim(),
                cur: d.cur || curCode(),
                at: d.id ? (get(d.id)||{doc:{}}).doc.at || Date.now() : Date.now(),
                sections: d.sections };
  put("spend", d.id || uid("sp-"), doc);
  closeModal(); spendWeekSel = d.week; tab = "spend"; render(); toast("Saved");
}

    + '<label class="f">Show everything in</label>'

        + c + ' <span style="font-weight:400;opacity:.7">'+CURRENCIES[c].name+'</span></button>').join("")
    + '</div>'
    + '<label class="f">Exchange rate</label>'
    + '<div class="row" style="gap:8px"><span class="small" style="white-space:nowrap">1 GBP =</span>'
    + '<input type="number" step="0.0001" inputmode="decimal" id="fxRate" value="'+cfg.rate+'" style="width:120px">'
    + '<span class="small">QAR</span></div>'
    + '<p class="tiny muted" style="margin:8px 0 0">You set this yourself, so it never changes behind your back. Around '
    + DEFAULT_RATE + ' as of August 2026 — update it whenever you like.</p>'
    + '<div class="row" style="margin-top:20px;gap:8px"><button class="btn primary" data-act="savemoney">Save</button>'
    + '<button class="btn ghost" data-close>Cancel</button></div>';

}
function openSpendWeek(w){
  const list = spendEntries(w), wd = weekDates(w);
  let h = '<p class="small muted" style="margin:0 0 14px">'+fmtShort(wd[0])+' – '+fmtShort(wd[6])
    + ' · total <b>'+money(spendTotal(w))+'</b></p><div class="card">'
    + list.map(s=>{
        const c = entryCur(s.doc), foreign = c !== curCode();
        return '<button class="wrow" data-spendedit="'+s.id+'"><div class="wd">'
          + '<div class="wk">'+esc(s.doc.shop || "Shop")+'</div>'
          + '<div class="wm">'+(Object.keys(s.doc.sections||{}).length?"broken down":"total only")
          + (foreign ? " · paid "+money(s.doc.amount,c) : "")+'</div></div>'
          + '<div class="wv">'+money(inDisplay(s.doc.amount,c))+'</div></button>';
      }).join("")
    + '</div>'
    + '<button class="btn" data-act="addspend" data-week="'+w+'" style="margin-top:14px">+ Another shop this week</button>';
  sheet("Week of "+fmtShort(wd[0]), h);
}

/* Everything on the list — worked out from the meals, plus anything typed
   in by hand — as one sorted set of rows. */
function shoppingRows(w){
  const rows = buildList(w).map(it=>({
      kind:"calc", key:it.key, item:itemLabel(it.item,it.qty,it.unit), raw:it.item,
      qty:it.qty, base:it.base, extra:it.extra, unit:it.unit,
      aisle:it.aisle, sources:it.sources, done:it.done }))
    .concat(extrasFor(w).map(x=>({
      kind:"extra", id:x.id, item:x.doc.text, qty:null, unit:"",
      aisle:x.doc.aisle||"Other", sources:[], done:!!x.doc.checked })));
  rows.sort((a,b)=>{
    const ai=AISLES.indexOf(a.aisle), bi=AISLES.indexOf(b.aisle);
    if(ai!==bi) return (ai<0?99:ai)-(bi<0?99:bi);
    return a.item.localeCompare(b.item);
  });
  return rows;
}

/* Ticked things drop out of the list so what's left is what you still need.
   Kept per device — it's a view preference, not something to impose on her. */
const PICKED_KEY = "mealplan.showpicked";
let showPicked = lsGet(PICKED_KEY) === "1";

function renderShopping(){
  const rows = shoppingRows(week), meals = weekMeals(week);
  const addBtn = '<button class="btn primary" data-act="additems" style="width:100%;margin-top:18px;padding:11px">+ Add items to the list</button>';
  let html = weekNav();

  if(!rows.length){
    view.innerHTML = html
      + '<div class="card empty">Nothing on the list yet.<br><span class="small">Plan some meals for this week, or add anything you need below.</span></div>'
      + addBtn;
    return;
  }

  const doneN = rows.filter(r=>r.done).length;
  const visible = showPicked ? rows : rows.filter(r=>!r.done);

  html += '<div class="row wrap small muted" style="margin:-4px 4px 10px">'
    + '<span>'+doneN+" of "+rows.length+' picked up · '+meals.length+" "+plural(meals.length,"meal")+'</span>'
    + '<div class="sp"></div>'
    + '<span class="row" style="gap:2px">'
    + (doneN ? '<button class="btn sm ghost" data-act="togglepicked">'+(showPicked?"Hide picked up":"Show all")+'</button>' : "")
    + '<button class="btn sm ghost" data-act="copylist">Copy as text</button>'
    + '<button class="btn sm ghost" data-act="resetlist">Reset ticks</button></span></div>';

  if(!visible.length){
    view.innerHTML = html
      + '<div class="card empty">Everything ticked off.<br><span class="small">'+doneN+' '+plural(doneN,"item")+' picked up.</span>'
      + '<div style="margin-top:14px"><button class="btn sm" data-act="togglepicked">Show the list again</button></div></div>'
      + addBtn;
    return;
  }

  let cur=null, body="";
  visible.forEach(r=>{
    if(r.aisle!==cur){ if(cur!==null) body+='</div>'; cur=r.aisle; body+='<h3>'+esc(cur)+'</h3><div class="card">'; }
    const tick = r.kind==="calc" ? 'data-tick="'+esc(r.key)+'"' : 'data-tickx="'+r.id+'"';
    const del  = r.kind==="calc" ? 'data-hide="'+esc(r.key)+'" title="Already have it"' : 'data-delx="'+r.id+'"';
    // On calculated rows the quantity is tappable, so you can buy more than
    // the recipes strictly need.
    const qtyHTML = r.kind==="calc"
      ? '<button class="qtybtn'+(r.extra?" tweaked":"")+'" data-adjust="'+esc(r.key)+'">'
        + (r.qty!=null ? prettyQty(r.qty,r.unit,true) : "+") + '</button> '
      : (r.qty!=null?'<span class="qty" style="font-weight:700">'+prettyQty(r.qty,r.unit,true)+'</span> ':"");
    const note = (r.kind==="calc" && r.extra)
      ? '<span class="src">'+(r.base?prettyQty(r.base,r.unit,true)+" for meals · ":"")
        +(r.extra>0?"+":"−")+prettyQty(Math.abs(r.extra),r.unit,true)+' added</span>'
      : (r.sources.length?'<span class="src">'+esc(r.sources.join(", "))+'</span>':"");
    body += '<div class="item'+(r.done?" done":"")+'">'
      + '<button class="cb" '+tick+'>'+(r.done?"✓":"")+'</button>'
      + '<div class="txt">' + qtyHTML + esc(r.item) + note
      + '</div><button class="del" '+del+'>×</button></div>';
  });
  if(cur!==null) body+='</div>';
  view.innerHTML = html + '<div class="aisle">'+body+'</div>' + addBtn;
}

/* Buy more (or less) of something than the week's meals strictly need —
   an extra bag of carrots for snacking, say. Stored per week. */
let adjKey = null;
function openAdjust(key){
  const r = shoppingRows(week).find(x=>x.kind==="calc" && x.key===key);
  if(!r) return;
  adjKey = key;
  const unitTxt = r.unit || "";
  let total = r.qty==null ? 0 : r.qty;
  // Match what the list shows, so the number doesn't appear to change on tap.
  if((r.unit==="g"||r.unit==="ml") && total>=25) total = Math.round(total/5)*5;
  sheet("How much to buy",
      '<p style="margin:0 0 4px;font-size:17px;font-weight:650">'+esc(r.raw)+'</p>'
    + '<p class="small muted" style="margin:0">'
    + (r.base ? 'Your meals this week need '+prettyQty(r.base,r.unit,true)+'.'
              : 'Your meals don’t give this a quantity.')
    + '</p>'
    + '<div class="stepper">'
    + '<button data-step="-1" aria-label="Less">−</button>'
    + '<input type="number" id="adjVal" min="0" step="any" value="'+(Math.round(total*100)/100)+'">'
    + '<button data-step="1" aria-label="More">+</button></div>'
    + '<p class="small muted" style="text-align:center;margin:0 0 18px">'+(unitTxt?esc(unitTxt):"how many")+' to buy</p>'
    + '<div class="row" style="gap:8px"><button class="btn primary" data-act="adjsave">Done</button>'
    + (r.extra?'<button class="btn ghost" data-act="adjreset">Back to recipe amount</button>':"")
    + '</div>');
}
function stepAdjust(dir){
  const inp = document.getElementById("adjVal"); if(!inp) return;
  const r = shoppingRows(week).find(x=>x.kind==="calc" && x.key===adjKey);
  const step = stepFor(r ? r.unit : "");
  const now = Number(inp.value)||0;
  inp.value = Math.max(0, Math.round((now + dir*step)*100)/100);
}
function saveAdjust(){
  const inp = document.getElementById("adjVal");
  const r = shoppingRows(week).find(x=>x.kind==="calc" && x.key===adjKey);
  if(!inp || !r){ closeModal(); return; }
  const want = Math.max(0, Number(inp.value)||0);
  const base = r.base==null ? 0 : r.base;
  const extra = Math.round((want - base)*100)/100;
  if(extra === 0) drop(adjId(week, adjKey));
  else put("adj", adjId(week, adjKey), {week, key:adjKey, extra});
  closeModal(); renderShopping();
}
function resetAdjust(){
  drop(adjId(week, adjKey));
  closeModal(); renderShopping(); toast("Back to the recipe amount");
}

/* Type as many things as you like, one per line or comma separated. */
function openAddItems(){
  const opts = AISLES.map(a=>'<option value="'+a+'"'+(a==="Other"?" selected":"")+'>'+a+'</option>').join("");
  sheet("Add to the list",
      '<p class="small muted" style="margin:0 0 12px">One per line, or separated by commas. Anything at all — washing up liquid, tissues, a birthday card.</p>'
    + '<textarea id="bulkItems" rows="7" placeholder="washing up liquid&#10;tissues&#10;bin bags, foil"></textarea>'
    + '<label class="f" style="margin-top:14px">Where in the shop?</label>'
    + '<select id="bulkAisle">'+opts+'</select>'
    + '<p class="tiny muted" style="margin:8px 0 0">Only affects where they sit on the list. Household covers cleaning and toiletries.</p>'
    + '<div class="row" style="margin-top:18px;gap:8px"><button class="btn primary" data-act="addbulk">Add to list</button>'
    + '<button class="btn ghost" data-close>Cancel</button></div>');
  setTimeout(()=>{ const t=document.getElementById("bulkItems"); if(t) t.focus(); }, 60);
}
function addBulkItems(){
  const ta = document.getElementById("bulkItems");
  const aisle = document.getElementById("bulkAisle").value || "Other";
  const names = (ta.value||"").split(/[\n,]/).map(s=>s.trim()).filter(Boolean);
  if(!names.length){ toast("Nothing to add"); return; }
  const seen = new Set(extrasFor(week).map(x=>normItem(x.doc.text)));
  let added = 0, dupes = 0;
  names.forEach((text,i)=>{
    const k = normItem(text);
    if(seen.has(k)){ dupes++; return; }
    seen.add(k);
    put("extra", uid("x-"), {week, text, checked:false, order:Date.now()+i, aisle});
    added++;
  });
  closeModal(); renderShopping();
  toast(added
    ? added+" "+plural(added,"item")+" added"+(dupes?" ("+dupes+" already on the list)":"")
    : "Already on the list");
}

function closeModal(){ modal.innerHTML=""; }
function sheet(title, bodyHTML, headExtra){

}

function openRecipe(id){

    + '<button class="btn sm ghost" data-act="editrecipe" data-id="'+r.id+'" data-focus="ing">Edit</button></div>'
    + '<div style="margin-bottom:20px">'
    + d.ingredients.map(i=>'<div class="ingline"><span style="min-width:78px;font-weight:700">'+prettyQty(i.qty,i.unit)+'</span><span>'+esc(i.item)+'</span></div>').join("")
    + '</div>';

  h += '<div class="row" style="align-items:baseline"><label class="f" style="flex:1">Method</label>'
    + '<button class="btn sm ghost" data-act="editrecipe" data-id="'+r.id+'" data-focus="step">Edit</button></div>'
    + '<ol class="method">'
    + d.steps.map(s=>'<li>'+esc(s.text)+(s.mins?'<span class="t">'+s.mins+' min</span>':"")+'</li>').join("")
    + '</ol>';

  const n = d.nutrition;

      + '<span><b>'+n.kcal+'</b> kcal</span><span><b>'+n.protein+'g</b> protein</span>'
      + '<span><b>'+n.carbs+'g</b> carbs</span><span><b>'+n.fat+'g</b> fat</span>'
      + '<span><b>'+n.fibre+'g</b> fibre</span></div>'
      + (n.note?'<p class="tiny muted" style="margin:0 0 6px">'+esc(n.note)+'</p>':"");
  }

  if(list(d.tips).length){
    h += '<label class="f" style="margin-top:20px">Chef’s tips</label><ul style="margin:0 0 4px;padding-left:20px">'
      + d.tips.map(t=>'<li style="margin-bottom:6px;font-size:14.5px;line-height:1.5">'+esc(t)+'</li>').join("")+'</ul>';
  }
  if(d.storage && (d.storage.fridge||d.storage.freezer)){
    h += '<label class="f" style="margin-top:20px">Storage</label>'
      + (d.storage.fridge?'<p class="small" style="margin:0 0 5px"><b>Fridge:</b> '+esc(d.storage.fridge)+'</p>':"")
      + (d.storage.freezer?'<p class="small" style="margin:0"><b>Freezer:</b> '+esc(d.storage.freezer)+'</p>':"");
  }
  if(list(d.serveWith).length){
    h += '<label class="f" style="margin-top:20px">Serve with</label>'
      + '<p class="small muted" style="margin:0">'+esc(d.serveWith.join(" · "))+'</p>';
  }
  if(list(d.equipment).length){
    h += '<label class="f" style="margin-top:20px">Equipment</label>'
      + '<p class="small muted" style="margin:0">'+esc(d.equipment.join(" · "))+'</p>';
  }

  h = '<button class="bigbtn" data-cookstart="'+r.id+'" style="margin-bottom:18px">▶  Start cooking</button>' + h;

  h += '<div class="row wrap" style="margin-top:22px;gap:8px">'
    + '<button class="btn" data-act="editrecipe" data-id="'+r.id+'">Edit recipe</button>'
    + '<button class="btn" data-act="pasterecipe" data-id="'+r.id+'">Paste over</button>'
    + '<div class="sp"></div><button class="btn danger" data-act="delrecipe" data-id="'+r.id+'">Delete</button></div>';
  sheet(esc(d.name), h,
    '<button class="btn sm" data-act="editrecipe" data-id="'+r.id+'">Edit</button>');
}
