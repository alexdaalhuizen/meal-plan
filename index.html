let draft=null, draftId=null, parseNotes=[];
function openEditor(id, focus){
  parseNotes=[];
  if(id){ draftId=id; draft=JSON.parse(JSON.stringify(recipeById(id).doc)); }
  else{ draftId=null; draft={name:"",servings:2,prep:10,cook:20,time:30,batch:false,tags:[],
        ingredients:[{qty:"",unit:"",item:"",aisle:"Produce"}],steps:[{text:"",mins:""}]}; }
  draft.freezer  = draft.freezer  || {ok:false,note:""};
  draft.storage  = draft.storage  || {fridge:"",freezer:""};
  draft.nutrition= draft.nutrition|| {kcal:"",protein:"",carbs:"",fat:"",fibre:"",note:""};
  ["equipment","tips","serveWith"].forEach(k=>{ draft[k] = draft[k] || []; });
  drawEditor();
  if(focus){                                   // jump straight to the bit they tapped
    setTimeout(()=>{
      const el = document.getElementById(focus==="step" ? "editStep" : "editIng");
      if(el) el.scrollIntoView({block:"start"});
    }, 60);
  }
}
function drawEditor(){
  const r=draft;
  const unitOpts=u=>UNITS.map(x=>'<option value="'+x+'"'+(x===u?" selected":"")+'>'+(x||"—")+'</option>').join("");
  const aisleOpts=a=>AISLES.map(x=>'<option value="'+x+'"'+(x===a?" selected":"")+'>'+x+'</option>').join("");
  let h='<div class="grid2" style="margin-bottom:10px">'
    + '<div style="grid-column:1/-1"><label class="f">Name</label><input type="text" data-d="name" value="'+esc(r.name)+'" placeholder="Spaghetti bolognese"></div>'
    + '<div><label class="f">Serves</label><input type="number" min="1" data-d="servings" value="'+r.servings+'"></div>'
    + '<div><label class="f">Total min</label><input type="number" min="1" data-d="time" value="'+r.time+'"></div>'
    + '<div><label class="f">Prep min</label><input type="number" min="0" data-d="prep" value="'+(r.prep||"")+'"></div>'
    + '<div><label class="f">Cook min</label><input type="number" min="0" data-d="cook" value="'+(r.cook||"")+'"></div>'
    + '<div style="grid-column:1/-1"><label class="f">Tags</label><input type="text" data-d="tags" value="'+esc((r.tags||[]).join(", "))+'" placeholder="quick, chicken"></div></div>'
    + '<label class="row small" style="gap:8px;margin-bottom:8px"><input type="checkbox" data-d="batch" '+(r.batch?"checked":"")+' style="width:auto"> Good for batch cooking</label>'
    + '<label class="row small" style="gap:8px;margin-bottom:8px"><input type="checkbox" data-d="freezer.ok" '+(r.freezer.ok?"checked":"")+' style="width:auto"> Freezer friendly</label>'
    + '<input type="text" data-d="freezer.note" value="'+esc(r.freezer.note||"")+'" placeholder="Freezing note (optional)" style="margin-bottom:18px">'
    + '<label class="f" id="editIng">Ingredients</label>';
  r.ingredients.forEach((i,n)=>{
    h += '<div class="ingedit">'
      + '<input class="iname" type="text" placeholder="Ingredient" value="'+esc(i.item)+'" data-ing="'+n+'" data-k="item">'
      + '<button class="btn sm ghost rmi" data-rmi="'+n+'" aria-label="Remove">×</button>'
      + '<input class="iqty" type="number" step="any" placeholder="Qty" value="'+(i.qty==null?"":i.qty)+'" data-ing="'+n+'" data-k="qty">'
      + '<select class="iunit" data-ing="'+n+'" data-k="unit">'+unitOpts(i.unit)+'</select>'
      + '<select class="iaisle" data-ing="'+n+'" data-k="aisle">'+aisleOpts(i.aisle)+'</select>'
      + '</div>';
  });
  h += '<button class="btn sm" data-addi style="margin:4px 0 18px">+ Ingredient</button><label class="f" id="editStep">Method</label>';
  r.steps.forEach((s,n)=>{
    h += '<div class="stepedit"><div class="stepnum snum">'+(n+1)+'</div>'
      + '<textarea class="stext" rows="3" placeholder="What to do" data-step="'+n+'" data-k="text">'+esc(s.text)+'</textarea>'
      + '<button class="btn sm ghost rms" data-rms="'+n+'" aria-label="Remove">×</button>'
      + '<input class="smins" type="number" min="0" placeholder="timer (min)" value="'+(s.mins||"")+'" data-step="'+n+'" data-k="mins">'
      + '</div>';
  });
  h += '<button class="btn sm" data-adds style="margin:4px 0 20px">+ Step</button>';

  const n = r.nutrition;
  h += '<details style="margin-bottom:20px"><summary class="f" style="cursor:pointer;margin-bottom:12px">More details</summary>'
    + '<label class="f">Equipment <span style="text-transform:none;font-weight:400">— one per line</span></label>'
    + '<textarea rows="3" data-list="equipment" style="margin-bottom:12px">'+esc((r.equipment||[]).join("\n"))+'</textarea>'
    + '<label class="f">Chef’s tips <span style="text-transform:none;font-weight:400">— one per line</span></label>'
    + '<textarea rows="4" data-list="tips" style="margin-bottom:12px">'+esc((r.tips||[]).join("\n"))+'</textarea>'
    + '<label class="f">Serve with <span style="text-transform:none;font-weight:400">— one per line</span></label>'
    + '<textarea rows="3" data-list="serveWith" style="margin-bottom:12px">'+esc((r.serveWith||[]).join("\n"))+'</textarea>'
    + '<label class="f">Storage</label>'
    + '<input type="text" data-d="storage.fridge" value="'+esc(r.storage.fridge||"")+'" placeholder="Fridge" style="margin-bottom:8px">'
    + '<input type="text" data-d="storage.freezer" value="'+esc(r.storage.freezer||"")+'" placeholder="Freezer" style="margin-bottom:14px">'
    + '<label class="f">Nutrition per serving</label><div class="grid2" style="margin-bottom:8px">'
    + '<div><input type="number" data-d="nutrition.kcal" value="'+(n.kcal||"")+'" placeholder="kcal"></div>'
    + '<div><input type="number" data-d="nutrition.protein" value="'+(n.protein||"")+'" placeholder="protein g"></div>'
    + '<div><input type="number" data-d="nutrition.carbs" value="'+(n.carbs||"")+'" placeholder="carbs g"></div>'
    + '<div><input type="number" data-d="nutrition.fat" value="'+(n.fat||"")+'" placeholder="fat g"></div>'
    + '<div><input type="number" data-d="nutrition.fibre" value="'+(n.fibre||"")+'" placeholder="fibre g"></div>'
    + '<div><input type="text" data-d="nutrition.note" value="'+esc(n.note||"")+'" placeholder="note"></div>'
    + '</div></details>';

  h += '<div class="row"><button class="btn primary" data-act="saverecipe">Save recipe</button><button class="btn ghost" data-close>Cancel</button></div>'
    + '<p class="tiny muted" style="margin-top:12px">Minutes on a step are optional — they power the cook-along timers.</p>';

  if(parseNotes.length){                       // what the paste reader guessed at
    h = '<div class="pbox"><b>Read from your text — worth a check</b>'
      + parseNotes.map((n,i)=>'<div class="pnote">'+esc(n.msg)
          + (n.add?' <button class="btn sm" data-pfix="'+i+'">Add it</button>':'')
          + '<button class="pdis" data-pdis="'+i+'" aria-label="Dismiss">×</button></div>').join('')
      + '</div>' + h;
  }
  sheet(draftId?"Edit recipe":"New recipe", h);

  const NUMS = ["servings","time","prep","cook"];
  modal.querySelectorAll("[data-d]").forEach(el=>el.addEventListener("change",()=>{
    const k=el.dataset.d;
    if(k.indexOf(".")>-1){                                  // freezer.ok, nutrition.kcal, …
      const [a,b]=k.split(".");
      draft[a] = draft[a] || {};
      draft[a][b] = el.type==="checkbox" ? el.checked
                  : el.type==="number"   ? (el.value===""?"":Number(el.value))
                  : el.value;
      return;
    }
    if(k==="batch") draft.batch=el.checked;
    else if(k==="tags") draft.tags=el.value.split(",").map(s=>s.trim()).filter(Boolean);
    else if(NUMS.includes(k)) draft[k]=Number(el.value)||(k==="servings"||k==="time"?1:0);
    else draft[k]=el.value;
  }));
  modal.querySelectorAll("[data-list]").forEach(el=>el.addEventListener("change",()=>{
    draft[el.dataset.list] = el.value.split("\n").map(s=>s.trim()).filter(Boolean);
  }));
  modal.querySelectorAll("[data-ing]").forEach(el=>el.addEventListener("change",()=>{
    const i=Number(el.dataset.ing), k=el.dataset.k;
    draft.ingredients[i][k] = (k==="qty") ? (el.value===""?null:Number(el.value)) : el.value;
  }));
  modal.querySelectorAll("[data-step]").forEach(el=>el.addEventListener("change",()=>{
    const i=Number(el.dataset.step), k=el.dataset.k;
    draft.steps[i][k] = (k==="mins") ? (el.value===""?"":Number(el.value)) : el.value;
  }));
}
function commitInputs(){ modal.querySelectorAll("[data-d],[data-ing],[data-step],[data-list]").forEach(el=>el.dispatchEvent(new Event("change"))); }
function saveRecipe(){
  commitInputs();
  if(!draft.name.trim()){ toast("Give the recipe a name"); return; }
  draft.ingredients = draft.ingredients.filter(i=>i.item.trim());
  draft.steps = draft.steps.filter(s=>s.text.trim());
  put("recipe", draftId || uid("r-"), draft);
  closeModal(); render(); toast("Saved");
}

/* =========================================================

   units, aisles, steps and cook-along timers. It is guessing
   throughout, so nothing is saved until you've looked it over.
   ========================================================= */

const FRACS = {"½":.5,"¼":.25,"¾":.75,"⅓":1/3,"⅔":2/3,"⅕":.2,"⅙":1/6,"⅛":.125,"⅜":.375,"⅝":.625,"⅞":.875};
const FRACSET = "½¼¾⅓⅔⅕⅙⅛⅜⅝⅞";

/* Brand names, so a pasted "Philadelphia Light" merges on the shopping list
   with the "light cream cheese" your other recipes already ask for. */
const BRANDS = [
  [/\bphiladelphia\b/ig, "cream cheese"], [/\blurpak\b/ig, "butter"], [/\bkerrygold\b/ig, "butter"],
  [/\bhellmann'?s\b/ig, "mayonnaise"], [/\bcathedral city\b/ig, "Cheddar"], [/\boxo\b/ig, "stock cube"],
  [/\bknorr\b/ig, ""], [/\bheinz\b/ig, ""], [/\bbisto\b/ig, "gravy granules"], [/\bflora\b/ig, "margarine"]
];
const FAT_ADJ = /\b(?:extra light|semi[- ]skimmed|reduced[- ]fat|low[- ]fat|half[- ]fat|full[- ]fat|fat[- ]free|skimmed|light|lite)\b/ig;

/* Ingredients so implicit they aren't worth flagging as missing. */
const IMPLICIT = ["salt","pepper","black pepper","salt and pepper","water","oil","olive oil","ice"];

function escRe(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function fmtQ(n){ return (Math.round(n*100)/100).toString().replace(/\.0+$/,""); }

const QTY_RE = new RegExp("^(?:"
  + "(\\d+(?:[.,]\\d+)?)\\s*(?:[-–—]|\\s+to\\s+)\\s*(\\d+(?:[.,]\\d+)?)"      // 2-3
  + "|(\\d+)\\s+(\\d+)\\/(\\d+)"                                              // 1 1/2
  + "|(\\d+)\\/(\\d+)"                                                        // 3/4
  + "|(\\d+(?:[.,]\\d+)?)\\s*([" + FRACSET + "])"                             // 1½
  + "|([" + FRACSET + "])"                                                    // ½
  + "|(\\d+(?:[.,]\\d+)?)"                                                    // 200
  + ")");

function takeQty(s){
  const t = String(s).trim();
  const m = t.match(QTY_RE);
  if(!m){
    const a = t.match(/^(?:a|an)\s+/i);                 // "a handful of parsley"
    if(a){
      const rest = t.slice(a[0].length);
      const w = (rest.split(/\s+/)[0]||"").toLowerCase().replace(/[^a-z]/g,"");
      if(UNIT_WORDS[w]) return {qty:1, rest, note:""};
    }
    return {qty:null, rest:t, note:""};
  }
  const N = x => Number(String(x).replace(",", "."));
  let qty, note = "";
  if(m[1] != null && m[2] != null){ qty = N(m[2]); note = "range"; }
  else if(m[3] != null) qty = N(m[3]) + N(m[4]) / N(m[5]);
  else if(m[6] != null) qty = N(m[6]) / N(m[7]);
  else if(m[8] != null) qty = N(m[8]) + FRACS[m[9]];
  else if(m[10] != null) qty = FRACS[m[10]];
  else qty = N(m[11]);
  return {qty: Math.round(qty*1000)/1000, rest: t.slice(m[0].length).trim(), note};
}

function takeUnit(rest){
  const words = String(rest).trim().split(/\s+/);
  const w0 = (words[0]||"").toLowerCase().replace(/[^a-z]/g,"");
  const w1 = (words[1]||"").toLowerCase().replace(/[^a-z]/g,"");
  if(w0 === "fl" && w1 === "oz") return {unit:"ml", mult:28.4, rest:words.slice(2).join(" "), note:"fl oz converted to ml"};
  if(UNIT_WORDS[w0]) return {unit:UNIT_WORDS[w0], mult:1, rest:words.slice(1).join(" "), note:""};
  if(UNIT_CONVERT[w0]){ const c = UNIT_CONVERT[w0]; return {unit:c[1], mult:c[0], rest:words.slice(1).join(" "), note:w0+" converted to "+c[1]}; }
  return {unit:"", mult:1, rest:String(rest).trim(), note:""};
}

function cleanItem(s){
  let t = String(s).trim();
  const optional = /\(\s*optional\s*\)|,\s*optional\b|\bif using\b/i.test(t);
  t = t.replace(/\(\s*optional\s*\)/ig, " ").replace(/,\s*optional\b/ig, " ");
  t = t.replace(/\([^)]*\)/g, " ");                 // parenthetical asides
  t = t.split(/,\s*/)[0];                           // drop ", finely chopped"
  t = t.replace(/\s+/g, " ").replace(/[.;:]+$/, "").trim();
  t = t.replace(/^(?:of|the)\s+/i, "");
  t = t.replace(/\s+(?:to serve|to taste|to garnish|for (?:the )?(?:frying|drizzling|greasing))$/i, "");
  return {item:t.trim(), optional};
}

function deBrand(item){
  let t = item, changed = false;
  BRANDS.forEach(b=>{ if(b[0].test(t)){ t = t.replace(b[0], b[1]); changed = true; } });
  if(!changed) return {item:item, changed:false};
  const adjs = [];
  t = t.replace(FAT_ADJ, m=>{ adjs.push(m.toLowerCase()); return " "; });
  t = (adjs.join(" ") + " " + t).replace(/\s+/g, " ").trim();
  return {item:t, changed:true};
}

/* The recipe book you already have is the best aisle reference there is,
   so it gets asked first. */
function aisleBook(){
  const exact = {}, words = {};
  recipes().forEach(r=>(r.doc.ingredients||[]).forEach(i=>{
    if(!i.item || !i.aisle) return;
    const n = normItem(i.item);
    exact[n] = i.aisle;
    n.split(" ").forEach(w=>{
      if(w.length < 3) return;
      words[w] = words[w] || {};
      words[w][i.aisle] = (words[w][i.aisle]||0) + 1;
    });
  }));
  return {exact, words};
}
let AISLE_HINTS = null;
function aisleHints(){
  if(!AISLE_HINTS){ AISLE_HINTS = {}; Object.keys(AISLE_HINTS_RAW).forEach(k=>{ AISLE_HINTS[normItem(k)] = AISLE_HINTS_RAW[k]; }); }
  return AISLE_HINTS;
}
function guessAisle(item, bk){
  const n = normItem(item);
  if(bk.exact[n]) return bk.exact[n];
  const H = aisleHints();
  let best = null, bestLen = 0;
  Object.keys(H).forEach(k=>{
    if(k.length <= bestLen) return;
    if(new RegExp("(^|\\s)" + escRe(k) + "($|\\s)").test(n)){ best = H[k]; bestLen = k.length; }
  });
  if(best) return best;
  const tally = {};
  n.split(" ").forEach(w=>{ const t = bk.words[w]; if(t) Object.keys(t).forEach(a=>{ tally[a] = (tally[a]||0) + t[a]; }); });
  const win = Object.keys(tally).sort((a,b)=>tally[b]-tally[a])[0];
  return win || null;
}

/* --- section headings --------------------------------------- */
const SEC_RE = [
  [/^ingredients?\b/i, "ing"],
  [/^(?:method|instructions?|directions?|steps?|preparation|how to (?:make|cook)|to (?:make|cook))\b/i, "step"],
  [/^(?:chef'?s?\s+)?(?:tips?|notes?|hints?)\b/i, "tips"],
  [/^(?:equipment|kit|you(?:'ll| will) need)\b/i, "equip"],
  [/^storage\b/i, "storage"],
  [/^serve\s*with\b/i, "servewith"],
  [/^nutrition/i, "nutr"]
];
function headingOf(l){
  const t = l.replace(/[:：]\s*$/, "").trim();
  if(!t || t.length > 46) return null;
  for(let i=0;i<SEC_RE.length;i++) if(SEC_RE[i][0].test(t)) return SEC_RE[i][1];
  return null;
}
function readMeta(l, doc, found){
  if(l.length > 70) return false;
  let hit = 0, m;
  if((m = l.match(/^(?:serves|servings?|makes|feeds)\s*:?\s*(\d+)/i)) || (m = l.match(/^(\d+)\s+servings?\b/i))){
    doc.servings = Number(m[1]); found.servings = true; hit++;
  }
  if((m = l.match(/prep(?:aration)?(?:\s*time)?\s*:?\s*(?:about\s*)?(\d+)/i))){ doc.prep = Number(m[1]); found.time = true; hit++; }
  if((m = l.match(/cook(?:ing)?(?:\s*time)?\s*:?\s*(?:about\s*)?(\d+)/i))){ doc.cook = Number(m[1]); found.time = true; hit++; }
  if((m = l.match(/(?:total(?:\s*time)?|ready in)\s*:?\s*(?:about\s*)?(\d+)/i))){ doc.time = Number(m[1]); found.time = true; hit++; }
  return hit > 0;
}

const VERB_RE = /^(?:heat|preheat|put|place|add|stir|mix|cook|fry|boil|simmer|bake|roast|drain|season|pour|cut|chop|slice|dice|peel|melt|whisk|serve|remove|return|bring|reduce|cover|leave|rest|toss|combine|spread|scatter|sprinkle|transfer|tip|set|take|turn|lift|grate|crush|mince|warm|garnish|divide|check|taste|finish|meanwhile|while|once|when|first|next|then)\b/i;
function looksIngredient(l){
  const t = l.replace(/^[-•*–—]\s*/, "");
  if(QTY_RE.test(t) && t.split(/\s+/).length <= 8) return true;
  return t.split(/\s+/).length <= 4 && !/[.!?]$/.test(t);
}
function looksStep(l){
  const t = l.replace(/^\s*(?:step\s*)?\d+\s*[.):-]\s*/i, "").replace(/^[-•*–—]\s*/, "");
  if(QTY_RE.test(t) && t.split(/\s+/).length <= 6) return false;
  if(t.split(/\s+/).length >= 8) return true;
  return VERB_RE.test(t);
}
function stripListNumbers(ls){
  const nums = ls.map(l=>{ const m = l.match(/^\s*(\d+)\s*[.)]\s+/); return m ? Number(m[1]) : null; });
  const sequential = ls.length >= 3 && nums.every((n,i)=> n === i+1);
  return sequential ? ls.map(l=>l.replace(/^\s*\d+\s*[.)]\s+/, "")) : ls;
}
function stripStepNum(l){
  return l.replace(/^\s*step\s*\d+\s*[.):-]?\s*/i, "").replace(/^\s*\d+\s*[.)]\s+/, "").replace(/^[-•*–—]\s*/, "").trim();
}

/* A step's timer, read out of its own words. */
function timerFrom(text){
  const re = /(\d+(?:\.\d+)?)\s*(?:[-–—]\s*(\d+(?:\.\d+)?)\s*)?(mins?|minutes?|hrs?|hours?|secs?|seconds?)\b/ig;
  let m;
  while((m = re.exec(text))){
    const after = text.slice(m.index + m[0].length, m.index + m[0].length + 14).toLowerCase();
    if(/^\s*(?:before|earlier|ahead)/.test(after)) continue;        // "5 minutes before the end"
    const before = text.slice(Math.max(0, m.index - 16), m.index).toLowerCase();
    if(/(?:every|each)\s*$/.test(before)) continue;                 // "stir every 2 minutes"
    let v = m[2] != null ? Math.min(Number(m[1]), Number(m[2])) : Number(m[1]);
    const u = m[3].toLowerCase();
    if(u.charAt(0) === "h") v *= 60;
    else if(u.charAt(0) === "s") v /= 60;
    v = v < 1 ? 1 : Math.round(v);
    if(v > 0 && v <= 600) return v;
  }
  return "";
}

const FAMILY = { g:["g",1], kg:["g",1000], ml:["ml",1], l:["ml",1000], tsp:["tsp",1], tbsp:["tsp",3] };
function mergeIngredients(list, notes){
  const out = [], idx = {};
  list.forEach(i=>{
    const fam = FAMILY[i.unit] ? FAMILY[i.unit][0] : (i.unit || "#");
    const key = normItem(i.item) + "|" + fam;
    if(idx[key] == null){ idx[key] = out.length; out.push(Object.assign({}, i)); return; }
    const t = out[idx[key]];
    if(t.qty == null || i.qty == null) return;
    const tf = FAMILY[t.unit], af = FAMILY[i.unit];
    if(tf && af){ t.qty = Math.round((t.qty*tf[1] + i.qty*af[1])*100)/100; t.unit = tf[0]; }
    else t.qty = Math.round((t.qty + i.qty)*100)/100;
    notes.push({msg:"“"+t.item+"” was listed more than once, so I added them up: "+fmtQ(t.qty)+(t.unit?" "+t.unit:"")+"."});
  });
  return out;
}

/* Things the method asks for that never made it onto the list.
   The vocabulary comes from your own recipe book, so it only ever
   suggests food you actually cook with. */
function missingFromMethod(steps, ings, notes){
  const listed = ings.map(i=>normItem(i.item));
  const haveWord = {};
  listed.forEach(n=>n.split(" ").forEach(w=>{ haveWord[w] = true; }));
  const text = " " + steps.map(s=>s.text).join(" ").toLowerCase().replace(/[^a-z0-9\s-]/g," ").replace(/\s+/g," ") + " ";
  const vocab = {};
  recipes().forEach(r=>(r.doc.ingredients||[]).forEach(i=>{ if(i.item) vocab[normItem(i.item)] = i.item; }));
  const out = [];
  Object.keys(vocab).forEach(n=>{
    if(out.length >= 5) return;
    if(n.length < 4) return;
    if(IMPLICIT.indexOf(n) > -1) return;
    if(listed.indexOf(n) > -1) return;
    if(n.split(" ").every(w=>haveWord[w])) return;          // already covered, e.g. "chicken" vs "chicken breast"
    if(!new RegExp("(^|\\s)" + escRe(n) + "(s|es|e)?(\\s|$)").test(text)) return;
    out.push(vocab[n]);
  });
  return out;
}

/* Some people write the amount after the name — "Chicken breast 350g",
   "Olive oil - 2 tsp". Only accepted when the tail is a unit we know,
   so "2 large" or "x2" is left well alone. */
function takeTrailingQty(l){
  const m = l.match(/^(.+?)[\s,:–—-]*[\s(]\s*(\d+(?:[.,]\d+)?(?:\s*[-–]\s*\d+(?:[.,]\d+)?)?|[½¼¾⅓⅔⅕⅙⅛⅜⅝⅞])\s*([a-zA-Z]{1,12})?\s*\)?\s*$/);
  if(!m) return null;
  const w = (m[3]||"").toLowerCase();
  if(m[3] && !UNIT_WORDS[w] && !UNIT_CONVERT[w]) return null;
  const q = takeQty(m[2] + (m[3] ? " " + m[3] : ""));
  if(q.qty == null) return null;
  const u = takeUnit(q.rest);
  const name = m[1].replace(/[\s,:–—-]+$/, "").trim();
  if(!name) return null;
  return {qty: u.mult !== 1 ? Math.round(q.qty * u.mult) : q.qty, unit:u.unit, rest:name, note:q.note};
}

function parseIngredientLine(line, bk, notes){
  let l = line.replace(/^[-•*–—]\s*/, "").trim();
  if(!l || /^(?:for the\b|to serve\b|to garnish\b)/i.test(l)) return null;
  if(/^(?:salt\s*(?:and|&|,)\s*(?:freshly ground\s*)?(?:black\s*)?pepper|seasoning)\b/i.test(l))
    return {qty:null, unit:"", item:"salt and pepper", aisle:"Herbs & Spices"};

  let q = takeQty(l);
  let trailing = false;
  if(q.qty == null){                                   // "Chicken breast 350g"
    const t = takeTrailingQty(l);
    if(t){ q = t; trailing = true; }
  }
  let qty = q.qty, rest = q.rest;
  if(q.note === "range") notes.push({msg:"“"+l+"” gave a range, so I took the larger amount ("+fmtQ(qty)+")."});

  const xm = rest.match(/^[x×]\s*/i);                        // "2 x 400g tins chopped tomatoes"
  if(qty != null && xm){
    const q2 = takeQty(rest.slice(xm[0].length));
    if(q2.qty != null){ qty = qty * q2.qty; rest = q2.rest; }
  }
  const u = trailing ? {unit:q.unit, mult:1, rest, note:""} : takeUnit(rest);
  const unit = u.unit;
  rest = u.rest;
  if(u.mult !== 1 && qty != null) qty = Math.round(qty * u.mult);
  if(u.note) notes.push({msg:"“"+l+"”: "+u.note+"."});

  rest = rest.replace(/^(?:of|the)\s+/i, "");
  const c = cleanItem(rest);
  if(!c.item) return null;

  const b = deBrand(c.item);
  if(b.changed) notes.push({msg:"Recorded “"+c.item+"” as “"+b.item+"” so it merges on the shopping list with your other recipes."});

  const item = b.item;
  const aisle = guessAisle(item, bk);
  if(!aisle) notes.push({msg:"I couldn't place “"+item+"” on an aisle, so it's under Other — set it and the shopping list will group it properly."});
  return {qty: qty == null ? null : Math.round(qty*100)/100, unit, item, aisle: aisle || "Other"};
}

function parseRecipeText(raw){
  const notes = [], found = {};
  const doc = { name:"", servings:2, prep:0, cook:0, time:0, batch:false, tags:[],
                ingredients:[], steps:[], equipment:[], tips:[], serveWith:[],
                freezer:{ok:false,note:""}, storage:{fridge:"",freezer:""},
                nutrition:{kcal:"",protein:"",carbs:"",fat:"",fibre:"",note:""} };

  const bucket = { ing:[], step:[], tips:[], equip:[], storage:[], servewith:[], nutr:[] };
  const pre = [];
  let sec = null, sawHeading = false;

  String(raw).replace(/\r/g, "").split("\n").forEach(rawLine=>{
    let l = rawLine.trim().replace(/^#+\s*/, "").replace(/^\*\*\s*|\s*\*\*$/g, "").replace(/^__\s*|\s*__$/g, "").trim();
    if(!l) return;
    const head = headingOf(l);
    if(head){ sec = head; sawHeading = true; return; }
    if(/^for the\b/i.test(l) && l.length < 44) return;              // "For the sauce:"
    if(sec !== "step" && sec !== "tips" && readMeta(l, doc, found)) return;
    (sec ? bucket[sec] : pre).push(l);
  });

  let title = "";
  if(!sawHeading){
    const a = pre.slice();
    if(a.length && !QTY_RE.test(a[0]) && !/^[-•*–—]/.test(a[0]) && a[0].split(/\s+/).length <= 10 && !/[.!?]$/.test(a[0])) title = a.shift();
    let cut = a.findIndex(looksStep);
    if(cut < 0) cut = a.length;
    bucket.ing = a.slice(0, cut);
    bucket.step = a.slice(cut);
    if(bucket.ing.length && bucket.step.length)
      notes.push({msg:"There were no Ingredients or Method headings, so I worked out where the list ended and the method began. Worth a look."});
  }else{
    if(pre.length && !QTY_RE.test(pre[0]) && !/^[-•*–—]/.test(pre[0])) title = pre.shift();
    if(!bucket.ing.length && pre.length){ bucket.ing = pre.slice(); pre.length = 0; }
    if(pre.length) notes.push({msg:"Skipped "+pre.length+" "+plural(pre.length,"line")+" above the first heading."});
  }
  doc.name = title.replace(/[.:]+$/, "").trim();

  /* ingredients */
  const bk = aisleBook();
  const rawIngs = [];
  stripListNumbers(bucket.ing).forEach(l=>{
    const p = parseIngredientLine(l, bk, notes);
    if(p) rawIngs.push(p);
  });
  doc.ingredients = mergeIngredients(rawIngs, notes);

  /* method */
  let stepLines = stripListNumbers(bucket.step);
  if(stepLines.length && stepLines.length <= 2){
    const joined = stepLines.join(" ");
    const split = joined.replace(/([.!?])\s+(?=[A-Z“"(])/g, "$1\n").split("\n").map(s=>s.trim()).filter(Boolean);
    const merged = [];
    split.forEach(s=>{ if(merged.length && s.length < 22) merged[merged.length-1] += " " + s; else merged.push(s); });
    if(merged.length > 2){
      stepLines = merged;
      notes.push({msg:"Your method was one block of text, so I split it into steps at each sentence. Join or split any that read oddly."});
    }
  }
  doc.steps = stepLines.map(l=>{ const text = stripStepNum(l); return {text, mins: timerFrom(text)}; }).filter(s=>s.text);

  /* the extras */
  const clean = ls => ls.map(l=>l.replace(/^[-•*–—]\s*/, "").replace(/^\s*\d+\s*[.)]\s+/, "").trim()).filter(Boolean);
  doc.tips = clean(bucket.tips);
  doc.equipment = clean(bucket.equip);
  doc.serveWith = clean(bucket.servewith);
  clean(bucket.storage).forEach(l=>{
    const m = l.match(/^(fridge|freezer|frozen)\s*:?\s*(.+)$/i);
    if(m) doc.storage[/^fr(?:eezer|ozen)$/i.test(m[1]) ? "freezer" : "fridge"] = m[2].trim();
    else if(!doc.storage.fridge) doc.storage.fridge = l;
  });
  if(doc.storage.freezer) doc.freezer.ok = true;

  /* timings */
  const timerSum = doc.steps.reduce((a,s)=>a + (Number(s.mins)||0), 0);
  if(!doc.time) doc.time = (doc.prep + doc.cook) || Math.max(15, Math.round(timerSum)) || 30;
  if(!doc.prep && !doc.cook) doc.cook = doc.time;
  if(!doc.servings) doc.servings = 2;

  /* things worth your eyes */
  const timed = doc.steps.filter(s=>s.mins).length;
  if(doc.steps.length && !timed) notes.push({msg:"No step said how long it takes, so there are no cook-along timers yet. Add minutes to any step that needs one."});
  const miss = missingFromMethod(doc.steps, doc.ingredients, notes);
  miss.forEach(m=>notes.push({
    msg:"The method mentions "+m+" but it isn't in the ingredients.",
    add:{qty:null, unit:"", item:m, aisle: guessAisle(m, bk) || "Other"}
  }));
  if(doc.servings >= 5) notes.push({msg:"Serves "+doc.servings+" — tick “Good for batch cooking” if you want it offered as a batch cook."});
  if(!doc.name) notes.push({msg:"I couldn't spot a title. Give it a name before saving."});
  if(!doc.ingredients.length) notes.push({msg:"I found no ingredients at all. Try pasting again with an “Ingredients” heading above the list."});
  if(!doc.steps.length) notes.push({msg:"I found no method. Try pasting again with a “Method” heading above the steps."});

  return {doc, notes, found};
}

/* --- the paste box ------------------------------------------ */
let pasteInto = null;
function openPaste(id){
  pasteInto = id || null;
  const r = id ? recipeById(id) : null;
  const h = '<div class="note" style="margin-bottom:14px">'
    + (r ? 'Paste a fresh ingredients list and method for <b>' + esc(r.doc.name) + '</b>. The name, tags and nutrition you already have are kept.'
         : 'Paste a whole recipe — title, ingredients, method, and any tips or timings. It works out the quantities, aisles and cook-along timers, then shows you what it found. Nothing is saved until you say so.')
    + '</div>'
    + '<textarea id="pastebox" rows="14" placeholder="Paste the recipe here…" style="font-size:15px"></textarea>'
    + '<div class="row" style="margin-top:14px"><button class="btn primary" data-act="dopaste">Read it</button>'
    + '<button class="btn ghost" data-close>Cancel</button></div>'
    + '<p class="tiny muted" style="margin-top:12px">Headings like Ingredients, Method, Tips, Equipment and Serves help, but it copes without them.</p>';
  sheet(r ? "Paste over this recipe" : "Paste a recipe", h);
  setTimeout(()=>{ const b = document.getElementById("pastebox"); if(b) b.focus(); }, 80);
}
function doPaste(){
  const box = document.getElementById("pastebox");
  const txt = box ? box.value : "";
  if(!txt.trim()){ toast("Nothing pasted yet"); return; }
  const res = parseRecipeText(txt);
  if(!res.doc.ingredients.length && !res.doc.steps.length){
    toast("I couldn't find a recipe in that"); return;
  }
  const d = res.doc;
  if(pasteInto){
    const base = recipeById(pasteInto);
    if(base){
      const b = JSON.parse(JSON.stringify(base.doc));
      if(!d.name) d.name = b.name;
      d.tags = b.tags || [];
      d.batch = b.batch; d.freezer = b.freezer;
      d.nutrition = b.nutrition;
      if(!res.found.servings) d.servings = b.servings;
      if(!res.found.time){ d.prep = b.prep; d.cook = b.cook; d.time = b.time; }
      if(!d.equipment.length) d.equipment = b.equipment || [];
      if(!d.tips.length) d.tips = b.tips || [];
      if(!d.serveWith.length) d.serveWith = b.serveWith || [];
      res.notes.unshift({msg:"Replacing the ingredients and method only — the name, tags and nutrition are untouched."});
    }
  }
  draft = d;
  draftId = pasteInto;
  parseNotes = res.notes;
  drawEditor();
  toast(d.ingredients.length + " " + plural(d.ingredients.length,"ingredient") + ", " + d.steps.length + " steps");
}

const SQL = `create table if not exists public.items (
  id         text primary key,
  household  text not null,
  kind       text not null,
  doc        jsonb not null default '{}'::jsonb,
  deleted    boolean not null default false,
  updated_at timestamptz not null default now()
);
create index if not exists items_hh_upd on public.items (household, updated_at);

create or replace function public.touch_items() returns trigger as $$
begin new.updated_at = now(); return new; end;
$$ language plpgsql;

drop trigger if exists items_touch on public.items;
create trigger items_touch before insert or update on public.items
  for each row execute function public.touch_items();

alter table public.items enable row level security;
drop policy if exists items_read   on public.items;
drop policy if exists items_write  on public.items;
drop policy if exists items_modify on public.items;
create policy items_read   on public.items for select to anon using (true);
create policy items_write  on public.items for insert to anon with check (true);
create policy items_modify on public.items for update to anon using (true) with check (true);
grant select, insert, update on public.items to anon;`;

let wcIndex = 0;
function openWelcome(){
  wcIndex = 0;
  const el = document.createElement("div");
  el.className = "wcwrap"; el.id = "wcwrap";
  document.body.appendChild(el);
  drawWelcome();
  let x0 = null;
  el.addEventListener("touchstart", e=>{ x0 = e.changedTouches[0].clientX; }, {passive:true});
  el.addEventListener("touchend", e=>{
    if(x0===null) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if(dx < -45) stepWelcome(1);
    else if(dx > 45) stepWelcome(-1);
  }, {passive:true});
}
function drawWelcome(){
  const el = document.getElementById("wcwrap"); if(!el) return;
  const c = CARDS[wcIndex], last = wcIndex === CARDS.length - 1;
  el.innerHTML = '<div class="wc">'
    + '<div class="card-body"><div class="art">'+c.art+'</div><h2>'+c.h+'</h2>'
    + c.p.map((t,i)=>'<p'+(i?' class="sub"':'')+'>'+t+'</p>').join("")
    + '</div><div class="wcfoot">'
    + '<button class="btn ghost" data-wc="'+(wcIndex?"back":"skip")+'">'+(wcIndex?"Back":"Skip")+'</button>'
    + '<span class="dots">'+CARDS.map((_,i)=>'<i class="'+(i===wcIndex?"on":"")+'"></i>').join("")+'</span>'
    + '<button class="btn primary" data-wc="next">'+(last?"Start planning":"Next")+'</button>'
    + '</div></div>';
  el.querySelectorAll("[data-wc]").forEach(b=>b.addEventListener("click", ()=>{
    const a = b.dataset.wc;
    if(a==="skip") closeWelcome();
    else if(a==="back") stepWelcome(-1);
    else stepWelcome(1);
  }));
}
function stepWelcome(d){
  if(wcIndex + d < 0) return;
  if(wcIndex + d >= CARDS.length){ closeWelcome(); return; }
  wcIndex += d; drawWelcome();
}
function closeWelcome(){
  const el = document.getElementById("wcwrap"); if(el) el.remove();
  lsSet(SEEN_KEY, "1");
}

/* ---------- how it works ---------- */
function openHelp(){
  const led = c => '<span class="led" style="background:'+c+'"></span>';
  const h = `
  <div class="helpsec">
    <h3>The three tabs</h3>
    <p><b>Plan</b> is the week. <b>Recipes</b> is your cookbook. <b>Shopping</b> is the list for whichever week you're looking at — it isn't a separate list you maintain, it's simply what the week's meals add up to.</p>
    <p class="q">The week arrows at the top of Plan and Shopping are linked, so changing the week on one changes it on the other.</p>
  </div>

  <div class="helpsec">
    <h3>Planning a week</h3>
    <p>Weeks run <b>Sunday to Saturday</b>, so the plan, the shopping list and the spend tracking all line up with the local week.</p>
    <p>Tap <b>+ Add</b> on any lunch or dinner slot and pick a recipe. Before you pick, set <b>Servings</b> — that number drives everything downstream, so if you're batch cooking a chilli for six, say six and the shopping list buys for six.</p>
    <p>You can put more than one thing in a slot, which is handy for a main plus a side. Tap a meal's name to see the recipe, or the <b>×</b> to remove it.</p>
    <p><b>Copy last week</b> lifts the whole of the previous week across, which is the quickest way to run a rolling roster — copy, then swap out the two or three things you're bored of.</p>
  </div>

  <div class="helpsec">
    <h3>Cooking along</h3>
    <p>Open a recipe and tap <b>Start cooking</b>. You get one step at a time in large type, with <b>Back</b> and <b>Next</b>, and the screen is held awake for the whole session so it doesn't go dark with your hands covered in flour.</p>
    <p>Under each step you'll see orange pills with the amounts it needs — "100g cherry tomatoes" — so you're not scrolling back to the ingredients mid-cook. They're worked out from the recipe, and skipped where the step already spells the amount out itself.</p>
    <p>The <b>&#9776;</b> button at the top opens the whole recipe, ingredients and every step, with where you are highlighted. Timers carry on running while you read, and the button at the bottom drops you back on exactly the step you left.</p>
    <p>Where a step has a time on it, there's a <b>Start timer</b> button. The important bit: once started, a timer <b>keeps running while you move on</b>. Put the potatoes in, tap Next, and carry on prepping — the countdown sits in a chip along the top and you can have several going at once. <b>+1 min</b> extends one, <b>Stop</b> cancels it.</p>
    <p>It stays quiet while you work. When a timer finishes you get a chime and a green banner, and it speaks. If you're standing at that pan it tells you <b>what to do next</b> — "Next. Turn and cook the second side." If it's something you left running while you moved on, the next step in the list has nothing to do with it, so it names the timer instead — "Your 48 minute timer has finished" — and offers a <b>Go there</b> button if you want to jump to it. Either way it won't move you on by itself; tap <b>Got it</b> and carry on where you were.</p>
    <p class="q">One limitation worth knowing: this only works with the app open and the screen on. A web app can't wake itself up, so if you lock the phone or switch apps the timers stop. Prop it up somewhere in the kitchen, ideally on a charger. If you close it by accident, reopening within the timer's lifetime picks the session straight back up.</p>
  </div>

  <div class="helpsec">
    <h3>Batch cooking and the freezer</h3>
    <p>Each day has a third slot, <b>Batch cook</b>, which only appears once you've put something in it — otherwise there's a faint <i>+ Batch cook</i> link at the bottom of the day. Use it for the big weekend cooks, and set servings to the <b>whole batch</b>, including the portions destined for the freezer. That way the shopping list buys enough.</p>
    <p>When you eat one of those portions weeks later, add the meal as normal but tick <b>❄ From the freezer</b> in the picker. It shows on the plan with a snowflake and contributes <b>nothing</b> to that week's shopping list, because you already bought it.</p>
  </div>

  <div class="helpsec">
    <h3>Your three-week rotation</h3>
    <p>Gear → <b>Meal rotation</b> shows the three-week cycle the app was set up with, and lets you lay it out again from this week or the next. It fills six weeks at a time, which is two full cycles.</p>
    <p>Nothing runs automatically after that first fill, so any week you change stays changed. When you get near the end, open the rotation and refill — it writes over the weeks ahead, so do it from a week you haven't customised.</p>
  </div>

  <div class="helpsec">
    <h3>How the shopping list is worked out</h3>
    <p>Every ingredient of every meal that week is scaled by servings, then identical ingredients are merged into one line. A recipe serving four, planned for two, contributes half of everything.</p>
    <p>Units are converted before merging, so a tablespoon in one recipe and a teaspoon in another add up properly, and grams roll into kilograms once they pass a thousand. Anything you can only buy whole — tins, packs, avocados — rounds up, because half a tin isn't a thing.</p>
    <p>Under each line it says which meals it's for. That's how you tell whether the 8 cloves of garlic are worth buying two bulbs for.</p>
    <p>Tap the circle to tick something off and it <b>drops out of the list</b>, so what's left on screen is what you've still got to find. The counter at the top keeps score. <b>Show all</b> brings the ticked ones back into view, struck through and in their proper places, for when you want to check whether something was on the list at all; <b>Hide picked up</b> puts them away again. Unticking anything returns it to the list. The app remembers which way you like it, and it's per phone — you can be hiding while she isn't.</p>
    <p>Tap the small <b>×</b> to remove a line entirely — that's for things you've already got in. <b>Reset ticks</b> puts everything back, and <b>Copy as text</b> gives you the whole list, ticked items included, to paste into a message.</p>
    <p><b>Buying more than the recipes need.</b> Tap the <u>quantity</u> on any line and you can set what you actually want to buy — an extra bag of carrots for snacking, say. The line then reads in orange and shows the split, like "1 for meals · +3 added". Grams and millilitres step in fifties, everything else one at a time, and you can type an exact number instead. <b>Back to recipe amount</b> undoes it. Adjustments belong to that week only, so they don't follow you around.</p>
    <p class="q">Lines with no quantity, like fresh herbs, show a <b>+</b> instead — tap it to give them one.</p>
    <p class="q">Ticks are per week, so last week's shopping doesn't affect this week's.</p>
  </div>

  <div class="helpsec">
    <h3>Adding and editing recipes</h3>
    <p>Open any recipe and there's an <b>Edit</b> button at the top, next to Close. There are also Edit links beside the <b>Ingredients</b> and <b>Method</b> headings, which open the editor already scrolled to that part. <b>+ New</b> on the Recipes tab creates one from scratch.</p>
    <p>In the editor, every ingredient and every step is its own row. <b>+ Ingredient</b> and <b>+ Step</b> add more; the <b>×</b> at the end of a row removes it. Change these freely — they're your recipes now, and edits reach the other phone within seconds.</p>
    <p>For each ingredient give a quantity, a unit and an aisle. The aisle is what groups your shopping list, so getting it roughly right is worth the two seconds. Leave the unit blank for things you count, like onions.</p>
    <p>Each method step can have a number of minutes beside it. That's what becomes a timer in the cook-along, so it's worth filling in on any step where you'd otherwise be watching the clock.</p>
    <p class="q">Deleting a recipe also removes any planned meals using it, so check the week first.</p>
  </div>

  <div class="helpsec">
    <h3>Pasting a recipe in</h3>
    <p>Typing a recipe in row by row is slow. <b>📋 Paste a recipe</b> on the Recipes tab takes the whole thing as plain text — title, ingredients, method, and any tips, equipment, serves or timings — and turns it into a proper recipe in one go.</p>
    <p>It works out the quantity, unit and aisle for each ingredient, and reads the timers straight out of the method, so "fry for 6 minutes" becomes a 6 minute timer in the cook-along. Headings like <i>Ingredients</i> and <i>Method</i> help it, but it copes without them.</p>
    <p>It's guessing, so <b>nothing is saved until you've looked</b>. You land in the normal editor with everything filled in and a panel at the top listing what it wasn't sure about — a range it had to choose from, a brand name it renamed, an ingredient your method uses but never listed. Where it can fix something itself there's an <b>Add it</b> button; the <b>×</b> dismisses a note you're happy with. Then Save as usual.</p>
    <p>Two things it does deliberately. It <b>adds up duplicates</b>, so a recipe asking for a teaspoon of oil in three separate sections becomes one line of three. And it <b>renames brands</b> to what the thing actually is — "Philadelphia Light" is stored as "light cream cheese" — so it merges on the shopping list with everything else that wants the same tub. Both get flagged so you can see what it did.</p>
    <p><b>Paste over</b>, inside a recipe next to Edit, does the same thing but replaces that recipe's ingredients and method. The name, tags and nutrition you've already got are kept. It's the quick way to update a method you've since improved.</p>
    <p class="q">It won't invent nutrition, and it won't add an ingredient to your list on its own — anything it isn't sure about is a note for you to accept or ignore.</p>
  </div>

  <div class="helpsec">
    <h3>The coloured dot</h3>
    <div class="dotkey"><b>${led('#2f6f4e')}Synced</b><span>Everything's in step. Changes reach the other phone within about ten seconds.</span></div>
    <div class="dotkey"><b>${led('#a16207')}Offline</b><span>No signal. Carry on using it — the number beside it counts what's waiting, and it all sends when you're back.</span></div>
    <div class="dotkey"><b>${led('#b3261e')}Sync issue</b><span>Something's actually wrong. Tap the dot to see the error and the connection settings.</span></div>
    <div class="dotkey"><b>${led('#7c6f64')}Local only</b><span>Not sharing at all — this device is on its own. Usually means an invite link hasn't been applied yet.</span></div>
    <p style="margin-top:10px">If you both change different things at once, both changes survive — one of you adding Thursday's dinner while the other ticks off milk never collide. If you both edit the same recipe within a few seconds, the later save wins.</p>
  </div>

  <div class="helpsec">
    <h3>On your phone</h3>
    <p>Add it to your home screen so it opens like an app: on iPhone tap <b>Share</b> then <b>Add to Home Screen</b>; on Android use the browser menu and <b>Install app</b>.</p>
    <p><b>The iPhone catch.</b> A home-screen app gets storage separate from Safari, so the first time you open it that way it may say <i>Local only</i>. Copy the invite link — press and hold it, don't tap it — then here in the app go to <b>Sharing &amp; sync</b> and paste it into the box at the top. Once only.</p>
  </div>

  <div class="helpsec">
    <h3>Tracking what you spend</h3>
    <p>The <b>Spend</b> tab keeps a note of what the shopping actually costs. After a shop, tap <b>Add what you spent</b>, put in the receipt total and optionally which shop. You can add more than one for a week — a big shop and a top-up later on both count towards that week.</p>
    <p><b>Nipping to the shops.</b> The <b>Quick add</b> row at the top is for the three-things-on-the-way-home trip: pick the shop from the list, type the amount, tap Add. The shop stays selected, so a second trip is two taps.</p>
    <p><b>Which week a shop is for.</b> Both the quick add and the full receipt form have a <b>This week / Next week</b> choice with the dates on it. Because you shop for the week ahead at the weekend, it opens on <b>next week</b> if it's Friday or Saturday, and on this week the rest of the time. It's always shown, so it's never guessing behind your back, and the arrows underneath the full form reach any other week.</p>
    <p><b>Weekly or monthly.</b> The buttons above the chart switch between the two. A week belongs to whichever month its first day falls in, so a week straddling the end of a month is counted once, in one place, rather than split in half.</p>
    <p>You get this week's or this month's figure, the matching average, and a bar for each. Tap a bar to see that one. A week you didn't record shows as a gap rather than a zero, and the average only counts what you actually entered, so a missed week doesn't flatter the number.</p>
    <p><b>The breakdown is optional.</b> Inside the receipt form there's a section you can open to split the total by aisle — Produce, Meat &amp; Fish and so on, straight off the receipt. Fill in as much or as little as you like; whatever's left over is shown as "unassigned" rather than quietly absorbed. Most weeks the total on its own is plenty.</p>
    <p><b>Currencies.</b> Each receipt records what it was actually rung up in — <b>QAR</b> or <b>GBP</b> — with a toggle at the top of the form. The Spend tab reports everything in one currency, QAR unless you change it under gear → <b>Currency</b>. Anything paid in the other one is converted at a rate <b>you set</b>, so it never changes behind your back or depends on the network. When something has been converted the app says so, and the week's detail still shows what you actually handed over.</p>
    <p class="q">Spending syncs between you like everything else, so whoever does the shop can put it in.</p>
  </div>

  <div class="helpsec">
    <h3>Settings and backups</h3>
    <p><b>Default servings</b> sets what a new meal starts at, so you're not changing it every time.</p>
    <p><b>Export backup</b> saves everything to a file. Worth doing occasionally once you've typed in recipes you'd hate to lose. <b>Import backup</b> merges one back in.</p>
    <p><b>Reset this device</b> wipes the local copy only. If sharing is on, everything downloads again — it's a way to fix a device that's got itself confused, not a way to delete the plan.</p>
  </div>

  <div class="helpsec">
    <h3>When something looks wrong</h3>
    <p><b>A phone says Local only.</b> Paste the invite link into Sharing &amp; sync.</p>
    <p><b>Red dot after weeks of working.</b> The free database pauses after about a week of no use. Open the Supabase dashboard and press Restore — nothing is lost.</p>
    <p><b>Something's missing that the other person added.</b> Close and reopen the app, or tap the dot to force a sync. It checks every ten seconds while open, and immediately whenever you switch back to it.</p>
    <p><b>The shopping list looks wrong.</b> It's nearly always servings. Check the number next to each meal on the Plan tab.</p>
  </div>

  <div class="helpsec">
    <h3>Still to come</h3>
    <p>A freezer inventory, so finishing a batch cook adds portions and eating one takes it away. And <b>Start Cooking</b>, turning a recipe into a step-by-step guide with timers that chime when each step is due.</p>
  </div>

  <button class="btn" data-act="replaywelcome">Show the welcome cards again</button>`;
  sheet("How it works", h);
}

function toast(msg){
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2400);
}
function copyText(txt, okMsg){
  const done=()=>toast(okMsg||"Copied");
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallback());
  } else fallback();
  function fallback(){
    const ta=document.createElement("textarea");
    ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){ toast("Couldn't copy — select it manually"); }
    ta.remove();
  }
}
function listAsText(){
  const lines=[]; let cur=null;
  shoppingRows(week).forEach(r=>{
    if(r.aisle!==cur){ cur=r.aisle; lines.push(""); lines.push(cur.toUpperCase()); }
    lines.push((r.done?"[x] ":"[ ] ")+((r.qty!=null?prettyQty(r.qty,r.unit,true)+" ":"")+r.item).trim());
  });
  const d=weekDates(week);
  return "Shopping — "+fmtShort(d[0])+" to "+fmtShort(d[6])+"\n"+lines.join("\n").trim();
}

    + '<button data-act="update">Check for update</button>'

  document.body.appendChild(m);
  setTimeout(()=>document.addEventListener("click", function h(e){
    if(!m.contains(e.target)){ m.remove(); document.removeEventListener("click",h); }
  }),0);
}

document.addEventListener("click", e=>{
  const t=e.target.closest("[data-week],[data-add],[data-delmeal],[data-openrecipe],[data-act],[data-pick],[data-tick],[data-tickx],[data-hide],[data-delx],[data-close],[data-overlay],[data-addi],[data-adds],[data-rmi],[data-rms],[data-pfix],[data-pdis],[data-adjust],[data-step],[data-spendweek],[data-spendopen],[data-spendedit],[data-spweek],[data-spcur],[data-setcur],[data-spmode],[data-qweek],[data-fweek],[data-cookstart],[data-cookexit],[data-cooknext],[data-cookprev],[data-starttimer],[data-tcancel],[data-tplus],[data-clearfired],[data-gostep],[data-cookview]");
  if(!t) return;

  // ---- cook along ----
  if(t.dataset.cookstart!==undefined && t.hasAttribute("data-cookstart")){ startCooking(t.dataset.cookstart); return; }
  if(t.hasAttribute("data-cookexit")){ stopCooking(); return; }
  if(t.dataset.cookview){ cook.view = t.dataset.cookview; saveCook(); drawCook(); return; }
  if(t.hasAttribute("data-cooknext")){ cookMove(1); return; }
  if(t.hasAttribute("data-cookprev")){ cookMove(-1); return; }
  if(t.dataset.starttimer!==undefined && t.hasAttribute("data-starttimer")){ primeAudio(); startTimer(Number(t.dataset.starttimer)); return; }
  if(t.dataset.tplus){ addMinute(t.dataset.tplus); return; }
  if(t.dataset.tcancel){ cancelTimer(t.dataset.tcancel); return; }
  if(t.hasAttribute("data-clearfired")){ cook.timers = cook.timers.filter(x=>!x.fired); saveCook(); drawCook(); return; }
  if(t.dataset.gostep!==undefined && t.hasAttribute("data-gostep")){
    cook.i = Number(t.dataset.gostep);
    cook.timers = cook.timers.filter(x=>!x.fired);
    saveCook(); drawCook(); return;
  }
  if(t.hasAttribute("data-overlay") && e.target===t){ closeModal(); return; }
  if(t.hasAttribute("data-close")){ closeModal(); return; }

  if(t.dataset.week!==undefined){
    const n=Number(t.dataset.week);
    week = n===0 ? iso(weekStartOf(new Date())) : iso(addDays(parseISO(week), n*7));
    render(); window.scrollTo(0,0); return;
  }
  if(t.dataset.add){ const [d,s]=t.dataset.add.split("|"); openPicker(d,s); return; }
  if(t.dataset.delmeal){ drop(t.dataset.delmeal); render(); return; }
  if(t.dataset.openrecipe){ openRecipe(t.dataset.openrecipe); return; }
  if(t.dataset.pick){
    const serv=Number(document.getElementById("pserv").value)||household();
    const frozen=document.getElementById("pfrozen").checked;
    put("meal", uid("m-"), {date:pickTarget.dateISO, slot:pickTarget.slot, recipeId:t.dataset.pick,
                            servings:serv, order:Date.now(), frozen:frozen});
    closeModal(); render(); return;
  }
  if(t.dataset.qweek){ quickWeek = t.dataset.qweek; renderSpend(); return; }
  if(t.dataset.fweek){
    if(spendDraft.grab) spendDraft.grab();
    spendDraft.week = t.dataset.fweek; drawSpendSheet(); return;
  }
  if(t.dataset.spmode){ spendMode = t.dataset.spmode; spendWeekSel = null; renderSpend(); return; }
  if(t.dataset.spcur){
    if(spendDraft.grab) spendDraft.grab();
    spendDraft.cur = t.dataset.spcur; drawSpendSheet(); return;
  }
  if(t.dataset.setcur){
    modal.querySelectorAll("[data-setcur]").forEach(el=>el.classList.toggle("on", el===t));
    return;
  }
  if(t.dataset.spendweek){ spendWeekSel = (spendWeekSel===t.dataset.spendweek?null:t.dataset.spendweek); renderSpend(); return; }
  if(t.dataset.spendopen){ openSpendWeek(t.dataset.spendopen); return; }
  if(t.dataset.spendedit){ openSpend(t.dataset.spendedit); return; }
  if(t.dataset.spweek){
    if(spendDraft.grab) spendDraft.grab();
    spendDraft.week = iso(addDays(parseISO(spendDraft.week), Number(t.dataset.spweek)*7));
    drawSpendSheet(); return;
  }
  if(t.dataset.adjust){ openAdjust(t.dataset.adjust); return; }
  if(t.dataset.step){ stepAdjust(Number(t.dataset.step)); return; }
  if(t.dataset.tick){ const id=tickId(week,t.dataset.tick); put("tick", id, {week, key:t.dataset.tick, on:!isOn(id)}); renderShopping(); return; }
  if(t.dataset.hide){ put("hide", hideId(week,t.dataset.hide), {week, key:t.dataset.hide, on:true}); renderShopping(); return; }
  if(t.dataset.tickx){ const x=get(t.dataset.tickx); if(x) put("extra", x.id, Object.assign({},x.doc,{checked:!x.doc.checked})); renderShopping(); return; }
  if(t.dataset.delx){ drop(t.dataset.delx); renderShopping(); return; }
  if(t.hasAttribute("data-addi")){ commitInputs(); draft.ingredients.push({qty:"",unit:"",item:"",aisle:"Produce"}); drawEditor(); return; }
  if(t.hasAttribute("data-adds")){ commitInputs(); draft.steps.push({text:"",mins:""}); drawEditor(); return; }
  if(t.hasAttribute("data-rmi")){ commitInputs(); draft.ingredients.splice(Number(t.dataset.rmi),1); drawEditor(); return; }
  if(t.hasAttribute("data-rms")){ commitInputs(); draft.steps.splice(Number(t.dataset.rms),1); drawEditor(); return; }
  if(t.hasAttribute("data-pfix")){ commitInputs(); const n=parseNotes[Number(t.dataset.pfix)];
    if(n&&n.add) draft.ingredients.push(Object.assign({},n.add));
    parseNotes.splice(Number(t.dataset.pfix),1); drawEditor(); return; }
  if(t.hasAttribute("data-pdis")){ commitInputs(); parseNotes.splice(Number(t.dataset.pdis),1); drawEditor(); return; }

  const act=t.dataset.act; if(!act) return;
  if(act==="newrecipe") openEditor(null);
  else if(act==="pasterecipe") openPaste(t.dataset.id||null);
  else if(act==="dopaste") doPaste();
  else if(act==="editrecipe") openEditor(t.dataset.id, t.dataset.focus);
  else if(act==="saverecipe") saveRecipe();
  else if(act==="delrecipe"){
    if(confirm("Delete this recipe? Any planned meals using it will disappear.")){
      drop(t.dataset.id); closeModal(); render();
    }
  }
  else if(act==="clearweek"){
    if(confirm("Clear every meal from this week?")){ weekMeals(week).forEach(m=>drop(m.id)); render(); }
  }
  else if(act==="copylast"){
    const prevDays=weekDates(iso(addDays(parseISO(week),-7))).map(iso);
    const src=all("meal").filter(m=>prevDays.includes(m.doc.date));
    src.forEach(m=>{
      const offset = prevDays.indexOf(m.doc.date);
      put("meal", uid("m-"), Object.assign({}, m.doc, {date: iso(addDays(parseISO(week), offset)), order:Date.now()+offset}));
    });
    render(); toast(src.length?("Copied "+src.length+" "+plural(src.length,"meal")):"Last week was empty");
  }
  else if(act==="togglepicked"){
    showPicked = !showPicked; lsSet(PICKED_KEY, showPicked ? "1" : "");
    renderShopping(); window.scrollTo(0,0);
  }
  else if(act==="copylist") copyText(listAsText(), "List copied");
  else if(act==="resetlist"){
    all("tick").filter(i=>i.doc.week===week).forEach(i=>drop(i.id));
    all("hide").filter(i=>i.doc.week===week).forEach(i=>drop(i.id));
    renderShopping();
  }
  else if(act==="update"){
    /* Phones can sit on a cached copy for days. This throws the cache away
       and fetches the page fresh — the reliable way to pull in a new build. */
    closeMenu(); toast("Fetching the latest version…");
    (async()=>{
      try{
        if(window.caches){ const keys = await caches.keys(); await Promise.all(keys.map(k=>caches.delete(k))); }
        if(navigator.serviceWorker){
          const reg = await navigator.serviceWorker.getRegistration();
          if(reg) await reg.update();
        }
      }catch(e){ console.warn("update", e); }
      setTimeout(()=>location.reload(true), 700);
    })();
  }
  else if(act==="quickadd"){ quickAdd(); }
  else if(act==="money"){ closeMenu(); openMoney(); }
  else if(act==="savemoney"){
    const picked = modal.querySelector("[data-setcur].on");
    const rate = Number(document.getElementById("fxRate").value) || DEFAULT_RATE;
    put("setting","setting:money",{ cur:(picked && picked.dataset.setcur) || "QAR", rate:Math.round(rate*10000)/10000 });
    closeModal(); render(); toast("Showing amounts in "+curCode());
  }
  else if(act==="addspend"){ openSpend(null); if(t.dataset.week){ spendDraft.week=t.dataset.week; drawSpendSheet(); } }
  else if(act==="savespend"){ saveSpend(); }
  else if(act==="delspend"){
    if(confirm("Delete this receipt?")){ drop(spendDraft.id); closeModal(); render(); toast("Deleted"); }
  }
  else if(act==="adjsave"){ saveAdjust(); }
  else if(act==="adjreset"){ resetAdjust(); }
  else if(act==="additems"){ openAddItems(); }
  else if(act==="addbulk"){ addBulkItems(); }
  else if(act==="rotation"){ closeMenu(); openRotation(); }
  else if(act==="refillnow" || act==="refillnext"){
    const anchor = act==="refillnow" ? iso(weekStartOf(new Date())) : iso(addDays(weekStartOf(new Date()),7));
    const n = fillRotation(anchor, ROTATION_WEEKS);
    closeModal(); week = anchor; tab="plan"; render(); window.scrollTo(0,0);
    toast("Filled "+ROTATION_WEEKS+" weeks — "+n+" meals");
  }
  else if(act==="clearrotation"){
    const v = get("setting:rotation");
    const anchor = v ? v.doc.anchor : iso(weekStartOf(new Date()));
    if(confirm("Clear every planned meal for those "+ROTATION_WEEKS+" weeks?")){
      const n = clearRotation(anchor, ROTATION_WEEKS);
      closeModal(); render(); toast("Cleared "+n+" meals");
    }
  }
  else if(act==="help"){ closeMenu(); openHelp(); }
  else if(act==="replaywelcome"){ closeModal(); openWelcome(); }
  else if(act==="sharing"){ closeMenu(); openSharing(); }
  else if(act==="household"){
    const v=prompt("How many people are you usually cooking for?", household());
    if(v){ put("setting","setting:household",{value:Math.max(1,Number(v)||2)}); toast("Default set to "+household()); }
    closeMenu();
  }
  else if(act==="saveconn"){
    cfg.url=document.getElementById("cfgUrl").value.trim();
    cfg.key=document.getElementById("cfgKey").value.trim();
    cfg.hh =document.getElementById("cfgHh").value.trim();
    if(!cfg.url||!cfg.key||!cfg.hh){ toast("Fill in all three"); return; }
    saveCfg();
    Object.keys(S.items).forEach(id=>{ S.pending[id]=1; });   // upload what's already here
    S.watermark=null; saveLocal();
    setSync("busy");
    startSync();                                              // begin polling now, not on next load
    setTimeout(()=>{ openSharing(); if(syncState==="ok") toast("Connected — now send her the invite link"); }, 900);
  }
  else if(act==="join"){
    const v=document.getElementById("joinLink").value;
    if(!applyInvite(v)){ toast("That doesn't look like an invite link"); return; }
    S.seeded=true;                                       // take theirs, don't add samples
    Object.keys(S.items).forEach(id=>{ S.pending[id]=1; });
    saveLocal(); setSync("busy");
    startSync();                                              // begin polling now, not on next load
    setTimeout(()=>{ closeModal(); render(); toast(syncState==="ok"?"Joined — you're both on the same plan":"Couldn't reach it, check the link"); }, 900);
  }
  else if(act==="synctest"){ sync().then(()=>{ openSharing(); toast(syncState==="ok"?"All good":"Still failing"); }); }
  else if(act==="copyinvite") copyText(inviteLink(), "Invite link copied");
  else if(act==="copysql") copyText(SQL, "SQL copied");
  else if(act==="disconnect"){
    if(confirm("Stop syncing on this device? Your plan stays here but changes will no longer be shared.")){
      cfg={url:"",key:"",hh:""}; saveCfg(); clearInterval(syncTimer); setSync("off"); closeModal();
    }
  }
  else if(act==="export"){
    const blob=new Blob([JSON.stringify({items:S.items},null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="meal-plan-backup-"+iso(new Date())+".json"; a.click();
    URL.revokeObjectURL(a.href); closeMenu();
  }
  else if(act==="import"){
    const inp=document.createElement("input"); inp.type="file"; inp.accept="application/json";
    inp.onchange=()=>{
      const f=inp.files[0]; if(!f) return;
      const rd=new FileReader();
      rd.onload=()=>{
        try{
          const p=JSON.parse(rd.result);
          const items=p.items||p;
          if(typeof items!=="object") throw new Error("bad");
          Object.keys(items).forEach(id=>{ S.items[id]=items[id]; S.pending[id]=1; });
          saveLocal(); render(); kick(); toast("Backup merged in");
        }catch(err){ toast("That file didn't look right"); }
      };
      rd.readAsText(f);
    };
    inp.click(); closeMenu();
  }
  else if(act==="reset"){
    if(confirm("Erase everything on this device? If sharing is on, it will download again from the shared copy.")){
      S={items:{},pending:{},watermark:null,seeded:false};
      lsSet(DATA_KEY, JSON.stringify(S));
      if(connected()) sync().then(()=>{ migrateWeekStart(); ensureRecipes(); ensureRotation(); render(); }); else { migrateWeekStart(); ensureRecipes(); ensureRotation(); render(); }
    }
    closeMenu();
  }
});

/* Returns true if it actually wrote something, so the caller knows to redraw. */
function ensureRecipes(){
  let wrote = false;
  /* Clear retired starters whenever they turn up, whatever order the
     devices happen to sync in. Dropping an already-dropped id is a no-op. */
  RETIRED.forEach(id=>{ const it = S.items[id]; if(it && !it.deleted){ drop(id); wrote = true; } });
  const v = get("setting:recipes");
  if(!v || (v.doc.v||0) < RECIPE_SET){
    RECIPES.forEach(([id,doc])=>put("recipe", id, doc));
    put("setting","setting:recipes",{v:RECIPE_SET});
    S.seeded = true; wrote = true;
  }
  // Then any single-recipe updates that haven't been applied yet.
  const pv = get("setting:recipepatch");
  const done = (pv && Number(pv.doc.v)) || 0;
  let highest = done;
  RECIPE_PATCHES.forEach(p=>{
    // p.add creates a new one; without it we only update a recipe that's
    // still there, so a patch never resurrects something you deleted.
    if(p.v > done && (p.add || get(p.id))){ put("recipe", p.id, p.doc); wrote = true; }
    if(p.v > highest) highest = p.v;
  });
  if(highest > done) put("setting","setting:recipepatch",{v:highest});
  if(wrote) saveLocal();
  return wrote;
}

/* =========================================================
   9b. Cook along — step by step, with timers that keep running
       in the background while you get on with the next thing.
   ========================================================= */
const COOK_KEY = "mealplan.cook";
let cook = null;          // {recipeId, i, timers:[{tid, step, label, endsAt, mins, fired}]}
let cookTick = null, wakeLock = null, actx = null;

function saveCook(){ lsSet(COOK_KEY, cook ? JSON.stringify(cook) : ""); }

/* iPhones only allow sound and speech that started from a tap, so we warm
   both up on the Start cooking press and keep them alive for the session. */
function primeAudio(){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === "suspended") actx.resume();
  }catch(e){}
  try{
    if(window.speechSynthesis){
      const u = new SpeechSynthesisUtterance(" ");
      u.volume = 0; speechSynthesis.speak(u);
    }
  }catch(e){}
}
function chime(){
  if(!actx) return;
  const t0 = actx.currentTime;
  [880, 1318.5].forEach((f,i)=>{
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "sine"; o.frequency.value = f;
    const s = t0 + i*0.2;
    g.gain.setValueAtTime(0.0001, s);
    g.gain.exponentialRampToValueAtTime(0.4, s+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, s+0.55);
    o.connect(g); g.connect(actx.destination);
    o.start(s); o.stop(s+0.6);
  });
}
function say(text){
  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.95; u.lang = "en-GB";
    speechSynthesis.speak(u);
  }catch(e){}
}
async function keepAwake(){
  try{ if(navigator.wakeLock && !wakeLock) wakeLock = await navigator.wakeLock.request("screen"); }
  catch(e){ /* refused, or unsupported — the session still works */ }
}
function releaseAwake(){ try{ if(wakeLock){ wakeLock.release(); wakeLock = null; } }catch(e){} }
document.addEventListener("visibilitychange", ()=>{
  if(cook && document.visibilityState === "visible"){ wakeLock = null; keepAwake(); checkTimers(); }
});

const shortLabel = s => { const w = String(s).split(/\s+/); return w.slice(0,4).join(" ") + (w.length>4?"…":""); };

/* Match an ingredient name inside a step, allowing for the plural:
   "cherry tomatoes" in the list finds "cherry tomato" or "tomatoes" in the text. */
function ingRegex(item){
  const clean = String(item).trim().toLowerCase().replace(/[^\w\s'-]/g," ").replace(/\s+/g," ");
  const words = clean.split(" ").filter(Boolean);
  if(!words.length) return null;
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const last = singular(words.pop());
  const head = words.map(esc).join("\\s+");
  return new RegExp("\\b" + (head ? head + "\\s+" : "") + esc(last) + "(e?s)?\\b", "i");
}
/* Which ingredients does this step mention, and how much of them?
   Skipped when the step already spells the amount out itself, so you don't
   get "Toss with 1 tsp olive oil (2tsp)". */
function stepAmounts(doc, idx){
  const s = doc.steps[idx]; if(!s) return [];
  const text = s.text || "";
  const ings = (doc.ingredients||[]).filter(i=>i.item);
  /* Recipes say "the cream cheese" where the list says "light cream cheese",
     so try dropping leading words — but only while the shortened name still
     picks out one ingredient, so "oil" never stands for two different oils. */
  const suffixes = item => {
    const w = String(item).trim().split(/\s+/);
    return w.map((_,n)=>w.slice(n).join(" "));
  };
  const claims = c => ings.filter(o=>suffixes(o.item).some(x=>x.toLowerCase()===c.toLowerCase())).length;

  const out = [];
  ings.forEach(ing=>{
    if(ing.qty==null || ing.qty==="") return;
    const cands = suffixes(ing.item);
    for(let n=0; n<cands.length; n++){
      const c = cands[n];
      if(n > 0 && claims(c) > 1) break;              // too vague to be sure
      const re = ingRegex(c); if(!re) continue;
      const m = text.match(re); if(!m) continue;
      const before = text.slice(Math.max(0, m.index-16), m.index);
      if(/\d\s*(g|kg|ml|l|tsp|tbsp|clove|can|pack)?\s*$/i.test(before)) return;  // already stated
      out.push(ing);
      return;
    }
  });
  // Longest names win, so "cherry tomatoes" doesn't also drag in "tomatoes".
  return out.filter(a=>!out.some(b=>b!==a
      && b.item.toLowerCase().includes(a.item.toLowerCase())
      && b.item.length > a.item.length));
}
const mmss = ms => {
  const t = Math.max(0, Math.round(ms/1000));
  return Math.floor(t/60) + ":" + String(t%60).padStart(2,"0");
};

function startCooking(id){
  const r = recipeById(id); if(!r || !r.doc.steps.length) return;
  primeAudio(); keepAwake();
  cook = { recipeId:id, i:0, timers:[] };
  saveCook(); closeModal(); drawCook();
  clearInterval(cookTick);
  cookTick = setInterval(tickCook, 500);
}
function stopCooking(){
  clearInterval(cookTick); cookTick = null;
  releaseAwake();
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
  cook = null; saveCook();
  const el = document.getElementById("cookwrap"); if(el) el.remove();
  render();
}
function cookRecipe(){ return cook ? recipeById(cook.recipeId) : null; }

function startTimer(stepIndex){
  const r = cookRecipe(); if(!r) return;
  const s = r.doc.steps[stepIndex]; if(!s || !s.mins) return;
  if(cook.timers.some(t=>t.step===stepIndex && !t.fired)) return;
  cook.timers.push({ tid:uid("t-"), step:stepIndex, label:shortLabel(s.text),
                     endsAt: Date.now() + Number(s.mins)*60000, mins:Number(s.mins), fired:false });
  saveCook(); drawCook();
}
function addMinute(tid){
  const t = cook.timers.find(x=>x.tid===tid); if(!t) return;
  t.endsAt += 60000; t.fired = false;
  saveCook(); drawCook();
}
function cancelTimer(tid){
  cook.timers = cook.timers.filter(t=>t.tid!==tid);
  saveCook(); drawCook();
}
/* Fires anything that has come due — including while the app was asleep.
   What it says depends on where you are. If the timer belongs to the step
   you're standing on, the useful thing to hear is what to do next. If it's
   a pan you left running while you moved on, the next step in the list has
   nothing to do with it, so it names the timer instead and offers to jump. */
function checkTimers(){
  if(!cook) return;
  const now = Date.now();
  const due = cook.timers.filter(t=>!t.fired && t.endsAt <= now);
  if(!due.length) return;
  const r = cookRecipe();
  const steps = (r && r.doc.steps) || [];

  due.forEach(t=>{
    t.fired = true;
    const nextIdx = t.step + 1;
    const onThisStep = t.step >= cook.i;             // you're standing at the pan
    if(onThisStep && nextIdx < steps.length){
      t.speak  = "Next. " + steps[nextIdx].text;
      t.banner = "Next: " + steps[nextIdx].text;
      t.go = nextIdx;
    }else if(onThisStep){
      t.speak  = "That's the last step. You're done.";
      t.banner = "That was the last step.";
      t.go = null;
    }else{
      t.speak  = "Your " + t.mins + " minute timer has finished.";
      t.banner = (steps[t.step] || {}).text || t.label;
      t.go = nextIdx < steps.length ? nextIdx : null;
    }
  });
  saveCook();
  chime();
  const line = due.map(t=>t.speak).join(" And. ");
  setTimeout(()=>say(line), 750);
  drawCook();
}
function tickCook(){
  if(!cook) return;
  checkTimers();
  const now = Date.now();
  document.querySelectorAll("[data-endsat]").forEach(el=>{
    el.textContent = mmss(Number(el.dataset.endsat) - now);
  });
}

function drawCook(){
  if(!cook) return;
  const r = cookRecipe();
  if(!r){ stopCooking(); return; }
  const steps = r.doc.steps, i = cook.i, s = steps[i];
  const now = Date.now();
  const done = i >= steps.length;

  const rung = cook.timers.filter(t=>!t.fired)
    .map(t=>'<span class="chip"><span class="cl">'+esc(t.label)+'</span>'
      + '<span class="cd" data-endsat="'+t.endsAt+'">'+mmss(t.endsAt-now)+'</span>'
      + '<button class="cx" data-tcancel="'+t.tid+'" aria-label="Cancel">×</button></span>').join("");
  const rang = cook.timers.filter(t=>t.fired)
    .map(t=>'<span class="chip ready"><span class="cl">'+esc(t.label)+'</span><span class="cd">done</span>'
      + '<button class="cx" data-tcancel="'+t.tid+'" aria-label="Clear">×</button></span>').join("");

  const fired = cook.timers.filter(t=>t.fired);
  const jumpTo = fired.length===1 && fired[0].go!=null && fired[0].go!==i ? fired[0].go : null;
  const alert = fired.length
    ? '<div class="cookalert"><div class="at">'
      + esc(fired.map(t=>t.banner || (steps[t.step]||{}).text || t.label).join(" · "))
      + '</div>'
      + (jumpTo!=null ? '<button data-gostep="'+jumpTo+'">Go there</button>' : "")
      + '<button data-clearfired>Got it</button></div>'
    : "";

  let mainHTML;
  if(done){
    mainHTML = '<div class="cdone"><div class="big">That\'s everything.</div>'
      + '<p class="muted">Enjoy it.</p>'
      + '<button class="bigbtn" data-cookexit style="margin-top:18px">Finish</button></div>';
  }else{
    const live = cook.timers.find(t=>t.step===i && !t.fired);
    let timerHTML = "";
    if(s.mins && live){
      timerHTML = '<div class="running"><span class="cd" data-endsat="'+live.endsAt+'">'+mmss(live.endsAt-now)+'</span>'
        + '<span class="rl">of '+s.mins+' min</span>'
        + '<button class="btn sm" data-tplus="'+live.tid+'">+1 min</button>'
        + '<button class="btn sm ghost" data-tcancel="'+live.tid+'">Stop</button></div>';
    }else if(s.mins){
      timerHTML = '<button class="bigbtn ghost" data-starttimer="'+i+'">Start '+s.mins+' min timer</button>';
    }
    const amts = stepAmounts(r.doc, i);
    const amtHTML = amts.length
      ? '<div class="amts">'+amts.map(a=>'<span class="amt"><b>'+prettyQty(a.qty,a.unit)+'</b> '+esc(a.item)+'</span>').join("")+'</div>'
      : "";
    mainHTML = '<div class="cnum">'+(i+1)+'</div><p class="ctext">'+esc(s.text)+'</p>'
      + amtHTML
      + '<div class="ctimer">'+timerHTML+'</div>';
  }

  /* The whole recipe, without giving up your place or stopping anything. */
  if(cook.view === "recipe"){
    const back = done ? "Back" : "Back to step "+(i+1);
    let ov = '<label class="f">Ingredients</label><div style="margin-bottom:22px">'
      + r.doc.ingredients.map(ing=>'<div class="ingline"><span style="min-width:78px;font-weight:700">'
        + prettyQty(ing.qty,ing.unit)+'</span><span>'+esc(ing.item)+'</span></div>').join("")
      + '</div><label class="f">Method</label><ol class="method ovmethod">'
      + steps.map((st,n)=>'<li'+(n===i?' class="here" id="curstep"':'')+'>'+esc(st.text)
        + (st.mins?'<span class="t">'+st.mins+' min</span>':"")+'</li>').join("")
      + '</ol>';
    const ovHTML = '<div class="cookwrap" id="cookwrap">'
      + '<div class="cookbar"><button class="btn sm ghost" data-cookexit>Exit</button>'
      + '<div class="ctitle">'+esc(r.doc.name)+'</div>'
      + '<button class="btn sm" data-cookview="step">'+back+'</button></div>'
      + alert
      + ((rung||rang) ? '<div class="chips">'+rung+rang+'</div>' : "")
      + '<div class="cookmain" style="padding-top:14px">'+ov+'</div>'
      + '<div class="cooknav"><button class="btn primary" data-cookview="step" style="flex:1">'+back+'</button></div>'
      + '</div>';
    const prev = document.getElementById("cookwrap");
    if(prev) prev.outerHTML = ovHTML; else document.body.insertAdjacentHTML("beforeend", ovHTML);
    const cur = document.getElementById("curstep");
    if(cur) cur.scrollIntoView({block:"center"});
    return;
  }

  const html = '<div class="cookwrap" id="cookwrap">'
    + '<div class="cookbar"><button class="btn sm ghost" data-cookexit>Exit</button>'
    + '<div class="ctitle">'+esc(r.doc.name)+'</div>'
    + '<button class="btn sm ghost" data-cookview="recipe" title="Whole recipe">☰</button>'
    + '<div class="cstep">'+(done?"done":(i+1)+" / "+steps.length)+'</div></div>'
    + '<div class="cprog"><i style="width:'+Math.round((Math.min(i,steps.length)/steps.length)*100)+'%"></i></div>'
    + alert
    + ((rung||rang) ? '<div class="chips">'+rung+rang+'</div>' : "")
    + '<div class="cookmain">'+mainHTML+'</div>'
    + (done ? "" : '<div class="cooknav">'
       + '<button class="btn" data-cookprev '+(i===0?"disabled":"")+'>Back</button>'
       + '<button class="btn primary" data-cooknext>'+(i===steps.length-1?"Finish":"Next")+'</button></div>')
    + '</div>';

  const old = document.getElementById("cookwrap");
  if(old) old.outerHTML = html; else document.body.insertAdjacentHTML("beforeend", html);
}

function cookMove(d){
  if(!cook) return;
  const r = cookRecipe(); if(!r) return;
  const next = cook.i + d;
  if(next < 0) return;
  cook.i = Math.min(next, r.doc.steps.length);
  saveCook(); drawCook();
}
function restoreCook(){
  let saved = null;
  try{ saved = JSON.parse(lsGet(COOK_KEY) || "null"); }catch(e){}
  if(!saved || !saved.recipeId || !recipeById(saved.recipeId)) { cook = null; saveCook(); return; }
  // Only worth resuming if something is still counting down.
  const live = (saved.timers||[]).some(t=>!t.fired && t.endsAt > Date.now());
  if(!live){ cook = null; saveCook(); return; }
  cook = saved;
  drawCook();
  clearInterval(cookTick);
  cookTick = setInterval(tickCook, 500);
  keepAwake();
}
